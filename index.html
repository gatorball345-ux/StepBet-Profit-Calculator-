<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
  color: white;
}

.clear-btn { background: #ef4444; }

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

/* Toggle */
.toggle {
  display: grid;
  grid-template-columns: 1fr 60px 1fr;
  align-items: center;
  margin-bottom: 10px;
}

.mode-label,
.mode-right {
  font-size: 14px;
  opacity: 0.5;
  transition: 0.2s;
}

.mode-label { text-align: left; }
.mode-right { text-align: right; }

.active {
  opacity: 1;
  font-weight: bold;
  color: #22c55e;
}

.switch {
  position: relative;
  width: 52px;
  height: 28px;
  justify-self: center;
}

.switch input { opacity: 0; }

.slider {
  position: absolute;
  inset: 0;
  background: #374151;
  border-radius: 34px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider:before {
  transform: translateX(24px);
}

/* History */
.history-wrapper {
  position: relative;
  overflow: hidden;
  margin-bottom: 8px;
  border-radius: 10px;
}

.delete-bg {
  position: absolute;
  inset: 0;
  background: #ef4444;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 20px;
  font-weight: bold;
}

.history-item {
  position: relative;
  background: #111827;
  padding: 12px;
  border-radius: 10px;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.history-mode {
  font-weight: bold;
  color: #22c55e;
  margin-bottom: 4px;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.show { display: flex; }

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  width: 80%;
  max-width: 300px;
  text-align: center;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

/* UNDO BAR */
.undo-bar {
  position: fixed;
  bottom: -80px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  padding: 12px 16px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 90%;
  max-width: 400px;
  transition: bottom 0.3s ease;
}

.undo-bar.show {
  bottom: 20px;
}

.undo-btn {
  color: #22c55e;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<div class="toggle">
  <span id="nonMemberLabel" class="mode-label active">Non-Member (-15%)</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle">
    <span class="slider"></span>
  </label>

  <span id="memberLabel" class="mode-right">Member</span>
</div>

<input id="pot" placeholder="Total Pot">
<input id="entry" placeholder="Entry Fee">
<input id="players" placeholder="Eligible Winners">

<button id="calculateBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<!-- DELETE MODAL -->
<div id="deleteModal" class="modal">
  <div class="modal-box">
    <h3>Delete this entry?</h3>
    <div class="modal-actions">
      <button id="cancelDelete">Cancel</button>
      <button id="confirmDelete" class="clear-btn">Delete</button>
    </div>
  </div>
</div>

<!-- UNDO BAR -->
<div id="undoBar" class="undo-bar">
  <span>Item deleted</span>
  <span id="undoBtn" class="undo-btn">UNDO</span>
</div>

<script>
const toggle = document.getElementById("memberToggle");
const nonMemberLabel = document.getElementById("nonMemberLabel");
const memberLabel = document.getElementById("memberLabel");

let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
let deleteIndex = null;
let lastDeleted = null;
let undoTimeout = null;

/* Toggle */
function updateMode() {
  if (toggle.checked) {
    nonMemberLabel.classList.remove("active");
    memberLabel.classList.add("active");
  } else {
    nonMemberLabel.classList.add("active");
    memberLabel.classList.remove("active");
  }
}
toggle.addEventListener("change", updateMode);
updateMode();

/* Save */
function saveHistory() {
  localStorage.setItem("stepbetHistory", JSON.stringify(history));
}

/* Render */
function renderHistory() {
  const container = document.getElementById("history");
  container.innerHTML = "";

  history.forEach((item, index) => {

    const wrapper = document.createElement("div");
    wrapper.className = "history-wrapper";

    const bg = document.createElement("div");
    bg.className = "delete-bg";
    bg.textContent = "DELETE";

    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <div class="history-mode">${item.mode}</div>
      <strong>Payout:</strong> $${item.payout.toFixed(2)}<br>
      <strong>Profit:</strong> ${item.profit >= 0 ? "+" : ""}$${item.profit.toFixed(2)}<br>
      <strong>ROI:</strong> ${item.roi.toFixed(1)}%
    `;

    let startX = 0;
    let startTime = 0;
    let currentX = 0;

    div.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      startTime = Date.now();
      div.style.transition = "none";
    });

    div.addEventListener("touchmove", e => {
      const diff = e.touches[0].clientX - startX;

      if (diff < 0) {
        currentX = Math.max(diff, -160);
        div.style.transform = `translateX(${currentX}px)`;

        const fade = 1 - Math.abs(currentX) / 180;
        div.style.opacity = Math.max(fade, 0.5);
      }
    });

    div.addEventListener("touchend", () => {
      const diff = currentX;
      const time = Date.now() - startTime;
      const velocity = Math.abs(diff) / time;

      const shouldDelete = diff < -100 || velocity > 0.75;

      div.style.transition = "transform 0.25s ease, opacity 0.25s ease";

      if (shouldDelete) {
        div.style.transform = "translateX(-160px)";
        div.style.opacity = "0.5";

        setTimeout(() => {
          deleteIndex = index;
          document.getElementById("deleteModal").classList.add("show");
        }, 180);
      } else {
        div.style.transform = "translateX(0)";
        div.style.opacity = "1";
      }

      currentX = 0;
    });

    wrapper.appendChild(bg);
    wrapper.appendChild(div);
    container.appendChild(wrapper);
  });
}

/* Delete */
document.getElementById("confirmDelete").onclick = () => {
  lastDeleted = history.splice(deleteIndex, 1)[0];
  saveHistory();
  renderHistory();
  document.getElementById("deleteModal").classList.remove("show");

  showUndo();
};

document.getElementById("cancelDelete").onclick = () => {
  document.getElementById("deleteModal").classList.remove("show");
};

/* Undo */
function showUndo() {
  const bar = document.getElementById("undoBar");
  bar.classList.add("show");

  clearTimeout(undoTimeout);
  undoTimeout = setTimeout(() => {
    bar.classList.remove("show");
    lastDeleted = null;
  }, 4000);
}

document.getElementById("undoBtn").onclick = () => {
  if (lastDeleted) {
    history.unshift(lastDeleted);
    saveHistory();
    renderHistory();
    lastDeleted = null;
  }

  document.getElementById("undoBar").classList.remove("show");
};

/* Calculate */
document.getElementById("calculateBtn").addEventListener("click", () => {

  const pot = parseFloat(document.getElementById("pot").value);
  const entry = parseFloat(document.getElementById("entry").value);
  const players = parseFloat(document.getElementById("players").value);

  if (!pot || !entry || !players) return;

  const isMember = toggle.checked;
  const adjustedPot = isMember ? pot : pot * 0.85;

  const payout = adjustedPot / players;
  const profit = payout - entry;
  const roi = (profit / entry) * 100;

  const breakEvenPlayers = Math.round(adjustedPot / entry);
  const breakEvenPayout = adjustedPot / breakEvenPlayers;
  const breakEvenProfit = breakEvenPayout - entry;
  const breakEvenROI = (breakEvenProfit / entry) * 100;

  document.getElementById("result").innerHTML = `
    Payout: $${payout.toFixed(2)}<br>
    ${players} players: ${profit >= 0 ? "+" : ""}$${profit.toFixed(2)} (${roi.toFixed(1)}% ROI)
    <br><br>
    Break-even: ${breakEvenPlayers} players<br>
    ${breakEvenPlayers} players: ${breakEvenProfit >= 0 ? "+" : ""}$${breakEvenProfit.toFixed(2)} (${breakEvenROI.toFixed(1)}% ROI)
  `;

  history.unshift({
    payout,
    profit,
    roi,
    mode: isMember ? "Member" : "Non-Member"
  });

  saveHistory();
  renderHistory();
});

/* Clear */
document.getElementById("clearBtn").onclick = () => {
  history = [];
  saveHistory();
  renderHistory();
};

renderHistory();
</script>

</body>
</html>
