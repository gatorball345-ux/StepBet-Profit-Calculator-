<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {margin:0;font-family:Arial;background:#020c1b;color:white;}
.container {max-width:420px;margin:auto;padding:15px;}

.header {
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
gap:8px;
}

.title {font-size:22px;color:#ff9d3c;}

.input {
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:none;
background:#0c1f3a;
color:white;
text-align:center;
font-size:16px;
}

/* DATE */
.date-wrap {position:relative;}
.date-placeholder {
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:rgba(255,255,255,0.5);
pointer-events:none;
font-size:16px;
}

/* TOGGLE */
.toggle-wrap {
margin-top:10px;
background:#0f1e33;
border-radius:30px;
position:relative;
display:flex;
overflow:hidden;
cursor:pointer;
}
.toggle-slider {
position:absolute;
top:0;
left:0;
width:50%;
height:100%;
background:#1db954;
border-radius:30px;
transition:0.3s;
}
.toggle-option {flex:1;padding:10px;text-align:center;z-index:1;}

.note {
text-align:center;
font-size:13px;
margin-top:6px;
opacity:0.85;
}

/* BUTTONS */
.btn {padding:10px;border:none;border-radius:10px;color:white;margin-top:6px;}
.blue {background:#3c66c2;width:100%;}
.red {background:#a02222;}
.gray {background:#3c66c2;}

.section {display:flex;justify-content:space-between;margin-top:15px;}

.card {
background:#0c1f3a;
padding:12px;
border-radius:10px;
margin-top:8px;
touch-action: pan-y;
}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}

.calc-active {
box-shadow:0 0 30px rgba(60,102,194,1);
transform:scale(0.95);
}

/* UNDO */
.undo-bar {
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#ffaa00;
color:black;
padding:14px 22px;
border-radius:16px;
display:flex;
gap:12px;
align-items:center;
box-shadow:0 0 20px rgba(255,170,0,0.9);
font-weight:bold;
z-index:9999;
}
.undo-bar button {
background:black;color:white;border:none;
padding:6px 12px;border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">StepCat</div>

<button class="btn gray" id="toggleNamePref">Name Restore: ON</button>
<button class="btn red" id="clearInputsBtn">Clear Entries</button>
</div>

<input id="name" class="input" placeholder="Game Name (optional)">

<div class="date-wrap">
<input id="start" type="date" class="input">
<span class="date-placeholder" id="startPH">Game Start Date</span>
</div>

<div class="date-wrap">
<input id="end" type="date" class="input">
<span class="date-placeholder" id="endPH">Game End Date</span>
</div>

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Prospects">

<div class="toggle-wrap" id="toggleWrap">
<div id="slider" class="toggle-slider"></div>
<div class="toggle-option">👤 Non-Member</div>
<div class="toggle-option">⭐ Member</div>
</div>

<div id="modeNote" class="note">
Non-member: 15% platform fee applied
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
<b>Totals</b>
<button class="btn red" id="clearTotalsBtn">Clear Totals</button>
</div>
<div id="totals"></div>

<div class="section">
<b>History</b>
<button class="btn red" id="clearHistoryBtn">Clear History</button>
</div>
<div id="history"></div>

</div>

<script>
(function(){

let mode="non";
let rememberName = localStorage.getItem("rememberName") !== "false";

/* ELEMENTS */
const slider=document.getElementById("slider");
const modeNote=document.getElementById("modeNote");

const nameBtn=document.getElementById("toggleNamePref");

const nameEl=document.getElementById("name");
const startEl=document.getElementById("start");
const endEl=document.getElementById("end");
const startPH=document.getElementById("startPH");
const endPH=document.getElementById("endPH");

const potEl=document.getElementById("pot");
const feeEl=document.getElementById("fee");
const winEl=document.getElementById("win");

const calcBtn=document.getElementById("calcBtn");

const totalsDiv=document.getElementById("totals");
const historyDiv=document.getElementById("history");

let totals=JSON.parse(localStorage.getItem("totals")||"[]");
let history=JSON.parse(localStorage.getItem("history")||"[]");

let lastState=null;

/* DATE FORMAT */
function formatDate(d){
if(!d) return "";
let dt=new Date(d);
return `${dt.getMonth()+1}-${dt.getDate()}-${dt.getFullYear()}`;
}

/* DATE PLACEHOLDER */
startEl.onchange=()=>startPH.style.display=startEl.value?"none":"block";
endEl.onchange=()=>endPH.style.display=endEl.value?"none":"block";

/* TOGGLE */
document.getElementById("toggleWrap").onclick=function(){
mode=(mode==="non")?"mem":"non";
slider.style.left=(mode==="mem")?"50%":"0%";

modeNote.innerText=(mode==="mem")
?"Member: Full payout (no fee)"
:"Non-member: 15% platform fee applied";
};

/* NAME PREF */
function updateNameBtn(){
nameBtn.innerText = rememberName ? "Name Restore: ON" : "Name Restore: OFF";
}
updateNameBtn();

nameBtn.onclick=function(){
rememberName=!rememberName;
localStorage.setItem("rememberName",rememberName);
updateNameBtn();
};

/* SAVE */
function save(){
localStorage.setItem("totals",JSON.stringify(totals));
localStorage.setItem("history",JSON.stringify(history));
}

/* SNAPSHOT */
function snapshot(){
lastState={
totals:JSON.parse(JSON.stringify(totals)),
history:JSON.parse(JSON.stringify(history)),
inputs:{
name:nameEl.value,
start:startEl.value,
end:endEl.value,
pot:potEl.value,
fee:feeEl.value,
win:winEl.value
}
};
}

/* UNDO */
window.undoAction=function(){
if(!lastState) return;

totals=lastState.totals;
history=lastState.history;

potEl.value=lastState.inputs.pot;
feeEl.value=lastState.inputs.fee;
winEl.value=lastState.inputs.win;
startEl.value=lastState.inputs.start;
endEl.value=lastState.inputs.end;

if(lastState.inputs.name && rememberName){
nameEl.value=lastState.inputs.name;
}

save();
render();
removeUndo();
};

/* CALCULATE */
calcBtn.onclick=function(){

calcBtn.classList.add("calc-active");
calcBtn.innerText="Calculating...";

setTimeout(()=>{

let p=parseFloat(potEl.value);
let f=parseFloat(feeEl.value);
let w=parseFloat(winEl.value);

if(isNaN(p)||isNaN(f)||isNaN(w)){
alert("Enter values");
return;
}

let payout=(mode==="mem")?(p/w):(p/w)*0.85;
let profit=payout-f;
let roi=(profit/f)*100;

let entry={
name:nameEl.value,
start:startEl.value,
end:endEl.value,
payout,profit,roi
};

/* PUSH + SORT ASCENDING */
totals.push(entry);
history.push(entry);

totals.sort((a,b)=>new Date(a.start||0)-new Date(b.start||0));
history.sort((a,b)=>new Date(a.start||0)-new Date(b.start||0));

save();
render();

calcBtn.classList.remove("calc-active");
calcBtn.innerText="Calculate";

},250);
};

/* SWIPE */
function addSwipe(el,index,type){
let startX=0;

el.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});

el.addEventListener("touchend",e=>{
let diff=e.changedTouches[0].clientX-startX;

/* RIGHT = COPY */
if(diff>80){
exportEntry(type==="totals"?totals[index]:history[index]);
return;
}

/* LEFT = DELETE */
if(diff<-80){
snapshot();

if(type==="totals") totals.splice(index,1);
else history.splice(index,1);

save();render();showUndo("Deleted");
}
});
}

/* COPY */
function exportEntry(e){
let text=`${e.name||"Game"}
${formatDate(e.start)}${e.end?" → "+formatDate(e.end):""}

Payout: $${e.payout.toFixed(2)}
Profit: $${e.profit.toFixed(2)}
ROI: ${e.roi.toFixed(1)}%`;

let input=document.createElement("input");
input.value=text;
document.body.appendChild(input);
input.select();
document.execCommand("copy");
document.body.removeChild(input);
}

/* UNDO BAR */
function showUndo(label){
removeUndo();

let bar=document.createElement("div");
bar.className="undo-bar";
bar.innerHTML=`${label} <button onclick="undoAction()">UNDO</button>`;
document.body.appendChild(bar);

setTimeout(removeUndo,3000);
}

function removeUndo(){
let bar=document.querySelector(".undo-bar");
if(bar) bar.remove();
}

/* RENDER */
function render(){

totalsDiv.innerHTML=totals.map((e,i)=>card(e,"t",i)).join("");
historyDiv.innerHTML=history.map((e,i)=>card(e,"h",i)).join("");

totals.forEach((_,i)=>addSwipe(document.getElementById("t"+i),i,"totals"));
history.forEach((_,i)=>addSwipe(document.getElementById("h"+i),i,"history"));
}

function card(e,prefix,i){
return `<div class="card" id="${prefix}${i}">
<b>${e.name||"Game"}</b><br>
${formatDate(e.start)}${e.end?" → "+formatDate(e.end):""}<br><br>
Payout: $${e.payout.toFixed(2)}<br>
<span class="${e.profit>=0?'profit':'loss'}">Profit: $${e.profit.toFixed(2)}</span><br>
<span class="roi">ROI: ${e.roi.toFixed(1)}%</span>
</div>`;
}

/* CLEAR */
document.getElementById("clearInputsBtn").onclick=()=>{
snapshot();
nameEl.value="";
startEl.value="";
endEl.value="";
potEl.value="";
feeEl.value="";
winEl.value="";
showUndo("Entries Cleared");
};

document.getElementById("clearTotalsBtn").onclick=()=>{
snapshot();
totals=[];save();render();showUndo("Totals Cleared");
};

document.getElementById("clearHistoryBtn").onclick=()=>{
snapshot();
history=[];save();render();showUndo("History Cleared");
};

render();

})();
</script>

</body>
</html>
