<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
  color: white;
}

.clear-btn { background: #ef4444; }

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

.history-item {
  background: #111827;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  transition: transform 0.2s ease;
}

.swiping {
  background: #7f1d1d;
}

.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Toggle */
.switch {
  position: relative;
  width: 52px;
  height: 28px;
}

.switch input {
  opacity: 0;
}

.slider {
  position: absolute;
  inset: 0;
  background: #374151;
  border-radius: 34px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider:before {
  transform: translateX(24px);
}

.note {
  font-size: 12px;
  color: #94a3b8;
  margin: 4px 0 8px;
  text-align: left;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  width: 85%;
  max-width: 300px;
  text-align: center;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<div class="toggle">
  <span>Non-Member</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle">
    <span class="slider"></span>
  </label>

  <span>Member</span>
</div>

<input id="pot" placeholder="Total Pot" type="number">
<input id="entry" placeholder="Entry Fee" type="number">
<input id="players" placeholder="Eligible Winners" type="number">

<button id="calculateBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div class="note">Swipe left on a result to delete</div>
<div id="history"></div>

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<!-- MODAL -->
<div id="deleteModal" class="modal">
  <div class="modal-box">
    <h3>Delete Entry?</h3>
    <div class="modal-actions">
      <button id="cancelDelete">Cancel</button>
      <button id="confirmDelete" class="clear-btn">Delete</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const entryInput = document.getElementById("entry");
  const potInput = document.getElementById("pot");
  const playersInput = document.getElementById("players");
  const calculateBtn = document.getElementById("calculateBtn");
  const historyDiv = document.getElementById("history");
  const clearBtn = document.getElementById("clearBtn");

  const modal = document.getElementById("deleteModal");
  const confirmDelete = document.getElementById("confirmDelete");
  const cancelDelete = document.getElementById("cancelDelete");

  let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
  let deleteIndex = null;

  function save() {
    localStorage.setItem("stepbetHistory", JSON.stringify(history));
  }

  function calculate() {
    const entry = +entryInput.value;
    const pot = +potInput.value;
    const players = +playersInput.value;

    if (!entry || !pot || !players) return;

    const payout = +(pot / players).toFixed(2);
    const profit = +(payout - entry).toFixed(2);
    const roi = +((profit / entry) * 100).toFixed(1);

    document.getElementById("result").innerHTML =
      `Payout: $${payout}<br>
       ${players} players: ${profit >= 0 ? "+" : ""}$${profit} (${roi}% ROI)`;

    history.unshift({ payout, profit, roi });
    save();
    render();
  }

  function render() {
    historyDiv.innerHTML = "";

    history.forEach((h, index) => {
      const div = document.createElement("div");
      div.className = "history-item";

      div.innerHTML = `$${h.payout} | ${h.profit >= 0 ? "+" : ""}$${h.profit} | ${h.roi}%`;

      let startX = 0;

      div.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
      });

      div.addEventListener("touchmove", e => {
        const diff = e.touches[0].clientX - startX;

        if (diff < -30) {
          div.style.transform = `translateX(${diff}px)`;
          div.classList.add("swiping");
        }
      });

      div.addEventListener("touchend", e => {
        const diff = e.changedTouches[0].clientX - startX;

        if (diff < -80) {
          deleteIndex = index;
          modal.classList.add("show");
        }

        div.style.transform = "";
        div.classList.remove("swiping");
      });

      historyDiv.appendChild(div);
    });
  }

  confirmDelete.onclick = () => {
    history.splice(deleteIndex, 1);
    save();
    modal.classList.remove("show");
    render();
  };

  cancelDelete.onclick = () => modal.classList.remove("show");

  clearBtn.onclick = () => {
    history = [];
    save();
    render();
  };

  calculateBtn.onclick = calculate;

  render();

});
</script>

</body>
</html>
