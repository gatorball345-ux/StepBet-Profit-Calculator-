<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial;
    background:#020c1b;
    color:white;
    overflow-x:hidden;
}

.container{
    max-width:420px;
    margin:auto;
    padding:16px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:22px;
    color:#ff9d3c;
}

/* INPUT */
.input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:12px;
    border:none;
    background:#0c1f3a;
    color:white;
    text-align:center;
}

/* BUTTONS */
.btn{
    border:none;
    border-radius:12px;
    padding:10px 14px;
    color:white;
}

.red{background:#a02222;}
.blue{
    width:100%;
    padding:16px;
    margin-top:8px;
    background:#3c66c2;
}
.orange{background:#ff9d3c;}

/* TOGGLE */
.toggle{
    display:flex;
    background:#0f1e33;
    border-radius:20px;
    overflow:hidden;
}

.toggle button{
    flex:1;
    padding:12px;
    border:none;
    background:#0f1e33;
    color:white;
}

/* FORCE GREEN */
.toggle button.active{
    background:#1db954 !important;
}

/* NOTICE */
.notice{
    text-align:center;
    font-size:12px;
    margin-top:6px;
    color:#aaa;
}

/* SECTION */
.section-title{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
}

/* CARD */
.card{
    background:#0c1f3a;
    padding:14px;
    border-radius:14px;
    margin-top:10px;
}

.profit{color:#3cff7c;}
.loss{color:#ff4c4c;}
.roi{color:#ffd24c;}

.history{
    max-height:260px;
    overflow-y:auto;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="title">StepCat</div>
    <button class="btn red" onclick="clearInputs()">Clear</button>
</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<div class="toggle">
    <button id="nonBtn" class="active">Non-Member</button>
    <button id="memBtn">Member</button>
</div>

<div id="notice" class="notice">Non-member: 15% taken</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<div class="section-title">
    Totals
    <div>
        <button class="btn orange" onclick="loadLast()">Load</button>
        <button class="btn red" onclick="clearTotals()">Clear</button>
    </div>
</div>

<div id="totals"></div>

<div class="section-title">
    History
    <div>
        <button class="btn orange" onclick="loadHistory()">Load</button>
        <button class="btn red" onclick="clearHistory()">Clear</button>
    </div>
</div>

<div id="history" class="history"></div>

</div>

<script>

/* STATE */
let mode="non";
let lastResult=null; // 🔥 decoupled core
let history=[];

/* ELEMENTS */
const pot=document.getElementById("pot");
const fee=document.getElementById("fee");
const winners=document.getElementById("winners");
const totals=document.getElementById("totals");
const historyDiv=document.getElementById("history");
const notice=document.getElementById("notice");
const nonBtn=document.getElementById("nonBtn");
const memBtn=document.getElementById("memBtn");

/* TOGGLE */
nonBtn.onclick=()=>{
    mode="non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
    notice.innerText="Non-member: 15% taken";
};

memBtn.onclick=()=>{
    mode="mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
    notice.innerText="Member: No fee";
};

/* CALCULATE */
function calculate(){

    let p=parseFloat(pot.value);
    let f=parseFloat(fee.value);
    let w=parseFloat(winners.value);

    if(isNaN(p)||isNaN(f)||isNaN(w)) return;

    let member=p/w;
    let non=member*0.85;
    let payout=(mode==="mem")?member:non;

    let profit=payout-f;
    let roi=(profit/f)*100;

    let entry={
        label:mode==="mem"?"Member Game":"Non-Member Game",
        payout,profit,roi
    };

    lastResult=entry; // 🔥 critical fix

    renderTotals(entry);

    history.unshift(entry);
    if(history.length>20) history.pop();

    renderHistory();
}

/* RENDER */
function renderTotals(d){
    totals.innerHTML=card(d);
}

function renderHistory(){
    historyDiv.innerHTML="";
    history.forEach(e=>{
        historyDiv.innerHTML+=card(e);
    });
}

function card(d){
return `<div class="card">
<b>${d.label}</b><br><br>
Payout: $${d.payout.toFixed(2)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: $${d.profit.toFixed(2)}
</span><br>
<span class="roi">
ROI: ${d.roi.toFixed(1)}%
</span>
</div>`;
}

/* LOAD */
function loadLast(){
    if(lastResult){
        renderTotals(lastResult);
    }
}

function loadHistory(){
    renderHistory();
}

/* CLEAR */
function clearInputs(){
    pot.value=""; fee.value=""; winners.value="";
}

function clearTotals(){
    totals.innerHTML="";
}

function clearHistory(){
    history=[]; // 🔥 no storage, no corruption
    renderHistory();
}

</script>

</body>
</html>
