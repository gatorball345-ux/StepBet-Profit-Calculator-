<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 20px 0;
}

h2 {
  text-align: center;
}

/* SETTINGS BUTTON */
.settings-btn {
  position: absolute;
  right: 20px;
  top: 20px;
  font-size: 20px;
  cursor: pointer;
}

/* INPUTS */
input, button, #result, .history-wrapper {
  width: 92%;
  margin: auto;
  display: block;
}

input {
  padding: 16px;
  margin-top: 12px;
  background: #111827;
  border: none;
  border-radius: 14px;
  color: white;
  text-align: center;
}

button {
  padding: 16px;
  margin-top: 16px;
  background: #22c55e;
  border: none;
  border-radius: 14px;
  color: white;
  font-weight: bold;
}

.clear-btn { background: #ef4444; }

#result {
  margin-top: 20px;
  padding: 18px;
  background: #111827;
  border-radius: 14px;
}

.label { color: #22c55e; }

/* SWIPE */
.history-wrapper {
  position: relative;
  overflow: hidden;
  margin-top: 10px;
}

.delete-bg {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 100%;
  background: #ef4444;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 20px;
}

.history-item {
  background: #111827;
  padding: 14px;
  border-radius: 12px;
  transition: transform 0.2s ease;
}

/* MODAL + SETTINGS */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  width: 80%;
  max-width: 300px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.modal-buttons button {
  flex: 1;
}

.toggle-setting {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.switch {
  width: 40px;
  height: 20px;
  background: #374151;
  border-radius: 10px;
  position: relative;
  cursor: pointer;
}

.knob {
  width: 16px;
  height: 16px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: 0.2s;
}

.switch.active {
  background: #22c55e;
}

.switch.active .knob {
  left: 22px;
}
</style>
</head>

<body>

<div class="settings-btn" onclick="openSettings()">⚙️</div>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3 style="width:92%; margin:auto;">Recent</h3>
<div id="history"></div>

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<!-- DELETE MODAL -->
<div id="deleteModal" class="modal">
  <div class="modal-box">
    <div>Delete this entry?</div>
    <div class="modal-buttons">
      <button onclick="closeDelete()">Cancel</button>
      <button onclick="confirmDelete()" style="background:#ef4444;">Delete</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal">
  <div class="modal-box">
    <h3>Settings</h3>

    <div class="toggle-setting">
      Swipe Delete
      <div id="swipeToggle" class="switch" onclick="toggleSetting('swipe')"><div class="knob"></div></div>
    </div>

    <div class="toggle-setting">
      Confirm Delete
      <div id="confirmToggle" class="switch" onclick="toggleSetting('confirm')"><div class="knob"></div></div>
    </div>

    <div class="toggle-setting">
      Save History
      <div id="historyToggle" class="switch" onclick="toggleSetting('history')"><div class="knob"></div></div>
    </div>

    <button onclick="closeSettings()">Close</button>
  </div>
</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];

let settings = JSON.parse(localStorage.getItem("settings")) || {
  swipe: true,
  confirm: true,
  history: true
};

let deleteIndex = null;
let activeElement = null;

/* SETTINGS UI */
function openSettings() {
  document.getElementById("settingsModal").style.display = "flex";
  updateSettingsUI();
}

function closeSettings() {
  document.getElementById("settingsModal").style.display = "none";
}

function toggleSetting(key) {
  settings[key] = !settings[key];
  localStorage.setItem("settings", JSON.stringify(settings));
  updateSettingsUI();
}

function updateSettingsUI() {
  ["swipe","confirm","history"].forEach(key=>{
    document.getElementById(key+"Toggle").classList.toggle("active", settings[key]);
  });
}

/* CALCULATE */
function calculate() {
  const pot = parseFloat(potInput.value);
  const fee = parseFloat(feeInput.value);
  const winners = parseFloat(winnersInput.value);

  if (!pot || !fee || !winners) return alert("Enter valid numbers");

  const payout = pot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;

  result.innerHTML = `
    <div><span class="label">Payout:</span> $${payout.toFixed(2)}</div>
    <div><span class="label">Profit:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
    <div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
  `;

  if (settings.history) {
    history.unshift({ payout, profit, roi });
    localStorage.setItem("stepbetHistory", JSON.stringify(history));
    renderHistory();
  }
}

/* SWIPE */
function addSwipe(el, index) {
  if (!settings.swipe) return;

  let startX = 0;

  el.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
  });

  el.addEventListener("touchend", e=>{
    let diff = e.changedTouches[0].clientX - startX;

    if (diff < -80) {
      if (settings.confirm) {
        openDelete(index, el);
      } else {
        deleteItem(index);
      }
    }
  });
}

/* DELETE */
function openDelete(index, el) {
  deleteIndex = index;
  activeElement = el;
  deleteModal.style.display = "flex";
}

function closeDelete() {
  deleteModal.style.display = "none";
}

function confirmDelete() {
  deleteItem(deleteIndex);
  closeDelete();
}

function deleteItem(index) {
  history.splice(index, 1);
  localStorage.setItem("stepbetHistory", JSON.stringify(history));
  renderHistory();
}

/* HISTORY */
function renderHistory() {
  history.innerHTML = "";

  history.forEach((item,i)=>{
    const wrap = document.createElement("div");
    wrap.className = "history-wrapper";

    const bg = document.createElement("div");
    bg.className = "delete-bg";
    bg.textContent = "DELETE";

    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `
      <span class="label">Payout:</span> $${item.payout.toFixed(2)} |
      <span class="label">Profit:</span> ${(item.profit>=0?"+":"")}$${item.profit.toFixed(2)} |
      <span class="label">ROI:</span> ${item.roi.toFixed(1)}%
    `;

    addSwipe(div, i);

    wrap.appendChild(bg);
    wrap.appendChild(div);
    history.appendChild(wrap);
  });
}

/* CLEAR */
function clearHistory() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
}

renderHistory();
updateSettingsUI();
</script>

</body>
</html>
