<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background:#020617;
  color:white;
  font-family:system-ui;
  margin:0;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px 0;
}

h2 { text-align:center; }

input, #result, .history-wrapper {
  width:92%;
  margin:auto;
  display:block;
}

input {
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:14px;
  color:white;
  text-align:center;
}

/* 🔥 TOGGLE */
.toggle {
  width:92%;
  margin:14px auto;
  display:flex;
  background:#111827;
  border-radius:14px;
  padding:4px;
}

.toggle div {
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  color:#9ca3af;
}

.toggle .active {
  background:#22c55e;
  color:white;
  font-weight:bold;
}

/* BUTTON ROW */
.button-row {
  width:92%;
  margin:16px auto 0;
  display:flex;
  gap:10px;
}

.button-row button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  color:white;
  font-weight:bold;
}

.calc-btn { background:#22c55e; }
.clear-input-btn { background:#374151; }

.clear-btn {
  width:92%;
  margin:16px auto;
  padding:14px;
  background:#ef4444;
  border:none;
  border-radius:14px;
  color:white;
  font-weight:bold;
}

#result {
  margin-top:20px;
  padding:18px;
  background:#111827;
  border-radius:14px;
}

.label { color:#22c55e; }

/* HISTORY */
.history-wrapper {
  position:relative;
  overflow:hidden;
  margin-top:10px;
}

.delete-bg {
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:80px;
  background:#ef4444;
  display:flex;
  align-items:center;
  justify-content:center;
}

.history-item {
  background:#111827;
  padding:14px;
  border-radius:12px;
  position:relative;
  z-index:2;
  transition:transform 0.2s ease;
}

/* MODALS */
.modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.modal-box {
  background:#111827;
  padding:20px;
  border-radius:14px;
  width:80%;
  max-width:300px;
  text-align:center;
}

.modal-box button {
  width:100%;
  margin-top:10px;
}

/* UNDO */
.undo-bar {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  padding:16px;
  display:none;
  justify-content:space-between;
  border-top:1px solid #374151;
}

.undo-btn {
  color:#22c55e;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<!-- 🔥 MEMBER TOGGLE -->
<div class="toggle">
  <div id="nonMember" class="active" onclick="setMode(false)">Non-Member</div>
  <div id="member" onclick="setMode(true)">Member</div>
</div>

<div class="button-row">
  <button class="calc-btn" onclick="calculate()">Calculate</button>
  <button class="clear-input-btn" onclick="openClearModal()">Clear</button>
</div>

<div id="result"></div>

<h3 style="width:92%; margin:auto;">Recent</h3>
<div id="historyContainer"></div>

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<!-- CLEAR MODAL -->
<div id="clearModal" class="modal">
  <div class="modal-box">
    <div>Clear all inputs?</div>
    <button onclick="confirmClearInputs()">Clear</button>
    <button onclick="closeClearModal()">Cancel</button>
  </div>
</div>

<!-- DELETE MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div>Delete this entry?</div>
    <button onclick="confirmDelete()">Delete</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- UNDO -->
<div id="undoBar" class="undo-bar">
  <div>Entry deleted</div>
  <div class="undo-btn" onclick="undoDelete()">UNDO</div>
</div>

<script>
let isMember = false;

let historyData = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
let deleteIndex = null;
let lastDeleted = null;
let undoTimer = null;

/* 🔥 TOGGLE */
function setMode(member) {
  isMember = member;

  document.getElementById("member").classList.toggle("active", member);
  document.getElementById("nonMember").classList.toggle("active", !member);
}

/* CALCULATE */
function calculate() {
  const pot = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!pot || !fee || !winners) {
    alert("Enter valid numbers");
    return;
  }

  let payout = pot / winners;

  if (!isMember) {
    payout *= 0.85; // 🔥 15% fee
  }

  const profit = payout - fee;
  const roi = (profit / fee) * 100;

  document.getElementById("result").innerHTML = `
    <div><span class="label">Payout:</span> $${payout.toFixed(2)}</div>
    <div><span class="label">Profit:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
    <div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({ payout, profit, roi, isMember });
  localStorage.setItem("stepbetHistory", JSON.stringify(historyData));

  renderHistory();
}

/* CLEAR INPUTS */
function openClearModal() {
  document.getElementById("clearModal").style.display = "flex";
}
function closeClearModal() {
  document.getElementById("clearModal").style.display = "none";
}
function confirmClearInputs() {
  document.getElementById("pot").value = "";
  document.getElementById("fee").value = "";
  document.getElementById("winners").value = "";
  closeClearModal();
}

/* DELETE */
function openModal(index) {
  deleteIndex = index;
  document.getElementById("modal").style.display = "flex";
}
function closeModal() {
  document.getElementById("modal").style.display = "none";
  renderHistory();
}
function confirmDelete() {
  lastDeleted = {
    item: historyData[deleteIndex],
    index: deleteIndex
  };

  historyData.splice(deleteIndex, 1);
  localStorage.setItem("stepbetHistory", JSON.stringify(historyData));

  showUndo();
  closeModal();
}

/* UNDO */
function showUndo() {
  const bar = document.getElementById("undoBar");
  bar.style.display = "flex";

  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    bar.style.display = "none";
    lastDeleted = null;
  }, 4000);
}

function undoDelete() {
  if (!lastDeleted) return;

  historyData.splice(lastDeleted.index, 0, lastDeleted.item);
  localStorage.setItem("stepbetHistory", JSON.stringify(historyData));

  lastDeleted = null;
  document.getElementById("undoBar").style.display = "none";

  renderHistory();
}

/* HISTORY */
function renderHistory() {
  const container = document.getElementById("historyContainer");
  container.innerHTML = "";

  historyData.forEach((item, index)=>{
    const wrapper = document.createElement("div");
    wrapper.className = "history-wrapper";

    const bg = document.createElement("div");
    bg.className = "delete-bg";
    bg.textContent = "DELETE";

    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <b>${item.isMember ? "Member" : "Non-Member"}</b><br>
      Payout: $${item.payout.toFixed(2)} |
      Profit: ${(item.profit>=0?"+":"")}$${item.profit.toFixed(2)} |
      ROI: ${item.roi.toFixed(1)}%
    `;

    wrapper.appendChild(bg);
    wrapper.appendChild(div);
    container.appendChild(wrapper);
  });
}

function clearHistory() {
  historyData = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
}

renderHistory();
</script>

</body>
</html>
