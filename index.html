<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#020a1a;
  color:white;
}

/* HEADER */
h1 {
  text-align:center;
  margin:20px 0;
  color:#ff9d4d;
  text-shadow:0 0 10px rgba(255,140,60,.7);
}

/* INPUTS */
.container {
  padding:15px;
  max-width:500px;
  margin:auto;
}

input {
  width:100%;
  padding:18px;
  margin-bottom:15px;
  border:none;
  border-radius:18px;
  background:#0b1c33;
  color:white;
  text-align:center;
  font-size:18px;
}

/* BUTTONS BASE */
button {
  width:100%;
  padding:16px;
  border:none;
  border-radius:22px;
  margin:10px 0;
  font-size:18px;
  color:white;
}

/* CALCULATE */
.calc-btn {
  background:#2f66d4;
  box-shadow:0 0 12px rgba(47,102,212,.5);
}

/* CLEAR BUTTONS */
.clear-btn {
  background:#8b1e1e;
  box-shadow:0 0 10px rgba(180,30,30,.6);
}

/* TOGGLE */
.toggle {
  display:flex;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0;
}

.toggle div {
  flex:1;
  padding:14px;
  text-align:center;
  background:#0b1c33;
}

.active {
  background:#1fa34a !important;
  box-shadow:0 0 10px rgba(30,200,90,.6);
}

/* TOTAL BOX */
.total-box {
  background:#0b1c33;
  padding:18px;
  border-radius:18px;
  margin-top:10px;
}

/* COLORS */
.profit { color:#3bd16f; }
.roi { color:#ffd43b; }

/* HISTORY */
.history-wrap {
  margin-top:20px;
}

.history-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.history {
  max-height:260px;
  overflow-y:auto;
  padding-bottom:30px;
}

.history-item {
  background:#0b1c33;
  padding:14px;
  border-radius:16px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>StepCat Calculator</h1>

<div class="container">

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Winners">

<button class="clear-btn" onclick="clearEntries()">Clear Entries</button>

<div class="toggle">
  <div id="nonMember" class="active" onclick="setMode(false)">Non-Member</div>
  <div id="member" onclick="setMode(true)">Member</div>
</div>

<button class="calc-btn" onclick="calculate()">Calculate</button>

<h3>Totals</h3>
<button class="clear-btn" style="width:auto;padding:8px 14px;" onclick="clearTotals()">Clear</button>

<div id="totals" class="total-box"></div>

<div class="history-wrap">
  <div class="history-header">
    <h3>Recent History</h3>
    <button class="clear-btn" style="width:auto;padding:8px 14px;" onclick="clearHistory()">Clear</button>
  </div>

  <div id="history" class="history"></div>
</div>

</div>

<script>
let isMember = false;

function setMode(member){
  isMember = member;
  document.getElementById("member").classList.toggle("active", member);
  document.getElementById("nonMember").classList.toggle("active", !member);
}

function calculate(){
  let pot = parseFloat(potInput());
  let fee = parseFloat(feeInput());
  let winners = parseFloat(winnerInput());

  if(!pot || !fee || !winners) return;

  let payout = pot / winners;

  if(!isMember){
    payout *= 0.85;
  }

  let profit = payout - fee;
  let roi = (profit / fee) * 100;

  let modeText = isMember ? "Member" : "Non-Member";

  document.getElementById("totals").innerHTML = `
    <b>${modeText}</b><br><br>
    Payout: $${payout.toFixed(2)}<br>
    <span class="profit">Profit: $${profit.toFixed(2)}</span><br>
    <span class="roi">ROI: ${roi.toFixed(1)}%</span>
  `;

  saveHistory(modeText, payout, profit, roi);
}

function saveHistory(mode, payout, profit, roi){
  let history = JSON.parse(localStorage.getItem("history") || "[]");

  history.unshift({mode, payout, profit, roi});

  localStorage.setItem("history", JSON.stringify(history));

  renderHistory();
}

function renderHistory(){
  let history = JSON.parse(localStorage.getItem("history") || "[]");
  let container = document.getElementById("history");

  container.innerHTML = "";

  history.forEach(item=>{
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <b>${item.mode}</b><br>
      Payout: $${item.payout.toFixed(2)} |
      <span class="profit">Profit: $${item.profit.toFixed(2)}</span> |
      <span class="roi">ROI: ${item.roi.toFixed(1)}%</span>
    `;

    container.appendChild(div);
  });
}

/* CLEAR FUNCTIONS */
function clearEntries(){
  document.getElementById("pot").value="";
  document.getElementById("fee").value="";
  document.getElementById("winners").value="";
}

function clearTotals(){
  document.getElementById("totals").innerHTML="";
}

function clearHistory(){
  localStorage.removeItem("history");
  renderHistory();
}

/* INPUT HELPERS */
function potInput(){ return document.getElementById("pot").value; }
function feeInput(){ return document.getElementById("fee").value; }
function winnerInput(){ return document.getElementById("winners").value; }

/* INIT */
renderHistory();
</script>

</body>
</html>
