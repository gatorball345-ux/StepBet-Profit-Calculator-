<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

/* INPUTS */
input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
  color: white;
}

.clear-btn { background: #ef4444; }

/* RESULT */
#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

/* ✅ PERFECT CENTER LOCK */
.toggle {
  display: grid;
  grid-template-columns: 1fr 60px 1fr; /* 👈 HARD LOCK CENTER */
  align-items: center;
  margin-bottom: 10px;
}

.mode-label,
.mode-right {
  font-size: 14px;
  opacity: 0.5;
  transition: 0.2s;
}

.mode-label {
  text-align: left;
  padding-left: 4px;
}

.mode-right {
  text-align: right;
  padding-right: 4px;
}

/* ACTIVE STATE */
.active {
  opacity: 1;
  font-weight: bold;
  color: #22c55e; /* 👈 visible highlight */
}

/* SWITCH */
.switch {
  position: relative;
  width: 52px;
  height: 28px;
  justify-self: center;
}

.switch input { opacity: 0; }

.slider {
  position: absolute;
  inset: 0;
  background: #374151;
  border-radius: 34px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider:before {
  transform: translateX(24px);
}

/* HISTORY */
.history-wrapper {
  position: relative;
  overflow: hidden;
  margin-top: 10px;
  border-radius: 10px;
}

.delete-bg {
  position: absolute;
  inset: 0;
  background: #ef4444;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 20px;
  font-weight: bold;
  z-index: 0;
}

.history-item {
  position: relative;
  background: #111827;
  padding: 12px;
  border-radius: 10px;
  z-index: 1;
}

.note {
  font-size: 12px;
  color: #94a3b8;
  margin: 4px 0 8px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<div class="toggle">
  <span id="nonMemberLabel" class="mode-label active">Non-Member (-15%)</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle">
    <span class="slider"></span>
  </label>

  <span id="memberLabel" class="mode-right">Member</span>
</div>

<input id="pot" placeholder="Total Pot">
<input id="entry" placeholder="Entry Fee">
<input id="players" placeholder="Eligible Winners">

<button id="calculateBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div class="note">Swipe left on a result to delete</div>
<div id="history"></div>

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<script>
const toggle = document.getElementById("memberToggle");
const nonMemberLabel = document.getElementById("nonMemberLabel");
const memberLabel = document.getElementById("memberLabel");

/* ✅ THIS FIXES HIGHLIGHTING */
function updateMode() {
  if (toggle.checked) {
    nonMemberLabel.classList.remove("active");
    memberLabel.classList.add("active");
  } else {
    nonMemberLabel.classList.add("active");
    memberLabel.classList.remove("active");
  }
}

/* 🔥 IMPORTANT: RUN ON LOAD */
updateMode();

/* 🔥 IMPORTANT: LISTEN FOR CHANGE */
toggle.addEventListener("change", updateMode);
</script>

</body>
</html>
