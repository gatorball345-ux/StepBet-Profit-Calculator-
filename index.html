<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StepBet Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h2>StepBet Profit</h2>

  <div class="toggle">
    <span id="modeLabel">Non-Member (-15%)</span>
    <input type="checkbox" id="memberToggle" onchange="updateMode()">
  </div>

  <label>Total Pot</label>
  <input id="pot" type="number">

  <label>Entry Fee</label>
  <input id="entry" type="number">

  <label>Eligible Winners</label>
  <input id="players" type="number">

  <!-- 🔥 DIRECT FUNCTION CALL -->
  <button onclick="calculate()">Calculate</button>

  <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
