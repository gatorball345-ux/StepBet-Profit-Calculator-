<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
}

.container {
    padding: 20px;
}

.title {
    text-align: center;
    font-size: 28px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
    margin-bottom: 20px;
}

.input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    font-size: 16px;
    text-align: center;
}

.top-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
}

.btn {
    border: none;
    cursor: pointer;
    border-radius: 20px;
    font-size: 14px;
    color: white;
}

.btn.small {
    padding: 10px 16px;
}

.btn.red {
    background: #a02222;
    box-shadow: 0 0 12px rgba(255,50,50,0.4);
}

.btn.blue {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    background: #3c66c2;
    box-shadow: 0 0 14px rgba(80,140,255,0.5);
}

.toggle {
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #0f1e33;
    margin-top: 10px;
    box-shadow: 0 0 10px rgba(0,150,255,0.15);
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #1db954 !important;
    box-shadow: 0 0 18px rgba(29,185,84,0.7);
}

.section-title {
    font-size: 20px;
    margin: 20px 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.small-btn {
    padding: 10px 16px;
    border-radius: 14px;
    border: none;
    background: #a02222;
    color: white;
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
    margin-right: 8px;
}

.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 14px;
}

.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.history {
    max-height: 300px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="container">

<div class="title">StepCat Calculator</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<div class="top-row">
    <button class="btn red small" onclick="clearInputs()">Clear</button>
</div>

<div class="toggle">
    <button id="nonBtn" class="active" onclick="setMode('non')">Non-Member</button>
    <button id="memBtn" onclick="setMode('mem')">Member</button>
</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<div class="section-title">
    Totals
    <button class="small-btn" onclick="clearTotals()">Clear</button>
</div>

<div id="totals"></div>

<div class="section-title">
    Recent History
    <div>
        <button class="small-btn" onclick="loadHistory()">Load</button>
        <button class="small-btn" onclick="clearHistory()">Clear</button>
    </div>
</div>

<div id="history" class="history"></div>

</div>

<script>

let mode = "non";

/* ===== MODE ===== */
function setMode(type){
    mode = type;

    document.getElementById("nonBtn").classList.remove("active");
    document.getElementById("memBtn").classList.remove("active");

    if(type === "non"){
        document.getElementById("nonBtn").classList.add("active");
    } else {
        document.getElementById("memBtn").classList.add("active");
    }
}

/* ===== FORMATTERS ===== */
function formatMoney(num){
    return "$" + num.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

function formatROI(num){
    return num.toFixed(1) + "%";
}

/* ===== CALCULATE ===== */
function calculate(){
    let pot = parseFloat(document.getElementById("pot").value);
    let fee = parseFloat(document.getElementById("fee").value);
    let winners = parseFloat(document.getElementById("winners").value);

    if(!pot || !fee || !winners) return;

    let memberPayout = pot / winners;
    let nonMemberPayout = memberPayout * 0.85;

    let payout = mode === "mem" ? memberPayout : nonMemberPayout;

    let profit = payout - fee;
    let roi = (profit / fee) * 100;

    let label = mode === "mem" ? "Member Game" : "Non-Member Game";

    let cardData = {
        label,
        payout,
        profit,
        roi
    };

    renderTotals(cardData);
    saveHistory(cardData);
}

/* ===== TOTALS (NOT SAVED) ===== */
function renderTotals(data){
    let html = `
    <div class="card">
        <b>${data.label}</b><br><br>
        Payout: ${formatMoney(data.payout)}<br>
        <span class="${data.profit >= 0 ? 'profit' : 'loss'}">
        Profit: ${formatMoney(data.profit)}
        </span><br>
        <span class="roi">
        ROI: ${formatROI(data.roi)}
        </span>
    </div>
    `;
    document.getElementById("totals").innerHTML = html;
}

/* ===== HISTORY STORAGE ===== */
function saveHistory(data){
    let history = JSON.parse(localStorage.getItem("history")) || [];
    history.unshift(data);
    localStorage.setItem("history", JSON.stringify(history));
}

/* ===== LOAD HISTORY (BUTTON CONTROLLED) ===== */
function loadHistory(){
    let history = JSON.parse(localStorage.getItem("history")) || [];
    let container = document.getElementById("history");
    container.innerHTML = "";

    history.forEach(item => {
        let card = `
        <div class="card">
            <b>${item.label}</b><br><br>
            Payout: ${formatMoney(item.payout)}<br>
            <span class="${item.profit >= 0 ? 'profit' : 'loss'}">
            Profit: ${formatMoney(item.profit)}
            </span><br>
            <span class="roi">
            ROI: ${formatROI(item.roi)}
            </span>
        </div>
        `;
        container.innerHTML += card;
    });
}

/* ===== CLEAR ===== */
function clearInputs(){
    document.getElementById("pot").value = "";
    document.getElementById("fee").value = "";
    document.getElementById("winners").value = "";
}

function clearTotals(){
    document.getElementById("totals").innerHTML = "";
}

function clearHistory(){
    localStorage.removeItem("history");
    document.getElementById("history").innerHTML = "";
}

</script>

</body>
</html>
