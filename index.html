<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  width: 100%;
  max-width: 420px;
  padding: 20px 18px;
  margin: 40px auto;
  box-sizing: border-box;
}

h2 { text-align: center; }

/* TOGGLE */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 0;
}

.toggle-label {
  width: 110px;
  font-weight: 600;
  color: #6b7280;
  text-align: center;
}

.toggle-label.active {
  color: #22c55e;
}

.switch {
  position: relative;
  width: 52px;
  height: 28px;
  background: #374151;
  border-radius: 20px;
  cursor: pointer;
}

.knob {
  position: absolute;
  width: 24px;
  height: 24px;
  background: white;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: 0.2s;
}

.switch.active {
  background: #22c55e;
}

.switch.active .knob {
  left: 26px;
}

/* INPUTS */
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  background: #111827;
  border: none;
  color: white;
  border-radius: 12px;
  text-align: center;
}

/* BUTTON */
button {
  width: 100%;
  padding: 16px;
  background: #22c55e;
  border: none;
  border-radius: 14px;
  margin-top: 14px;
  color: white;
  font-weight: bold;
}

.clear-btn { background: #ef4444; }

/* RESULT */
#result {
  margin-top: 20px;
  padding: 18px;
  background: #111827;
  border-radius: 14px;
  line-height: 1.8;
}

.label {
  color: #22c55e;
  font-weight: 600;
}

/* HISTORY */
.history-item {
  background: #111827;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<!-- TOGGLE -->
<div class="toggle-row">
  <div id="nonMemberLabel" class="toggle-label active">Non-Member (-15%)</div>

  <div id="toggle" class="switch" onclick="toggleMember()">
    <div class="knob"></div>
  </div>

  <div id="memberLabel" class="toggle-label">Member</div>
</div>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
let isMember = false;

/* TOGGLE */
function toggleMember() {
  isMember = !isMember;

  const toggle = document.getElementById("toggle");
  const memberLabel = document.getElementById("memberLabel");
  const nonMemberLabel = document.getElementById("nonMemberLabel");

  toggle.classList.toggle("active");

  if (isMember) {
    memberLabel.classList.add("active");
    nonMemberLabel.classList.remove("active");
  } else {
    nonMemberLabel.classList.add("active");
    memberLabel.classList.remove("active");
  }
}

/* CALCULATE */
function calculate() {

  const potInput = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!potInput || !fee || !winners) {
    alert("Enter valid numbers");
    return;
  }

  // Apply 15% fee if non-member
  const pot = isMember ? potInput : potInput * 0.85;

  const payout = pot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;
  const breakEvenPlayers = Math.round(pot / fee);

  const resultDiv = document.getElementById("result");

  const container = document.createElement("div");

  function makeRow(label, value) {
    const row = document.createElement("div");

    const labelSpan = document.createElement("span");
    labelSpan.className = "label";
    labelSpan.textContent = label + ": ";

    const valueSpan = document.createElement("span");
    valueSpan.textContent = value;

    row.appendChild(labelSpan);
    row.appendChild(valueSpan);

    return row;
  }

  container.appendChild(makeRow("Payout Per Player", "$" + payout.toFixed(2)));
  container.appendChild(makeRow("Profit / Loss", (profit >= 0 ? "+" : "") + "$" + profit.toFixed(2)));
  container.appendChild(makeRow("ROI", roi.toFixed(1) + "%"));

  const spacer = document.createElement("div");
  spacer.style.marginTop = "10px";
  container.appendChild(spacer);

  container.appendChild(makeRow("Break-Even Players", breakEvenPlayers));

  resultDiv.innerHTML = "";
  resultDiv.appendChild(container);

  history.unshift({
    payout: payout,
    profit: profit,
    roi: roi,
    member: isMember
  });

  localStorage.setItem("stepbetHistory", JSON.stringify(history));
  renderHistory();
}

/* HISTORY */
function renderHistory() {
  const container = document.getElementById("history");
  container.innerHTML = "";

  history.forEach(function(item) {
    const div = document.createElement("div");
    div.className = "history-item";

    const type = item.member ? "Member" : "Non-Member";

    div.innerHTML =
      "<span class='label'>" + type + "</span> | " +
      "<span class='label'>Payout:</span> $" + item.payout.toFixed(2) +
      " | <span class='label'>Profit:</span> " +
      (item.profit >= 0 ? "+" : "") + "$" + item.profit.toFixed(2) +
      " | <span class='label'>ROI:</span> " +
      item.roi.toFixed(1) + "%";

    container.appendChild(div);
  });
}

/* CLEAR */
function clearHistory() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
}

renderHistory();
</script>

</body>
</html>
