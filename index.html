<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
    overflow-x: hidden;
    touch-action: manipulation;
}

.container {
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 26px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
}

.clear-btn {
    background: #a02222;
    border: none;
    padding: 10px 14px;
    font-size: 13px;
    border-radius: 14px;
    color: white;
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
}

.input {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
}

.toggle {
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #0f1e33;
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #1db954 !important;
}

.calculate {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border-radius: 20px;
    border: none;
    background: #3c66c2;
    color: white;
}

.section-title {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.load-btn {
    background: #ff9d3c;
    border: none;
    padding: 10px 14px;
    border-radius: 14px;
    color: white;
}

.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-top: 10px;
}

.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.history {
    max-height: 300px;
    overflow-y: auto;
}

.notice {
    text-align: center;
    font-size: 13px;
    color: #aaa;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="title">StepCat Calculator</div>
    <button class="clear-btn" onclick="clearInputs()">Clear</button>
</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<div class="toggle">
    <button id="nonBtn" class="active" onclick="setMode('non')">Non-Member</button>
    <button id="memBtn" onclick="setMode('mem')">Member</button>
</div>

<button class="calculate" onclick="calculate()">Calculate</button>

<div id="notice" class="notice"></div>

<div class="section-title">
    <div>Totals</div>
    <div>
        <button class="load-btn" onclick="loadLast()">Load</button>
        <button class="clear-btn" onclick="clearTotals()">Clear</button>
    </div>
</div>

<div id="totals"></div>

<div class="section-title">
    <div>Recent History</div>
    <div>
        <button class="load-btn" onclick="loadHistory()">Load</button>
        <button class="clear-btn" onclick="clearHistory()">Clear</button>
    </div>
</div>

<div id="history" class="history"></div>

</div>

<script>

let mode = "non";
let fallbackHistory = []; // fallback if storage fails

function setMode(type){
    mode = type;
    nonBtn.classList.remove("active");
    memBtn.classList.remove("active");

    if(type==="non"){
        nonBtn.classList.add("active");
        notice.innerText="Non-member: 15% taken.";
    } else {
        memBtn.classList.add("active");
        notice.innerText="Member: No fee taken.";
    }
}

/* FORMAT */
function money(n){ return "$"+n.toFixed(2); }
function roi(n){ return n.toFixed(1)+"%"; }

/* CALCULATE */
function calculate(){
    let pot=parseFloat(pot.value);
    let fee=parseFloat(fee.value);
    let w=parseFloat(winners.value);
    if(!pot||!fee||!w)return;

    let member=pot/w;
    let non=member*0.85;
    let payout=mode==="mem"?member:non;

    let profit=payout-fee;
    let r=(profit/fee)*100;

    let entry={
        label:mode==="mem"?"Member Game":"Non-Member Game",
        payout,profit,r
    };

    renderTotals(entry);
    saveHistory(entry);
}

/* CARD */
function cardHTML(d){
return `<div class="card">
<b>${d.label}</b><br><br>
Payout: ${money(d.payout)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: ${money(d.profit)}
</span><br>
<span class="roi">
ROI: ${roi(d.r)}
</span>
</div>`;
}

/* TOTALS */
function renderTotals(d){
    totals.innerHTML = cardHTML(d);
}

/* SAFE STORAGE */
function getHistory(){
    try{
        let h = JSON.parse(localStorage.getItem("stepcat_history"));
        if(Array.isArray(h)) return h;
    }catch(e){}
    return fallbackHistory;
}

function saveHistory(entry){
    let history = getHistory();
    history.unshift(entry);

    try{
        localStorage.setItem("stepcat_history", JSON.stringify(history));
    }catch(e){
        fallbackHistory = history;
    }
}

/* LOAD */
function loadLast(){
    let h = getHistory();
    if(h.length>0) renderTotals(h[0]);
}

function loadHistory(){
    let h = getHistory();
    history.innerHTML="";
    h.forEach(e=>{
        history.innerHTML += cardHTML(e);
    });
}

/* CLEAR */
function clearInputs(){
    pot.value="";
    fee.value="";
    winners.value="";
}

function clearTotals(){
    totals.innerHTML="";
}

function clearHistory(){
    localStorage.removeItem("stepcat_history");
    fallbackHistory=[];
    history.innerHTML="";
}

/* INIT */
setMode("non");

</script>

</body>
</html>
