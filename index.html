<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {margin:0;font-family:Arial;background:#020c1b;color:white;}
.container {max-width:420px;margin:auto;padding:15px;}

.header {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.title {font-size:22px;color:#ff9d3c;}

.input {
width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;
background:#0c1f3a;color:white;text-align:center;font-size:16px;
}

.card {
background:#0c1f3a;
padding:12px;
border-radius:10px;
margin-top:8px;
transition:transform 0.2s, box-shadow 0.2s;
touch-action: pan-y;
}

/* Swipe visuals */
.card.left {
box-shadow:inset -20px 0 40px rgba(255,0,0,0.8);
}
.card.right {
box-shadow:inset 20px 0 40px rgba(0,255,120,0.8);
}

.btn {padding:10px;border:none;border-radius:10px;color:white;margin-top:6px;}
.blue {background:#3c66c2;width:100%;}
.red {background:#a02222;}

.section {display:flex;justify-content:space-between;margin-top:15px;}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}
.empty {opacity:0.6;text-align:center;margin-top:6px;}

/* UNDO BAR */
.undo-bar {
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#ffaa00;
color:black;
padding:12px 18px;
border-radius:14px;
display:flex;
gap:10px;
align-items:center;
box-shadow:0 0 12px rgba(255,170,0,0.8);
}
.undo-bar button {
background:black;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">StepCat</div>
<button class="btn red" id="clearInputsBtn">Clear</button>
</div>

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Prospects">

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
<b>Totals</b>
<button class="btn red" id="clearTotalsBtn">Clear</button>
</div>
<div id="totals"></div>

<div class="section">
<b>History</b>
<button class="btn red" id="clearHistoryBtn">Clear</button>
</div>
<div id="history"></div>

</div>

<script>
(function(){

const potEl=document.getElementById("pot");
const feeEl=document.getElementById("fee");
const winEl=document.getElementById("win");

const totalsDiv=document.getElementById("totals");
const historyDiv=document.getElementById("history");

let totals=JSON.parse(localStorage.getItem("totals")||"[]");
let history=JSON.parse(localStorage.getItem("history")||"[]");

/* UNDO STORAGE */
let lastAction=null;

/* SAVE */
function save(){
localStorage.setItem("totals",JSON.stringify(totals));
localStorage.setItem("history",JSON.stringify(history));
}

/* CALCULATE */
document.getElementById("calcBtn").onclick=function(){

let p=parseFloat(potEl.value);
let f=parseFloat(feeEl.value);
let w=parseFloat(winEl.value);

if(isNaN(p)||isNaN(f)||isNaN(w)){
alert("Enter values");
return;
}

let payout=p/w;
let profit=payout-f;
let roi=(profit/f)*100;

let entry={payout,profit,roi};

totals.unshift(entry);
history.unshift(entry);

if(totals.length>5) totals.pop();
if(history.length>200) history.pop();

save();
render();
};

/* EXPORT */
function exportEntry(e){
let text=`Payout: $${e.payout.toFixed(2)}
Profit: $${e.profit.toFixed(2)}
ROI: ${e.roi.toFixed(1)}%`;

navigator.clipboard.writeText(text);
}

/* UNDO BAR */
function showUndo(){
removeUndo();

let bar=document.createElement("div");
bar.className="undo-bar";
bar.innerHTML=`Action complete <button onclick="undoAction()">UNDO</button>`;

document.body.appendChild(bar);

setTimeout(removeUndo,5000);
}

window.undoAction=function(){

if(!lastAction) return;

if(lastAction.type==="delete"){
lastAction.array.splice(lastAction.index,0,lastAction.item);
}

save();
render();
removeUndo();
};

function removeUndo(){
let bar=document.querySelector(".undo-bar");
if(bar) bar.remove();
}

/* SWIPE */
function addSwipe(el,index,type){

let startX=0;
let currentX=0;

el.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});

el.addEventListener("touchmove",e=>{
currentX=e.touches[0].clientX;
let diff=currentX-startX;

el.style.transform=`translateX(${diff}px)`;

/* visuals */
if(diff<0){
el.classList.add("left");
el.classList.remove("right");
}
else if(diff>0){
el.classList.add("right");
el.classList.remove("left");
}

});

el.addEventListener("touchend",()=>{

let diff=currentX-startX;

/* LEFT = DELETE */
if(diff<-100){

let arr=(type==="totals")?totals:history;
let removed=arr.splice(index,1)[0];

lastAction={
type:"delete",
array:arr,
index:index,
item:removed
};

save();
render();
showUndo();
return;
}

/* RIGHT = EXPORT */
if(diff>100){

let arr=(type==="totals")?totals:history;
exportEntry(arr[index]);

showUndo();
}

/* RESET */
el.style.transform="translateX(0)";
el.classList.remove("left","right");

});
}

/* RENDER */
function render(){

totalsDiv.innerHTML=totals.length
?totals.map((e,i)=>`
<div class="card" id="t${i}">
Payout: $${e.payout.toFixed(2)}<br>
<span class="${e.profit>=0?'profit':'loss'}">
Profit: $${e.profit.toFixed(2)}
</span><br>
<span class="roi">ROI: ${e.roi.toFixed(1)}%</span>
</div>`).join("")
:"<div class='empty'>Totals empty</div>";

historyDiv.innerHTML=history.length
?history.map((e,i)=>`
<div class="card" id="h${i}">
Payout: $${e.payout.toFixed(2)}<br>
<span class="${e.profit>=0?'profit':'loss'}">
Profit: $${e.profit.toFixed(2)}
</span><br>
<span class="roi">ROI: ${e.roi.toFixed(1)}%</span>
</div>`).join("")
:"<div class='empty'>History empty</div>";

/* APPLY SWIPE */
totals.forEach((_,i)=>{
addSwipe(document.getElementById("t"+i),i,"totals");
});
history.forEach((_,i)=>{
addSwipe(document.getElementById("h"+i),i,"history");
});
}

/* CLEAR */
document.getElementById("clearTotalsBtn").onclick=()=>{
totals=[];
save();
render();
};

document.getElementById("clearHistoryBtn").onclick=()=>{
history=[];
save();
render();
};

document.getElementById("clearInputsBtn").onclick=()=>{
potEl.value="";
feeEl.value="";
winEl.value="";
};

render();

})();
</script>

</body>
</html>
