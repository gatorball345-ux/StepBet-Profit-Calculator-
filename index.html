<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
  color: white;
}

.clear-btn { background: #ef4444; }
.secondary-btn { background: #334155; }

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

.history-item {
  background: #111827;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
}

.positive { color: #22c55e; }
.negative { color: #f97316; }

.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

/* TOGGLE */
.switch {
  position: relative;
  width: 50px;
  height: 26px;
}
.switch input { display: none; }

.slider {
  position: absolute;
  inset: 0;
  background: #374151;
  border-radius: 34px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider {
  background: #22c55e;
}
input:checked + .slider:before {
  transform: translateX(24px);
}

#modeNotice {
  text-align: center;
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 16px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<div class="toggle">
  <span>Non-Member</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle">
    <span class="slider"></span>
  </label>

  <span>Member</span>
</div>

<div id="modeNotice"></div>

<input id="pot" placeholder="Total Pot" type="number">
<input id="entry" placeholder="Entry Fee" type="number">
<input id="players" placeholder="Eligible Winners" type="number">

<button id="calculateBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<button class="secondary-btn" onclick="document.getElementById('fileInput').click()">Import CSV</button>
<button class="secondary-btn" onclick="exportCSV()">Export CSV</button>
<input type="file" id="fileInput" accept=".csv" style="display:none">

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const entryInput = document.getElementById("entry");
  const potInput = document.getElementById("pot");
  const playersInput = document.getElementById("players");
  const result = document.getElementById("result");
  const calculateBtn = document.getElementById("calculateBtn");
  const memberToggle = document.getElementById("memberToggle");
  const historyDiv = document.getElementById("history");
  const clearBtn = document.getElementById("clearBtn");
  const modeNotice = document.getElementById("modeNotice");

  //////////////////////////////////////////////////
  // SAFE LOAD (prevents crashes)
  //////////////////////////////////////////////////
  let history;
  try {
    history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
  } catch {
    history = [];
  }

  function saveHistory() {
    localStorage.setItem("stepbetHistory", JSON.stringify(history));
  }

  function getMode() {
    return memberToggle.checked ? "Member" : "Non-Member";
  }

  function updateMode() {
    modeNotice.textContent =
      getMode() === "Non-Member"
        ? "Non-Member game (15% fee applied)"
        : "Member game";

    renderHistory();
  }

  function calculate() {
    const entry = parseFloat(entryInput.value);
    const pot = parseFloat(potInput.value);
    const players = parseFloat(playersInput.value);

    if (!entry || !pot || !players) {
      result.innerHTML = "Enter all fields";
      return;
    }

    const adjusted = getMode() === "Member" ? pot : pot * 0.85;

    const payout = +(adjusted / players).toFixed(2);
    const profit = +(payout - entry).toFixed(2);
    const roi = +((profit / entry) * 100).toFixed(1);

    result.innerHTML =
      `Payout: $${payout}<br>
       ${players} players: ${profit >= 0 ? "+" : ""}$${profit} (${roi}% ROI)`;

    //////////////////////////////////////////////////
    // SAVE HISTORY
    //////////////////////////////////////////////////
    history.unshift({
      payout,
      profit,
      roi,
      mode: getMode()
    });

    if (history.length > 20) history.pop();

    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    historyDiv.innerHTML = "";

    const filtered = history.filter(h => h.mode === getMode());

    if (!filtered.length) {
      historyDiv.innerHTML = "<div style='opacity:.5'>No history yet</div>";
      return;
    }

    filtered.forEach(h => {
      const div = document.createElement("div");
      div.className = "history-item";

      div.innerHTML = `
        <div><b>${h.mode}</b></div>
        <div>Payout: $${h.payout}</div>
        <div class="${h.profit >= 0 ? "positive" : "negative"}">
          ${h.profit >= 0 ? "+" : ""}$${h.profit}
        </div>
        <div>${h.roi}% ROI</div>
      `;

      historyDiv.appendChild(div);
    });
  }

  function clearHistory() {
    history = [];
    localStorage.removeItem("stepbetHistory");
    renderHistory();
  }

  //////////////////////////////////////////////////
  // CSV EXPORT
  //////////////////////////////////////////////////
  window.exportCSV = function () {
    if (!history.length) return alert("No data");

    let csv = "Mode,Payout,Profit,ROI\n";
    history.forEach(h => {
      csv += `${h.mode},${h.payout},${h.profit},${h.roi}\n`;
    });

    const blob = new Blob([csv]);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "stepbet.csv";
    a.click();
  };

  //////////////////////////////////////////////////
  // CSV IMPORT
  //////////////////////////////////////////////////
  fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = e => {
      const rows = e.target.result.split("\n").slice(1);

      history = rows.map(r => {
        const [mode, payout, profit, roi] = r.split(",");
        return {
          mode,
          payout: +payout,
          profit: +profit,
          roi: +roi
        };
      }).filter(r => r.mode);

      saveHistory();
      renderHistory();
    };

    reader.readAsText(file);
  });

  calculateBtn.addEventListener("click", calculate);
  memberToggle.addEventListener("change", updateMode);
  clearBtn.addEventListener("click", clearHistory);

  updateMode();
  renderHistory();

});
</script>

</body>
</html>
