<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
    overflow-x: hidden;
    touch-action: manipulation;
}

.container {
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 26px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
}

.clear-btn {
    background: #a02222;
    border: none;
    padding: 10px 14px;
    font-size: 13px;
    border-radius: 14px;
    color: white;
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
}

.input {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
}

.toggle {
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #0f1e33;
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #1db954 !important;
}

.calculate {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border-radius: 20px;
    border: none;
    background: #3c66c2;
    color: white;
}

.section-title {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

    background: #ff9d3c;
    border: none;
    padding: 10px 14px;
    border
