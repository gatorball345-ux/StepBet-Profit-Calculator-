<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#020c1b;
    color:white;
}

.container {
    max-width:400px;
    margin:auto;
    padding:15px;
}

/* INPUT */
.input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    background:#0c1f3a;
    color:white;
    text-align:center;
}

/* BUTTONS */
.btn {
    padding:10px;
    border:none;
    border-radius:10px;
    color:white;
}

.blue {background:#3c66c2;width:100%;padding:15px;}
.red {background:#a02222;}
.orange {background:#ff9d3c;}

/* TOGGLE */
.toggle {
    display:flex;
    margin-top:8px;
}

.toggle button {
    flex:1;
    padding:10px;
    background:#0f1e33;
    border:none;
    color:white;
}

.toggle button.active {
    background:#1db954 !important;
}

/* CARD */
.card {
    background:#0c1f3a;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    transition: transform 0.25s ease, opacity 0.25s ease;
    touch-action: pan-y;
}

/* SWIPE VISUAL */
.card.swiping {
    background:#2a0c0c;
}

/* REMOVE ANIMATION */
.card.removing {
    transform: translateX(-120%);
    opacity: 0;
}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}

.section {
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h3>StepCat Calculator</h3>

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Winners">

<div class="toggle">
    <button id="nonBtn" class="active">Non-Member</button>
    <button id="memBtn">Member</button>
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
    <b>Totals</b>
    <div>
        <button class="btn orange" id="loadTotal">Load</button>
        <button class="btn red" id="clearTotal">Clear</button>
    </div>
</div>

<div id="totals"></div>

<div class="section">
    <b>History</b>
    <div>
        <button class="btn orange" id="loadHistoryBtn">Load</button>
        <button class="btn red" id="clearHistoryBtn">Clear</button>
    </div>
</div>

<div id="history"></div>

</div>

<script>
window.onload = function(){

let mode="non";
let last=null;
let history=[];
let historyBackup=[];

const pot=document.getElementById("pot");
const fee=document.getElementById("fee");
const win=document.getElementById("win");

const totals=document.getElementById("totals");
const historyDiv=document.getElementById("history");

const nonBtn=document.getElementById("nonBtn");
const memBtn=document.getElementById("memBtn");

/* TOGGLE */
nonBtn.onclick=()=>{
    mode="non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
};

memBtn.onclick=()=>{
    mode="mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
};

/* CALCULATE */
document.getElementById("calcBtn").onclick=function(){

    let p=parseFloat(pot.value);
    let f=parseFloat(fee.value);
    let w=parseFloat(win.value);

    if(isNaN(p)||isNaN(f)||isNaN(w)) return;

    let member=p/w;
    let non=member*0.85;

    let payout=(mode==="mem")?member:non;
    let profit=payout-f;
    let roi=(profit/f)*100;

    let entry={
        label:(mode==="mem")?"Member Game":"Non-Member Game",
        payout,profit,roi
    };

    last=entry;

    history.unshift(entry);
    historyBackup=[...history];

    renderTotals(entry);
    renderHistory();
};

/* RENDER */
function renderTotals(d){
    totals.innerHTML=card(d);
}

function renderHistory(){
    historyDiv.innerHTML="";

    if(history.length===0){
        historyDiv.innerHTML="<div class='card'>History cleared</div>";
        return;
    }

    history.forEach((e,index)=>{
        let div=document.createElement("div");
        div.innerHTML=card(e);
        let cardEl=div.firstChild;

        addSwipe(cardEl,index);

        historyDiv.appendChild(cardEl);
    });
}

/* SWIPE DELETE */
function addSwipe(el,index){
    let startX=0;

    el.addEventListener("touchstart",(e)=>{
        startX=e.touches[0].clientX;
    });

    el.addEventListener("touchmove",(e)=>{
        let moveX=e.touches[0].clientX - startX;
        if(moveX < -20){
            el.style.transform=`translateX(${moveX}px)`;
            el.classList.add("swiping");
        }
    });

    el.addEventListener("touchend",(e)=>{
        let moveX=e.changedTouches[0].clientX - startX;

        if(moveX < -80){
            el.classList.add("removing");

            setTimeout(()=>{
                history.splice(index,1);
                historyBackup=[...history];
                renderHistory();
            },250);
        } else {
            el.style.transform="translateX(0)";
            el.classList.remove("swiping");
        }
    });
}

/* CARD TEMPLATE */
function card(d){
return `<div class="card">
<b>${d.label}</b><br>
Payout: $${d.payout.toFixed(2)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: $${d.profit.toFixed(2)}
</span><br>
<span class="roi">
ROI: ${d.roi.toFixed(1)}%
</span>
</div>`;
}

/* LOAD */
document.getElementById("loadTotal").onclick=function(){
    if(last) renderTotals(last);
};

document.getElementById("loadHistoryBtn").onclick=function(){
    history=[...historyBackup];
    renderHistory();
};

/* CLEAR */
document.getElementById("clearTotal").onclick=function(){
    totals.innerHTML="";
};

document.getElementById("clearHistoryBtn").onclick=function(){
    history=[];
    renderHistory();
};

};
</script>

</body>
</html>
