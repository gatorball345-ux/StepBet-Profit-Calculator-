<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
/* 🔥 PREVENT PAGE WIGGLE */
html, body {
  margin:0;
  padding:0;
  overflow-x:hidden;
  touch-action:manipulation;
  background:#020617;
  color:white;
  font-family:system-ui;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px 0;
}

h2 { text-align:center; }

input, #result {
  width:92%;
  margin:auto;
  display:block;
}

input {
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:14px;
  color:white;
  text-align:center;
}

/* 🔥 SLIDER TOGGLE */
.toggle {
  width:92%;
  margin:14px auto;
  position:relative;
  background:#111827;
  border-radius:14px;
  padding:4px;
  height:44px;
  overflow:hidden;
  touch-action:none; /* 🔥 prevents page drag */
}

.toggle-track {
  position:absolute;
  inset:4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.toggle-label {
  width:50%;
  text-align:center;
  z-index:2;
  color:#9ca3af;
}

.toggle-label.active {
  color:white;
  font-weight:bold;
}

/* 🔥 DRAGGABLE SLIDER */
.toggle-slider {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc(50% - 4px);
  background:#22c55e;
  border-radius:10px;
  transition:left 0.2s ease;
}

/* BUTTONS */
.button-row {
  width:92%;
  margin:16px auto;
  display:flex;
  gap:10px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  color:white;
  font-weight:bold;
}

.calc-btn { background:#2563eb; }
.clear-input-btn { background:#374151; }

#result {
  margin-top:20px;
  padding:18px;
  background:#111827;
  border-radius:14px;
}

.label { color:#22c55e; }

/* 🔥 FEE NOTE */
.fee-note {
  width:92%;
  margin:6px auto 0;
  font-size:12px;
  color:#9ca3af;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<!-- 🔥 SLIDER -->
<div class="toggle" id="toggle">
  <div class="toggle-slider" id="slider"></div>

  <div class="toggle-track">
    <div id="nonMemberLabel" class="toggle-label active">Non-Member</div>
    <div id="memberLabel" class="toggle-label">Member</div>
  </div>
</div>

<div class="fee-note">
Non-members: StepBet takes a 15% fee from winnings
</div>

<div class="button-row">
  <button class="calc-btn" onclick="calculate()">Calculate</button>
  <button class="clear-input-btn" onclick="clearInputs()">Clear</button>
</div>

<div id="result"></div>

</div>

<script>
let isMember = false;

/* 🔥 DRAG LOGIC */
const toggle = document.getElementById("toggle");
const slider = document.getElementById("slider");

let dragging = false;
let startX = 0;
let currentX = 0;

toggle.addEventListener("touchstart", (e) => {
  dragging = true;
  startX = e.touches[0].clientX;
});

toggle.addEventListener("touchmove", (e) => {
  if (!dragging) return;

  e.preventDefault(); // 🔥 stop page scroll

  currentX = e.touches[0].clientX;
  let dx = currentX - startX;

  const width = toggle.offsetWidth / 2;

  let newLeft = (isMember ? width : 0) + dx;

  newLeft = Math.max(0, Math.min(width, newLeft));

  slider.style.transition = "none";
  slider.style.left = newLeft + "px";
});

toggle.addEventListener("touchend", () => {
  dragging = false;

  const width = toggle.offsetWidth / 2;
  const currentLeft = parseFloat(slider.style.left || 0);

  isMember = currentLeft > width / 2;

  snapSlider();
});

/* 🔥 TAP SUPPORT */
toggle.addEventListener("click", () => {
  isMember = !isMember;
  snapSlider();
});

/* 🔥 SNAP */
function snapSlider() {
  const width = toggle.offsetWidth / 2;

  slider.style.transition = "left 0.2s ease";
  slider.style.left = isMember ? width + "px" : "4px";

  document.getElementById("memberLabel").classList.toggle("active", isMember);
  document.getElementById("nonMemberLabel").classList.toggle("active", !isMember);
}

/* CALCULATE */
function calculate() {
  const pot = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!pot || !fee || !winners) return alert("Enter valid numbers");

  let payout = pot / winners;
  if (!isMember) payout *= 0.85;

  const profit = payout - fee;
  const roi = (profit / fee) * 100;

  document.getElementById("result").innerHTML = `
    <div><span class="label">Payout:</span> $${payout.toFixed(2)}</div>
    <div><span class="label">Profit:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
    <div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
  `;
}

/* CLEAR */
function clearInputs() {
  document.getElementById("pot").value = "";
  document.getElementById("fee").value = "";
  document.getElementById("winners").value = "";
}

/* INIT */
snapSlider();
</script>

</body>
</html>
