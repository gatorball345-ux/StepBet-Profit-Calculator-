<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
html,body{
margin:0;padding:0;background:#020617;color:white;font-family:system-ui;
overflow-x:hidden;
}

.app{max-width:420px;margin:auto;padding:20px 0;}

input,#result,.history-wrapper{width:92%;margin:auto;display:block;}

input{
padding:16px;margin-top:12px;background:#111827;border:none;border-radius:14px;color:white;text-align:center;
}

/* TOGGLE */
.toggle{width:92%;margin:14px auto;position:relative;background:#111827;border-radius:14px;padding:4px;height:44px;}
.toggle-slider{
position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
background:#22c55e;border-radius:10px;transition:left .2s;
}
.toggle-track{position:absolute;inset:4px;display:flex;}
.toggle-label{width:50%;text-align:center;line-height:36px;color:#9ca3af;}
.toggle-label.active{color:white;font-weight:bold;}

/* BUTTONS */
.button-row{width:92%;margin:16px auto;display:flex;gap:10px;}
button{flex:1;padding:14px;border:none;border-radius:14px;color:white;font-weight:bold;}
.clear-input-btn{background:#374151;}
.calc-btn{background:#2563eb;}

/* RESULT */
#result{margin-top:20px;padding:18px;background:#111827;border-radius:14px;}
.label{color:#22c55e;}

/* TEXT */
.fee-note{width:92%;margin:6px auto;font-size:12px;color:#9ca3af;text-align:center;}

/* HISTORY */
.history-wrapper{position:relative;overflow:hidden;width:92%;margin:10px auto;}
.delete-bg{
position:absolute;right:0;top:0;bottom:0;width:80px;background:#ef4444;
display:flex;align-items:center;justify-content:center;font-weight:bold;
}
.history-item{
background:#111827;padding:14px;border-radius:12px;position:relative;
z-index:2;transition:transform .25s;
}

/* MODAL */
.modal{
position:fixed;inset:0;background:rgba(0,0,0,.7);
display:none;align-items:center;justify-content:center;z-index:1000;
}
.modal-box{
background:#111827;color:white;padding:20px;border-radius:14px;width:85%;max-width:320px;text-align:center;
}
.modal-box button{margin-top:10px;width:100%;}

/* UNDO BAR */
.undo-bar{
position:fixed;bottom:0;left:0;right:0;background:#111827;padding:16px;
display:none;justify-content:space-between;border-top:1px solid #374151;
}
.undo-btn{color:#22c55e;font-weight:bold;cursor:pointer;}
</style>
</head>

<body>

<div class="app">

<h2 style="text-align:center;">StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<div class="toggle" id="toggle">
<div class="toggle-slider" id="slider"></div>
<div class="toggle-track">
<div id="nonMemberLabel" class="toggle-label active">Non-Member</div>
<div id="memberLabel" class="toggle-label">Member</div>
</div>
</div>

<div class="fee-note" id="feeNote"></div>

<div class="button-row">
<button class="clear-input-btn" onclick="openClearModal()">Clear Inputs</button>
<button class="calc-btn" onclick="calculate()">Calculate</button>
</div>

<div id="result"></div>

<h3 style="width:92%;margin:auto;">Recent</h3>
<div id="historyContainer"></div>

</div>

<!-- DELETE MODAL -->
<div id="deleteModal" class="modal">
<div class="modal-box">
<div>Delete this entry?</div>
<button onclick="confirmDelete()">Delete</button>
<button onclick="closeDeleteModal()">Cancel</button>
</div>
</div>

<!-- CLEAR MODAL -->
<div id="clearModal" class="modal">
<div class="modal-box">
<div>What would you like to clear?</div>
<button onclick="clearInputsNow()">Clear Inputs</button>
<button onclick="clearHistory()">Clear History</button>
<button onclick="clearAll()">Clear All</button>
<label style="display:block;margin-top:10px;font-size:12px;">
<input type="checkbox" id="rememberChoice"> Remember my choice
</label>
<button onclick="closeClearModal()">Cancel</button>
</div>
</div>

<!-- UNDO -->
<div id="undoBar" class="undo-bar"></div>

<script>
let isMember=false;
let historyData=[];
let deleteIndex=null;
let lastDeleted=null;

/* TOGGLE */
const slider=document.getElementById("slider");
const toggle=document.getElementById("toggle");

toggle.onclick=()=>{
isMember=!isMember;
updateToggle();
};

function updateToggle(){
const width=toggle.offsetWidth/2;
slider.style.left=isMember?width+"px":"4px";

memberLabel.classList.toggle("active",isMember);
nonMemberLabel.classList.toggle("active",!isMember);

feeNote.textContent=isMember
?"Member games: no platform fee is deducted before payout calculations"
:"Non-member games: 15% is deducted from the total pot before payout calculations";
}

/* CALCULATE */
function calculate(){
const pot=parseFloat(potInput.value);
const fee=parseFloat(feeInput.value);
const winners=parseFloat(winnersInput.value);

if(!pot||!fee||!winners) return;

let payout=pot/winners;
if(!isMember) payout*=0.85;

const profit=payout-fee;
const roi=(profit/fee)*100;

result.innerHTML=`
<div><span class="label">Payout:</span> $${payout.toFixed(2)}</div>
<div><span class="label">Profit:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
<div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
`;

historyData.unshift({payout,profit,roi,isMember});
renderHistory();
}

/* HISTORY */
function renderHistory(){
historyContainer.innerHTML="";
historyData.forEach((item,i)=>{
const wrapper=document.createElement("div");
wrapper.className="history-wrapper";

const bg=document.createElement("div");
bg.className="delete-bg";
bg.textContent="DELETE";

const div=document.createElement("div");
div.className="history-item";

div.innerHTML=`
<b>${item.isMember?"Member":"Non-Member"}</b><br>
Payout: $${item.payout.toFixed(2)} |
Profit: ${(item.profit>=0?"+":"")}$${item.profit.toFixed(2)} |
ROI: ${item.roi.toFixed(1)}%
`;

div.onclick=()=>openDelete(i);

wrapper.appendChild(bg);
wrapper.appendChild(div);
historyContainer.appendChild(wrapper);
});
}

/* DELETE */
function openDelete(i){
deleteIndex=i;
deleteModal.style.display="flex";
}

function closeDeleteModal(){
deleteModal.style.display="none";
}

function confirmDelete(){
lastDeleted=historyData.splice(deleteIndex,1)[0];
renderHistory();
closeDeleteModal();
showUndo();
}

/* UNDO */
function showUndo(){
undoBar.innerHTML=`Entry deleted <span class="undo-btn" onclick="undoDelete()">UNDO</span>`;
undoBar.style.display="flex";
setTimeout(()=>undoBar.style.display="none",4000);
}

function undoDelete(){
if(!lastDeleted) return;
historyData.unshift(lastDeleted);
renderHistory();
undoBar.style.display="none";
}

/* CLEAR */
function openClearModal(){clearModal.style.display="flex";}
function closeClearModal(){clearModal.style.display="none";}

function clearInputsNow(){
potInput.value="";feeInput.value="";winnersInput.value="";
closeClearModal();
}

function clearHistory(){
historyData=[];
renderHistory();
closeClearModal();
}

function clearAll(){
historyData=[];
potInput.value="";feeInput.value="";winnersInput.value="";
renderHistory();
closeClearModal();
}

/* SHORTCUTS */
const potInput=document.getElementById("pot");
const feeInput=document.getElementById("fee");
const winnersInput=document.getElementById("winners");
const result=document.getElementById("result");
const historyContainer=document.getElementById("historyContainer");
const deleteModal=document.getElementById("deleteModal");
const clearModal=document.getElementById("clearModal");
const undoBar=document.getElementById("undoBar");
const feeNote=document.getElementById("feeNote");
const memberLabel=document.getElementById("memberLabel");
const nonMemberLabel=document.getElementById("nonMemberLabel");

/* INIT */
updateToggle();
</script>

</body>
</html>
