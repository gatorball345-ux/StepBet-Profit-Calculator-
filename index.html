<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
html, body {
  margin:0;
  padding:0;
  overflow-x:hidden;
  overscroll-behavior:auto;
  background:#020617;
  color:white;
  font-family:-apple-system, sans-serif;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px;
}

/* INPUTS */
input {
  width:100%;
  padding:18px;
  margin-top:14px;
  background:#0f172a;
  border:none;
  border-radius:16px;
  color:white;
  text-align:center;
  box-sizing:border-box;
}

/* TOGGLE */
.toggle {
  display:flex;
  margin-top:18px;
  border-radius:16px;
  overflow:hidden;
  background:#111827;
}

.toggle div {
  flex:1;
  padding:14px;
  text-align:center;
  color:#6b7280;
  font-weight:600;
}

.toggle .active {
  background:#16a34a;
  color:white;
}

/* BUTTONS */
.calc {
  margin-top:20px;
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:17px;
}

.clear {
  margin-top:14px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#374151;
  color:white;
}

/* RESULT */
.result {
  margin-top:22px;
  padding:18px;
  border-radius:18px;
  background:#0f172a;
}

/* HISTORY */
.history-item {
  margin-top:10px;
  padding:14px;
  background:#0f172a;
  border-radius:14px;
}

/* NOTE */
.note {
  text-align:center;
  font-size:13px;
  color:#9ca3af;
  margin-top:10px;
}

/* MODAL */
.modal {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0f172a;
  border-radius:20px 20px 0 0;
  padding:20px;
  display:none;
}

.modal button {
  width:100%;
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#1f2937;
  color:white;
}

.modal .danger {
  background:#7f1d1d;
}
</style>
</head>

<body>

<div class="app">

<h2 style="text-align:center;">StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<div class="toggle">
  <div id="nonBtn" class="active">Non-Member</div>
  <div id="memBtn">Member</div>
</div>

<div id="note" class="note"></div>

<button class="calc" onclick="calculate()">Calculate</button>
<button class="clear" onclick="openClear()">Clear</button>

<div id="result" class="result"></div>

<h3>Recent</h3>
<div id="history"></div>

</div>

<!-- CLEAR MENU -->
<div id="modal" class="modal">
  <div>What would you like to clear?</div>
  <button onclick="clearEntries()">Clear Entries</button>
  <button onclick="clearHistory()">Clear History</button>
  <button onclick="clearTotals()">Clear Totals</button>
  <button class="danger" onclick="clearAll()">Clear Everything</button>
  <button onclick="closeModal()">Cancel</button>
</div>

<script>
let isMember = false;

/* STORAGE */
function getHistory(){
  return JSON.parse(localStorage.getItem("stepbet_history") || "[]");
}

function setHistory(data){
  localStorage.setItem("stepbet_history", JSON.stringify(data));
}

let historyData = getHistory();

/* ELEMENTS */
const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");
const result = document.getElementById("result");
const history = document.getElementById("history");
const note = document.getElementById("note");

/* TOGGLE */
const nonBtn = document.getElementById("nonBtn");
const memBtn = document.getElementById("memBtn");

nonBtn.onclick = () => setMode(false);
memBtn.onclick = () => setMode(true);

function setMode(val){
  isMember = val;

  nonBtn.classList.toggle("active", !val);
  memBtn.classList.toggle("active", val);

  note.innerText = val
    ? "Member games: no platform fee applied"
    : "Non-member games: 15% deducted before payout calculations";
}

/* CALCULATE */
function calculate(){
  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  if(!p || !f || !w){
    alert("Enter valid values");
    return;
  }

  let payout = p / w;
  if(!isMember) payout *= 0.85;

  let profit = payout - f;
  let roi = (profit / f) * 100;

  result.innerHTML = `
    <div><b>Payout:</b> $${payout.toFixed(2)}</div>
    <div><b>Profit:</b> $${profit.toFixed(2)}</div>
    <div><b>ROI:</b> ${roi.toFixed(1)}%</div>
  `;

  /* 🔥 ALWAYS GET FRESH STORAGE */
  let currentHistory = getHistory();

  currentHistory.unshift({
    payout,
    profit,
    roi,
    isMember
  });

  setHistory(currentHistory);
  historyData = currentHistory;

  renderHistory();
}

/* RENDER */
function renderHistory(){
  history.innerHTML = "";

  historyData.forEach((h)=>{
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <b>${h.isMember ? "Member" : "Non-Member"}</b><br>
      Payout: $${h.payout.toFixed(2)} |
      Profit: $${h.profit.toFixed(2)} |
      ROI: ${h.roi.toFixed(1)}%
    `;

    history.appendChild(div);
  });
}

/* CLEAR */
function openClear(){ modal.style.display="block"; }
function closeModal(){ modal.style.display="none"; }

function clearEntries(){
  pot.value = fee.value = winners.value = "";
  closeModal();
}

function clearHistory(){
  historyData = [];
  localStorage.removeItem("stepbet_history");
  renderHistory();
  closeModal();
}

function clearTotals(){
  result.innerHTML = "";
  closeModal();
}

function clearAll(){
  clearEntries();
  clearHistory();
  clearTotals();
  closeModal();
}

/* INIT */
setMode(false);
renderHistory();
</script>

</body>
</html>
