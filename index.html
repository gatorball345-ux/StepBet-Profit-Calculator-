<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {margin:0;font-family:Arial;background:#020c1b;color:white;}
.container {max-width:420px;margin:auto;padding:15px;}

.input {
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:none;
background:#0c1f3a;
color:white;
text-align:center;
}

.btn {
padding:10px;
border:none;
border-radius:10px;
color:white;
margin-top:6px;
}

.blue {background:#3c66c2;width:100%;}
.red {background:#a02222;}
.gray {background:#666;}

.toggle {display:flex;margin-top:6px;}
.toggle button {
flex:1;
padding:10px;
border:none;
background:#0f1e33;
color:white;
}
.toggle .active {
background:#1db954;
}

.card {
background:#0c1f3a;
padding:12px;
border-radius:10px;
margin-top:8px;
transition:0.3s;
position:relative;
overflow:hidden;
}

.card.removing {
transform:translateX(-120%);
opacity:0;
}

.card.exporting {
transform:translateX(120%);
opacity:0;
}

/* EDGE GLOW */
.card::before {
content:"";
position:absolute;
top:0;left:0;height:100%;width:5px;
opacity:0;
transition:0.3s;
}

.card.deleteGlow::before {
background:red;
opacity:1;
}

.card.exportGlow::before {
background:lime;
opacity:1;
}

.section {display:flex;justify-content:space-between;margin-top:10px;}
.empty {opacity:0.6;text-align:center;}

</style>
</head>

<body>
<div class="container">

<h3>StepCat Calculator</h3>

<input id="name" class="input" placeholder="Game Name">

<input id="start" type="date" class="input">
<input id="end" type="date" class="input">

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Winners">

<!-- MEMBER TOGGLE -->
<div class="toggle">
<button id="nonBtn" class="active">Non-Member</button>
<button id="memBtn">Member</button>
</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<div class="section">
<b>Totals</b>
</div>
<div id="totals"></div>

<div class="section">
<b>History</b>
</div>
<div id="history"></div>

</div>

<script>

let mode="non";

let totals = JSON.parse(localStorage.getItem("totals") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

function save(){
localStorage.setItem("totals", JSON.stringify(totals));
localStorage.setItem("history", JSON.stringify(history));
}

/* TOGGLE */
nonBtn.onclick=()=>{
mode="non";
nonBtn.classList.add("active");
memBtn.classList.remove("active");
};

memBtn.onclick=()=>{
mode="mem";
memBtn.classList.add("active");
nonBtn.classList.remove("active");
};

/* CALCULATE */
function calculate(){

let p=parseFloat(pot.value);
let f=parseFloat(fee.value);
let w=parseFloat(win.value);

if(isNaN(p)||isNaN(f)||isNaN(w)){
alert("Enter valid numbers");
return;
}

/* CORRECT FORMULAS */
let member = p / w;
let non = member * 0.85;

let payout = (mode==="mem") ? member : non;
let profit = payout - f;
let roi = (profit / f) * 100;

let entry={
name:name.value || "Game",
start:start.value || "",
end:end.value || "",
payout,profit,roi,
created:Date.now()
};

totals.unshift(entry);
history.unshift(entry);

if(totals.length>5){
history.unshift(totals.pop());
}

save();
renderAll();
}

/* STATUS */
function getStatus(e){
if(e.profit>0) return "Won";
if(e.profit===0) return "Draw";
return "Loss";
}

/* CREATE CARD */
function createCard(e,i,type){

let div=document.createElement("div");
div.className="card";

let status=getStatus(e);

div.innerHTML=`
<b>${e.name}</b><br>
${e.start} → ${e.end}<br>
${status}<br>
$${e.payout.toFixed(2)} | $${e.profit.toFixed(2)} | ${e.roi.toFixed(1)}%
`;

let startX=0;

/* TOUCH START */
div.addEventListener("touchstart",t=>{
startX=t.touches[0].clientX;
});

/* TOUCH MOVE (GLOW FEEDBACK) */
div.addEventListener("touchmove",t=>{
let move=t.touches[0].clientX - startX;

div.classList.remove("deleteGlow","exportGlow");

if(move < -30) div.classList.add("deleteGlow");
if(move > 30) div.classList.add("exportGlow");
});

/* TOUCH END */
div.addEventListener("touchend",t=>{
let move=t.changedTouches[0].clientX - startX;

/* DELETE */
if(move < -80){
div.classList.add("removing");

if(type==="totals"){
totals.splice(i,1);
}
if(type==="history"){
history.splice(i,1);
}

setTimeout(()=>{
save();
renderAll();
},200);
}

/* EXPORT */
if(move > 80){

if(confirm("Export this entry?")){
exportSingle(e);
}

div.classList.remove("exportGlow");
}
});

return div;
}

/* EXPORT SINGLE */
function exportSingle(e){

let status=getStatus(e);

let html=`
<html><body style="background:#020c1b;color:white;font-family:Arial">
<h2>Game Export</h2>
<b>${e.name}</b><br>
${e.start} → ${e.end}<br><br>
Status: ${status}<br>
Payout: $${e.payout.toFixed(2)}<br>
Profit: $${e.profit.toFixed(2)}<br>
ROI: ${e.roi.toFixed(1)}%
</body></html>
`;

let blob=new Blob([html],{type:"text/html"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="StepCat_Entry.html";
a.click();
}

/* RENDER */
function renderTotals(){
totalsDiv.innerHTML="";
if(!totals.length){
totalsDiv.innerHTML="<div class='empty'>Totals empty</div>";
return;
}
totals.forEach((e,i)=>{
totalsDiv.appendChild(createCard(e,i,"totals"));
});
}

function renderHistory(){
historyDiv.innerHTML="";
if(!history.length){
historyDiv.innerHTML="<div class='empty'>History empty</div>";
return;
}
history.forEach((e,i)=>{
historyDiv.appendChild(createCard(e,i,"history"));
});
}

function renderAll(){
renderTotals();
renderHistory();
}

/* INIT */
renderAll();

</script>
</body>
</html>
