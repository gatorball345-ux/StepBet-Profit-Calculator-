<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
}

/* ===== CONTAINER ===== */
.container {
    padding: 20px;
}

/* ===== TITLE ===== */
.title {
    text-align: center;
    font-size: 28px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
    margin-bottom: 20px;
}

/* ===== INPUTS ===== */
.input {
    width: 100%;
    padding: 16px;
    margin-bottom: 14px;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    font-size: 16px;
    text-align: center;
}

/* ===== BUTTON BASE ===== */
.btn {
    width: 100%;
    padding: 16px;
    border-radius: 20px;
    border: none;
    font-size: 16px;
    margin-bottom: 14px;
    cursor: pointer;
}

/* ===== BUTTON COLORS + GLOW ===== */
.red {
    background: #a02222;
    box-shadow: 0 0 15px rgba(255,0,0,0.5);
}

.blue {
    background: #3c66c2;
    box-shadow: 0 0 15px rgba(0,100,255,0.5);
}

.green {
    background: #22a04a;
}

/* ===== TOGGLE ===== */
.toggle {
    display: flex;
    border-radius: 20px;
    overflow: hidden;
    background: #0c1f3a;
    margin-bottom: 14px;
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #22a04a !important;
}

/* ===== SECTIONS ===== */
.section-title {
    font-size: 20px;
    margin: 20px 0 10px;
}

/* ===== CARD ===== */
.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 14px;
}

/* ===== COLORS ===== */
.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

/* ===== SMALL CLEAR BUTTON ===== */
.small-btn {
    padding: 10px 16px;
    border-radius: 14px;
    border: none;
    background: #a02222;
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
    float: right;
}

/* ===== HISTORY SCROLL ===== */
.history {
    max-height: 300px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="container">

<div class="title">StepCat Calculator</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<button class="btn red" onclick="clearInputs()">Clear Entries</button>

<div class="toggle">
    <button id="nonBtn" class="active" onclick="setMode('non')">Non-Member</button>
    <button id="memBtn" onclick="setMode('mem')">Member</button>
</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<!-- TOTALS -->
<div class="section-title">
    Totals
    <button class="small-btn" onclick="clearTotals()">Clear</button>
</div>

<div id="totals"></div>

<!-- HISTORY -->
<div class="section-title">
    Recent History
    <button class="small-btn" onclick="clearHistory()">Clear</button>
</div>

<div id="history" class="history"></div>

</div>

<script>
let mode = "non";

/* ===== MODE TOGGLE ===== */
function setMode(type){
    mode = type;

    document.getElementById("nonBtn").classList.remove("active");
    document.getElementById("memBtn").classList.remove("active");

    if(type === "non"){
        document.getElementById("nonBtn").classList.add("active");
    } else {
        document.getElementById("memBtn").classList.add("active");
    }
}

/* ===== CALCULATE ===== */
function calculate(){
    let pot = parseFloat(document.getElementById("pot").value);
    let fee = parseFloat(document.getElementById("fee").value);
    let winners = parseFloat(document.getElementById("winners").value);

    if(!pot || !fee || !winners) return;

    let payout = pot / winners;

    // Adjust for membership
    if(mode === "mem"){
        payout *= 1.1368; // member boost
    }

    let profit = payout - fee;
    let roi = (profit / fee) * 100;

    let gameType = mode === "mem" ? "Member Game" : "Non-Member Game";

    let card = `
    <div class="card">
        <b>${gameType}</b><br><br>
        Payout: $${payout.toFixed(2)}<br>
        <span class="${profit >= 0 ? 'profit' : 'loss'}">
        Profit: $${profit.toFixed(2)}
        </span><br>
        <span class="roi">
        ROI: ${roi.toFixed(1)}%
        </span>
    </div>
    `;

    // show totals
    document.getElementById("totals").innerHTML = card;

    // add to history
    let history = document.getElementById("history");
    history.innerHTML = card + history.innerHTML;
}

/* ===== CLEAR FUNCTIONS ===== */
function clearInputs(){
    document.getElementById("pot").value = "";
    document.getElementById("fee").value = "";
    document.getElementById("winners").value = "";
}

function clearTotals(){
    document.getElementById("totals").innerHTML = "";
}

function clearHistory(){
    document.getElementById("history").innerHTML = "";
}
</script>

</body>
</html>
