<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StepBet Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

  <h1>StepBet Profit</h1>

  <input id="entry" placeholder="Entry Fee ($)">
  <input id="pot" placeholder="Total Pot ($)">
  <input id="players" placeholder="Eligible Winners">

  <div class="toggle">
    <span>Non-member</span>
    <input type="checkbox" id="memberToggle">
    <span>Member</span>
  </div>

  <!-- 🔁 MODE TOGGLE -->
  <div class="mode-toggle">
    <span>Simple</span>
    <input type="checkbox" id="modeToggle">
    <span>Advanced</span>
  </div>

  <!-- ✅ ALWAYS SHOWN -->
  <div id="result"></div>

  <!-- 🚀 ADVANCED ONLY -->
  <div id="advancedSection">
    <div id="prediction"></div>
    <div id="gameTier"></div>
    <div id="gameEV"></div>
    <div id="efficiency"></div>
    <div id="lossRisk"></div>
    <div id="exposure"></div>
    <div id="confidence"></div>
    <div id="edge"></div>
    <div id="ranking"></div>
    <div id="alerts"></div>
    <div id="aiInsights"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
