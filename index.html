<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {margin:0;font-family:Arial;background:#020c1b;color:white;}
.container {max-width:420px;margin:auto;padding:15px;}
.input {width:100%;padding:10px;margin:6px 0;border-radius:10px;border:none;background:#0c1f3a;color:white;text-align:center;}
.btn {padding:8px 10px;border:none;border-radius:10px;color:white;font-size:12px;margin:2px;}
.blue {background:#3c66c2;width:100%;padding:12px;}
.red {background:#a02222;}
.gray {background:#666;}
.card {background:#0c1f3a;padding:10px;border-radius:10px;margin-top:8px;transition:0.3s;}
.card.removing {transform:translateX(-120%);opacity:0;}
.section {display:flex;justify-content:space-between;margin-top:10px;}
.empty {opacity:0.6;text-align:center;}
</style>
</head>

<body>
<div class="container">

<h3>StepCat Calculator</h3>

<input id="name" class="input" placeholder="Game Name">
<input id="start" type="date" class="input">

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Winners">

<button class="btn blue" onclick="calculate()">Calculate</button>

<div class="section">
<b>Totals</b>
<div>
<button class="btn gray" onclick="undoTotals()">Undo</button>
<button class="btn red" onclick="clearTotals()">Clear</button>
</div>
</div>
<div id="totals"></div>

<div class="section">
<b>History</b>
<div>
<button class="btn gray" onclick="undoHistory()">Undo</button>
<button class="btn red" onclick="clearHistory()">Clear</button>
<button class="btn blue" onclick="downloadHTML()">Export</button>
</div>
</div>
<div id="history"></div>

</div>

<script>

/* ========= STORAGE ========= */
let totals = JSON.parse(localStorage.getItem("totals") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

let undoT = [];
let undoH = [];

function save(){
    localStorage.setItem("totals", JSON.stringify(totals));
    localStorage.setItem("history", JSON.stringify(history));
}

/* ========= CALCULATE ========= */
function calculate(){

    let p=parseFloat(pot.value);
    let f=parseFloat(fee.value);
    let w=parseFloat(win.value);

    if(isNaN(p)||isNaN(f)||isNaN(w)) return;

    let payout=p/w;
    let profit=payout-f;
    let roi=(profit/f)*100;

    let entry={
        name:name.value||"Game",
        date:start.value||"",
        payout,profit,roi,
        created:Date.now()
    };

    totals.unshift(entry);
    history.unshift(entry);

    if(totals.length>5){
        history.unshift(totals.pop());
    }

    save();
    renderAll();
}

/* ========= STATUS ========= */
function getStatus(e){
    if(e.profit>0) return "Won";
    if(e.profit===0) return "Draw";
    return "Loss";
}

/* ========= RENDER ========= */
function renderTotals(){
    totalsDiv.innerHTML="";
    if(!totals.length) return totalsDiv.innerHTML="<div class='empty'>Totals empty</div>";

    totals.forEach((e,i)=>{
        let el=createCard(e,i,"totals");
        totalsDiv.appendChild(el);
    });
}

function renderHistory(){
    historyDiv.innerHTML="";
    if(!history.length) return historyDiv.innerHTML="<div class='empty'>History empty</div>";

    history.forEach((e,i)=>{
        let el=createCard(e,i,"history");
        historyDiv.appendChild(el);
    });
}

function createCard(e,i,type){
    let div=document.createElement("div");
    div.className="card";

    let status=getStatus(e);

    div.innerHTML=`
    <b>${e.name}</b><br>
    ${status}<br>
    $${e.payout.toFixed(2)} | $${e.profit.toFixed(2)} | ${e.roi.toFixed(1)}%
    `;

    /* SWIPE */
    let startX=0;

    div.addEventListener("touchstart",t=>startX=t.touches[0].clientX);

    div.addEventListener("touchend",t=>{
        let move=t.changedTouches[0].clientX-startX;
        if(move<-80){
            div.classList.add("removing");

            if(type==="totals"){
                undoT.push(e);
                totals.splice(i,1);
                setTimeout(()=>{save();renderTotals();},200);
            }

            if(type==="history"){
                undoH.push(e);
                history.splice(i,1);
                setTimeout(()=>{save();renderHistory();},200);
            }
        }
    });

    return div;
}

function renderAll(){
    renderTotals();
    renderHistory();
}

/* ========= UNDO ========= */
function undoTotals(){
    if(undoT.length){
        totals.unshift(undoT.pop());
        save();
        renderTotals();
    }
}

function undoHistory(){
    if(undoH.length){
        history.unshift(undoH.pop());
        save();
        renderHistory();
    }
}

/* ========= CLEAR ========= */
function clearTotals(){
    if(confirm("Clear totals permanently?")){
        totals=[];
        save();
        renderTotals();
    }
}

function clearHistory(){
    if(confirm("Clear history permanently?")){
        history=[];
        save();
        renderHistory();
    }
}

/* ========= HTML EXPORT ========= */
function downloadHTML(){

    let sorted=[...history].sort((a,b)=>(a.date||a.created)-(b.date||b.created));

    let rows="";
    let totalProfit=0;

    sorted.forEach(e=>{
        let status=getStatus(e);

        let color=
        status==="Won"?"#163d2b":
        status==="Loss"?"#3d1616":
        status==="Draw"?"#3a3a3a":"#3d3a16";

        totalProfit+=e.profit;

        rows+=`
        <tr style="background:${color}">
        <td>${e.name}</td>
        <td>${e.date}</td>
        <td>${status}</td>
        <td>${e.payout.toFixed(2)}</td>
        <td>${e.profit.toFixed(2)}</td>
        <td>${e.roi.toFixed(1)}%</td>
        </tr>`;
    });

    let html=`
    <html><body style="background:#020c1b;color:white;font-family:Arial">
    <h2>StepCat Report</h2>
    <table border="1" cellpadding="6">
    <tr>
    <th>Name</th><th>Date</th><th>Status</th>
    <th>Payout</th><th>Profit</th><th>ROI</th>
    </tr>
    ${rows}
    </table>
    <br>Total Profit: $${totalProfit.toFixed(2)}
    </body></html>`;

    let blob=new Blob([html],{type:"text/html"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="StepCat_Report.html";
    a.click();
}

/* INIT */
renderAll();

</script>
</body>
</html>
