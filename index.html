<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
}

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

.history-item {
  background: #111827;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  font-size: 14px;
}

.positive { color: #22c55e; }
.negative { color: #f97316; }

.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.switch {
  position: relative;
  width: 50px;
  height: 26px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  cursor: pointer;
  background: #374151;
  border-radius: 34px;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  transition: 0.3s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider:before {
  transform: translateX(24px);
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<div class="toggle">
  <span id="modeLabel">Non-Member (-15%)</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle" onchange="updateMode()">
    <span class="slider"></span>
  </label>

  <span>Member</span>
</div>

<label>Total Pot</label>
<input id="pot" type="number">

<label>Entry Fee</label>
<input id="entry" type="number">

<label>Eligible Winners</label>
<input id="players" type="number">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory") || "[]");

function updateMode() {
  const toggle = document.getElementById("memberToggle");
  const label = document.getElementById("modeLabel");

  const mode = toggle.checked ? "Member" : "Non-Member";

  label.textContent = toggle.checked
    ? "Member"
    : "Non-Member (-15%)";

  renderHistory(mode);
}

function calculate() {
  const entry = parseFloat(document.getElementById("entry").value);
  const pot = parseFloat(document.getElementById("pot").value);
  const players = parseFloat(document.getElementById("players").value);
  const toggle = document.getElementById("memberToggle");
  const result = document.getElementById("result");

  if (!entry || !pot || !players) {
    result.innerHTML = "Enter all fields";
    return;
  }

  const mode = toggle.checked ? "Member" : "Non-Member";

  let adjusted = toggle.checked ? pot : pot * 0.85;

  const breakEven = Math.round(adjusted / entry);

  let payout = adjusted / players;
  if (players === breakEven) payout = entry;

  payout = Number(payout.toFixed(2));
  const profit = Number((payout - entry).toFixed(2));
  const roi = Number(((profit / entry) * 100).toFixed(1));

  result.innerHTML =
    "<div><strong>Payout:</strong> $" + payout + "</div>" +
    "<div class='" + (profit >= 0 ? "positive" : "negative") + "'>" +
    "Break-even: " + breakEven + " → $" + entry.toFixed(2) + " (0.0% ROI)<br>" +
    players + " players: " +
    (profit >= 0 ? "+" : "") +
    "$" + profit + " (" + roi + "% ROI)" +
    "</div>";

  // SAVE WITH MODE
  const data = { payout, roi, mode };

  history.unshift(data);
  if (history.length > 10) history.pop();

  localStorage.setItem("stepbetHistory", JSON.stringify(history));

  renderHistory(mode);
}

function renderHistory(currentMode) {
  const historyDiv = document.getElementById("history");
  historyDiv.innerHTML = "";

  const filtered = history.filter(h => h.mode === currentMode);

  filtered.forEach(h => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerText =
      h.mode + " — $" + h.payout + " (" + h.roi + "% ROI)";
    historyDiv.appendChild(div);
  });
}

// INITIAL LOAD
updateMode();
</script>

</body>
</html>
