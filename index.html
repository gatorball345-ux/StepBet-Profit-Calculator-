<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
}

.clear-btn { background: #ef4444; }
.secondary-btn { background: #334155; }

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

.history-item {
  background: #111827;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
}

.positive { color: #22c55e; }
.negative { color: #f97316; }

.toggle {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

#modeNotice {
  text-align: center;
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 16px;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.modal-box button {
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<div class="toggle">
  <span>Non-Member</span>
  <input type="checkbox" id="memberToggle" onchange="updateMode()">
  <span>Member</span>
</div>

<div id="modeNotice"></div>

<input id="pot" placeholder="Total Pot" type="number">
<input id="entry" placeholder="Entry Fee" type="number">
<input id="players" placeholder="Eligible Winners" type="number">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<!-- ✅ SWAPPED ORDER -->
<button class="secondary-btn" onclick="document.getElementById('fileInput').click()">Import CSV</button>
<button class="secondary-btn" onclick="exportCSV()">Export CSV</button>
<input type="file" id="fileInput" accept=".csv" style="display:none">

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<!-- ✅ CUSTOM POPUP -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div>Delete this entry?</div>
    <button onclick="confirmDelete()">Yes</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory") || "[]");
let deleteIndex = null;

function getMode() {
  return document.getElementById("memberToggle").checked ? "Member" : "Non-Member";
}

function updateMode() {
  modeNotice.innerHTML = getMode() === "Non-Member"
    ? "Non-Member game (15% fee applied)"
    : "Member game";

  renderHistory(getMode());
}

function calculate() {
  const entryVal = parseFloat(document.getElementById("entry").value);
  const potVal = parseFloat(document.getElementById("pot").value);
  const playersVal = parseFloat(document.getElementById("players").value);

  if (!entryVal || !potVal || !playersVal) return;

  const adjusted = getMode() === "Member" ? potVal : potVal * 0.85;

  const payout = +(adjusted / playersVal).toFixed(2);
  const profit = +(payout - entryVal).toFixed(2);
  const roi = +((profit / entryVal) * 100).toFixed(1);

  result.innerHTML =
    `Payout: $${payout}<br>
     ${playersVal} players: ${profit >= 0 ? "+" : ""}$${profit} (${roi}% ROI)`;

  history.unshift({ payout, profit, roi, mode: getMode() });
  localStorage.setItem("stepbetHistory", JSON.stringify(history));

  renderHistory(getMode());
}

function renderHistory(mode) {
  historyDiv.innerHTML = "";

  history.filter(h => h.mode === mode).forEach((h, i) => {
    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <div><b>${h.mode}</b></div>
      <div>Payout: $${h.payout}</div>
      <div class="${h.profit >= 0 ? "positive" : "negative"}">
        Profit: ${h.profit >= 0 ? "+" : ""}$${h.profit}
      </div>
      <div>ROI: ${h.roi}%</div>
    `;

    // ✅ LONG PRESS → MODAL
    let timer;
    div.addEventListener("touchstart", () => {
      timer = setTimeout(() => {
        deleteIndex = i;
        modal.style.display = "flex";
      }, 600);
    });

    div.addEventListener("touchend", () => clearTimeout(timer));
    div.addEventListener("touchmove", () => clearTimeout(timer));

    historyDiv.appendChild(div);
  });
}

function confirmDelete() {
  if (deleteIndex !== null) {
    history.splice(deleteIndex, 1);
    localStorage.setItem("stepbetHistory", JSON.stringify(history));
    renderHistory(getMode());
  }
  closeModal();
}

function closeModal() {
  modal.style.display = "none";
  deleteIndex = null;
}

function clearHistory() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory(getMode());
}

function exportCSV() {
  let csv = "Mode,Payout,Profit,ROI\n";
  history.forEach(h => {
    csv += `${h.mode},${h.payout},${h.profit},${h.roi}\n`;
  });

  const blob = new Blob([csv]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stepbet.csv";
  a.click();
}

fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = e => {
    const rows = e.target.result.split("\n").slice(1);

    history = rows.map(r => {
      const [mode, payout, profit, roi] = r.split(",");
      return { mode, payout:+payout, profit:+profit, roi:+roi };
    });

    localStorage.setItem("stepbetHistory", JSON.stringify(history));
    renderHistory(getMode());
  };

  reader.readAsText(file);
});

updateMode();
</script>

</body>
</html>
