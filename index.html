<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
margin:0;
font-family:Arial;
background:#020c1b;
color:white;
}

.container {
max-width:420px;
margin:auto;
padding:15px;
}

.header {
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.title {
font-size:22px;
color:#ff9d3c;
}

/* INPUT */
.input {
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:none;
background:#0c1f3a;
color:white;
text-align:center;
}

/* BUTTON */
.btn {
padding:10px;
border:none;
border-radius:10px;
color:white;
margin-top:6px;
transition:0.2s;
}

.blue {background:#3c66c2;width:100%;}
.red {background:#a02222;}

/* BUTTON FEEDBACK */
.calc-active {
background:#3c66c2 !important;
box-shadow:0 0 12px rgba(60,102,194,0.8);
transform:scale(0.96);
}

/* TOGGLE */
.toggle-wrap {
margin-top:10px;
background:#0f1e33;
border-radius:30px;
position:relative;
display:flex;
overflow:hidden;
}

.toggle-slider {
position:absolute;
top:0;
left:0;
width:50%;
height:100%;
background:#1db954;
border-radius:30px;
transition:0.3s;
}

.toggle-option {
flex:1;
padding:10px;
text-align:center;
z-index:1;
cursor:pointer;
display:flex;
justify-content:center;
gap:6px;
}

/* DATE INPUT */
.date-wrap {
position: relative;
}

.date-wrap input {
padding-right:35px;
}

.date-placeholder {
position:absolute;
left:50%;
top:50%;
transform:translate(-50%, -50%);
color:rgba(255,255,255,0.6);
pointer-events:none;
transition:0.2s;
}

.date-icon {
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
opacity:0.6;
}

/* CARD */
.card {
background:#0c1f3a;
padding:12px;
border-radius:10px;
margin-top:8px;
transition:0.3s;
}

.flash {
animation:flash 0.4s;
}

@keyframes flash {
0% {background:#1db954;}
100% {background:#0c1f3a;}
}

.empty {
opacity:0.6;
text-align:center;
margin-top:6px;
}

.section {
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}

.note {
text-align:center;
font-size:13px;
margin-top:6px;
opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">StepCat</div>
<button class="btn red" id="clearInputsBtn">Clear Entries</button>
</div>

<input id="name" class="input" placeholder="Game Name (optional)">

<div class="date-wrap">
<input id="start" type="date" class="input">
<span class="date-placeholder">Game Start Date (optional)</span>
<span class="date-icon">📅</span>
</div>

<div class="date-wrap">
<input id="end" type="date" class="input">
<span class="date-placeholder">Game End Date (optional)</span>
<span class="date-icon">📅</span>
</div>

<input id="pot" class="input" placeholder="Total Pot (required)">
<input id="fee" class="input" placeholder="Entry Fee (required)">
<input id="win" class="input" placeholder="Winners (required)">

<!-- TOGGLE -->
<div class="toggle-wrap" onclick="toggleMode()">
<div id="slider" class="toggle-slider"></div>
<div class="toggle-option">👤 Non</div>
<div class="toggle-option">⭐ Member</div>
</div>

<div id="modeNote" class="note">
Non-member: 15% platform fee applied
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
<b>Totals</b>
<button class="btn red" id="clearTotalsBtn">Clear</button>
</div>
<div id="totals"></div>

<div class="section">
<b>History</b>
<button class="btn red" id="clearHistoryBtn">Clear</button>
</div>
<div id="history"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let mode = "non";

/* ELEMENTS */
const potEl = document.getElementById("pot");
const feeEl = document.getElementById("fee");
const winEl = document.getElementById("win");
const nameEl = document.getElementById("name");
const startEl = document.getElementById("start");
const endEl = document.getElementById("end");

const calcBtn = document.getElementById("calcBtn");
const slider = document.getElementById("slider");
const modeNote = document.getElementById("modeNote");

const totalsDiv = document.getElementById("totals");
const historyDiv = document.getElementById("history");

/* STORAGE */
let totals = JSON.parse(localStorage.getItem("totals") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

function save(){
localStorage.setItem("totals", JSON.stringify(totals));
localStorage.setItem("history", JSON.stringify(history));
}

/* TOGGLE */
window.toggleMode = function(){
mode = (mode === "non") ? "mem" : "non";

if(mode === "mem"){
slider.style.left = "50%";
modeNote.innerText = "Member: full payout (no fee)";
}else{
slider.style.left = "0%";
modeNote.innerText = "Non-member: 15% fee applied";
}
};

/* DATE PLACEHOLDER */
function updateDatePlaceholders(){
document.querySelectorAll(".date-wrap").forEach(wrap=>{
let input = wrap.querySelector("input");
let placeholder = wrap.querySelector(".date-placeholder");
placeholder.style.opacity = input.value ? "0" : "1";
});
}

startEl.addEventListener("change", updateDatePlaceholders);
endEl.addEventListener("change", updateDatePlaceholders);

/* DATE FORMAT */
function formatDate(d){
if(!d) return "";
let date = new Date(d);
return `${date.getMonth()+1}-${date.getDate()}-${date.getFullYear()}`;
}

/* CALCULATE */
calcBtn.onclick = function(){

calcBtn.classList.add("calc-active");
calcBtn.innerText = "Calculating...";

if(navigator.vibrate) navigator.vibrate(50);

setTimeout(()=>{

let p = parseFloat(potEl.value);
let f = parseFloat(feeEl.value);
let w = parseFloat(winEl.value);

if(isNaN(p)||isNaN(f)||isNaN(w)){
alert("Enter required values");
resetBtn();
return;
}

let payout = (mode==="mem") ? (p/w) : (p/w)*0.85;
let profit = payout - f;
let roi = (profit/f)*100;

let icon = (mode==="mem") ? "⭐" : "👤";

let entry = {
name: nameEl.value || "Game",
icon,
start: formatDate(startEl.value),
end: formatDate(endEl.value),
mode,
payout,
profit,
roi
};

/* TOTALS */
totals.unshift(entry);
if(totals.length > 5) totals.pop();

/* HISTORY */
history.unshift(entry);
if(history.length > 200) history.pop();

save();
render();

/* FLASH */
document.querySelectorAll(".card").forEach(c=>{
c.classList.add("flash");
});

resetBtn();

}, 250);
};

function resetBtn(){
calcBtn.classList.remove("calc-active");
calcBtn.innerText = "Calculate";
}

/* RENDER */
function createCard(e){
return `
<div class="card">
<b>${e.icon} ${e.name}</b><br>
${e.start} ${e.end ? "→ "+e.end : ""}<br><br>
Payout: $${e.payout.toFixed(2)}<br>
Profit: $${e.profit.toFixed(2)}<br>
ROI: ${e.roi.toFixed(1)}%
</div>`;
}

function render(){
totalsDiv.innerHTML = totals.length
? totals.map(createCard).join("")
: "<div class='empty'>Totals empty</div>";

historyDiv.innerHTML = history.length
? history.map(createCard).join("")
: "<div class='empty'>History empty</div>";
}

/* CLEAR */
document.getElementById("clearInputsBtn").onclick = ()=>{
nameEl.value="";
startEl.value="";
endEl.value="";
potEl.value="";
feeEl.value="";
winEl.value="";
updateDatePlaceholders();
};

document.getElementById("clearTotalsBtn").onclick = ()=>{
totals=[];
save();
render();
};

document.getElementById("clearHistoryBtn").onclick = ()=>{
history=[];
save();
render();
};

/* INIT */
render();
updateDatePlaceholders();

});
</script>

</body>
</html>
