<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#020c1b;
  color:white;
}

.container {
  max-width:420px;
  margin:auto;
  padding:15px;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.title {
  font-size:22px;
  color:#ff9d3c;
}

.input, .date-input {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:#0c1f3a;
  color:white;
  text-align:center;
  font-size:16px;
}

/* Date wrapper */
.date-wrap {
  position:relative;
}

.date-placeholder {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.6);
  pointer-events:none;
  font-size:16px;
}

.date-icon {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  opacity:0.6;
}

/* Buttons */
.btn {
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  margin-top:6px;
  transition:0.2s;
}

.blue {
  background:#3c66c2;
  width:100%;
}

.red {
  background:#a02222;
}

/* Calculate animation */
.calc-active {
  box-shadow:0 0 25px rgba(60,102,194,1);
  transform:scale(0.96);
}

/* Toggle */
.toggle-wrap {
  margin-top:10px;
  background:#0f1e33;
  border-radius:30px;
  position:relative;
  display:flex;
  overflow:hidden;
}

.toggle-slider {
  position:absolute;
  top:0;
  left:0;
  width:50%;
  height:100%;
  background:#1db954;
  border-radius:30px;
  transition:0.3s;
}

.toggle-option {
  flex:1;
  padding:10px;
  text-align:center;
  z-index:1;
}

/* Cards */
.card {
  background:#0c1f3a;
  padding:12px;
  border-radius:10px;
  margin-top:8px;
}

/* Colors */
.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}

.empty {
  opacity:0.6;
  text-align:center;
  margin-top:6px;
}

.section {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:15px;
}

.note {
  text-align:center;
  font-size:13px;
  margin-top:6px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="title">StepCat</div>
  <button class="btn red" id="clearInputsBtn">Clear Entries</button>
</div>

<input id="name" class="input" placeholder="Game Name (optional)">

<div class="date-wrap">
  <input id="start" type="date" class="date-input">
  <span class="date-placeholder">Game Start Date (optional)</span>
  <span class="date-icon">📅</span>
</div>

<div class="date-wrap">
  <input id="end" type="date" class="date-input">
  <span class="date-placeholder">Game End Date (optional)</span>
  <span class="date-icon">📅</span>
</div>

<input id="pot" class="input" placeholder="Total Pot (required)">
<input id="fee" class="input" placeholder="Entry Fee (required)">
<input id="win" class="input" placeholder="Prospects (required)">

<div class="toggle-wrap" id="toggleWrap">
  <div id="slider" class="toggle-slider"></div>
  <div class="toggle-option">👤 Non</div>
  <div class="toggle-option">⭐ Member</div>
</div>

<div id="modeNote" class="note">
  Non-member: 15% platform fee applied
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
  <b>Totals</b>
  <button class="btn red" id="clearTotalsBtn">Clear</button>
</div>
<div id="totals"></div>

<div class="section">
  <b>History</b>
  <button class="btn red" id="clearHistoryBtn">Clear</button>
</div>
<div id="history"></div>

</div>

<script>
(function(){

let mode = "non";

const slider = document.getElementById("slider");
const modeNote = document.getElementById("modeNote");

const potEl = document.getElementById("pot");
const feeEl = document.getElementById("fee");
const winEl = document.getElementById("win");
const nameEl = document.getElementById("name");
const startEl = document.getElementById("start");
const endEl = document.getElementById("end");

const calcBtn = document.getElementById("calcBtn");
const totalsDiv = document.getElementById("totals");
const historyDiv = document.getElementById("history");

let totals = JSON.parse(localStorage.getItem("totals") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

/* Toggle */
document.getElementById("toggleWrap").onclick = function(){
  mode = (mode === "non") ? "mem" : "non";
  slider.style.left = (mode === "mem") ? "50%" : "0%";
  modeNote.innerText = (mode === "mem")
    ? "Member: full payout"
    : "Non-member: 15% platform fee applied";
};

/* Save */
function save(){
  localStorage.setItem("totals", JSON.stringify(totals));
  localStorage.setItem("history", JSON.stringify(history));
}

/* Date format */
function formatDate(d){
  if(!d) return "";
  let date = new Date(d);
  return (date.getMonth()+1)+"-"+date.getDate()+"-"+date.getFullYear();
}

/* Label */
function label(e){
  if(e.name && e.name.trim() !== ""){
    return e.icon + " " + e.name;
  }
  return (e.mode === "mem") ? "⭐ Member Game" : "👤 Non-Member Game";
}

/* Calculate */
calcBtn.onclick = function(){

  calcBtn.classList.add("calc-active");
  calcBtn.innerText = "Calculating...";

  setTimeout(function(){

    let p = parseFloat(potEl.value);
    let f = parseFloat(feeEl.value);
    let w = parseFloat(winEl.value);

    if(isNaN(p) || isNaN(f) || isNaN(w)){
      alert("Enter required values");
      resetBtn();
      return;
    }

    let payout = (mode === "mem") ? (p/w) : (p/w)*0.85;
    let profit = payout - f;
    let roi = (profit/f)*100;

    let entry = {
      name: nameEl.value,
      icon: (mode === "mem") ? "⭐" : "👤",
      mode: mode,
      start: formatDate(startEl.value),
      end: formatDate(endEl.value),
      payout: payout,
      profit: profit,
      roi: roi
    };

    totals.unshift(entry);
    history.unshift(entry);

    if(totals.length > 5) totals.pop();
    if(history.length > 200) history.pop();

    save();
    render();
    resetBtn();

  }, 300);
};

/* Reset button */
function resetBtn(){
  setTimeout(function(){
    calcBtn.classList.remove("calc-active");
    calcBtn.innerText = "Calculate";
  }, 400);
}

/* Render */
function render(){

  totalsDiv.innerHTML = totals.length
    ? totals.map(card).join("")
    : "<div class='empty'>Totals empty</div>";

  historyDiv.innerHTML = history.length
    ? history.map(card).join("")
    : "<div class='empty'>History empty</div>";
}

/* Card */
function card(e){
  return "<div class='card'>" +
    "<b>"+label(e)+"</b><br>" +
    e.start + (e.end ? " → "+e.end : "") + "<br><br>" +
    "Payout: $"+e.payout.toFixed(2)+"<br>" +
    "<span class='"+(e.profit>=0?"profit":"loss")+"'>Profit: $"+e.profit.toFixed(2)+"</span><br>" +
    "<span class='roi'>ROI: "+e.roi.toFixed(1)+"%</span>" +
  "</div>";
}

/* Clear buttons */
document.getElementById("clearInputsBtn").onclick = function(){
  nameEl.value="";
  startEl.value="";
  endEl.value="";
  potEl.value="";
  feeEl.value="";
  winEl.value="";
};

document.getElementById("clearTotalsBtn").onclick = function(){
  totals = [];
  save();
  render();
};

document.getElementById("clearHistoryBtn").onclick = function(){
  history = [];
  save();
  render();
};

/* Initial render */
render();

})();
</script>

</body>
</html>
