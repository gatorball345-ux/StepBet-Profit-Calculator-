<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {margin:0;font-family:Arial;background:#020c1b;color:white;}
.container {max-width:420px;margin:auto;padding:15px;}

.header {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.title {font-size:22px;color:#ff9d3c;}

.input {
width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;
background:#0c1f3a;color:white;text-align:center;font-size:16px;
}

/* TOGGLE */
.toggle-wrap {
margin-top:10px;background:#0f1e33;border-radius:30px;
position:relative;display:flex;overflow:hidden;
}
.toggle-slider {
position:absolute;top:0;left:0;width:50%;height:100%;
background:#1db954;border-radius:30px;transition:0.3s;
}
.toggle-option {flex:1;padding:10px;text-align:center;z-index:1;}

/* CARDS */
.card {
background:#0c1f3a;
padding:12px;
border-radius:10px;
margin-top:8px;
touch-action: pan-y;
}

/* BUTTONS */
.btn {padding:10px;border:none;border-radius:10px;color:white;margin-top:6px;}
.blue {background:#3c66c2;width:100%;}
.red {background:#a02222;}

.section {display:flex;justify-content:space-between;margin-top:15px;}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}
.empty {opacity:0.6;text-align:center;margin-top:6px;}

/* CALC */
.calc-active {
box-shadow:0 0 30px rgba(60,102,194,1);
transform:scale(0.95);
}

/* UNDO BAR */
.undo-bar {
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#ffaa00;
color:black;
padding:14px 22px;
border-radius:16px;
display:flex;
gap:12px;
align-items:center;
box-shadow:0 0 20px rgba(255,170,0,0.9);
font-weight:bold;
z-index:9999;
}
.undo-bar button {
background:black;color:white;border:none;
padding:6px 12px;border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">StepCat</div>
<button class="btn red" id="clearInputsBtn">Clear Entries</button>
</div>

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Prospects">

<div class="toggle-wrap" id="toggleWrap">
<div id="slider" class="toggle-slider"></div>
<div class="toggle-option">👤 Non</div>
<div class="toggle-option">⭐ Member</div>
</div>

<div id="modeNote" style="text-align:center;margin-top:6px;font-size:13px;">
Non-member: 15% platform fee applied
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
<b>Totals</b>
<button class="btn red" id="clearTotalsBtn">Clear Totals</button>
</div>
<div id="totals"></div>

<div class="section">
<b>History</b>
<button class="btn red" id="clearHistoryBtn">Clear History</button>
</div>
<div id="history"></div>

</div>

<script>
(function(){

let mode="non";

const slider=document.getElementById("slider");
const modeNote=document.getElementById("modeNote");

const potEl=document.getElementById("pot");
const feeEl=document.getElementById("fee");
const winEl=document.getElementById("win");

const totalsDiv=document.getElementById("totals");
const historyDiv=document.getElementById("history");

const calcBtn=document.getElementById("calcBtn");

let totals=JSON.parse(localStorage.getItem("totals")||"[]");
let history=JSON.parse(localStorage.getItem("history")||"[]");

let lastState=null;

/* TOGGLE */
document.getElementById("toggleWrap").onclick=function(){
mode=(mode==="non")?"mem":"non";
slider.style.left=(mode==="mem")?"50%":"0%";
modeNote.innerText=(mode==="mem")
?"Member: full payout"
:"Non-member: 15% platform fee applied";
};

/* SAVE */
function save(){
localStorage.setItem("totals",JSON.stringify(totals));
localStorage.setItem("history",JSON.stringify(history));
}

/* CALCULATE */
calcBtn.onclick=function(){

calcBtn.classList.add("calc-active");
calcBtn.innerText="Calculating...";

setTimeout(()=>{

let p=parseFloat(potEl.value);
let f=parseFloat(feeEl.value);
let w=parseFloat(winEl.value);

if(isNaN(p)||isNaN(f)||isNaN(w)){
alert("Enter values");
resetCalc();
return;
}

let payout=(mode==="mem")?(p/w):(p/w)*0.85;
let profit=payout-f;
let roi=(profit/f)*100;

let entry={payout,profit,roi};

totals.unshift(entry);
history.unshift(entry);

if(totals.length>5) totals.pop();
if(history.length>200) history.pop();

save();
render();
resetCalc();

},250);
};

function resetCalc(){
calcBtn.classList.remove("calc-active");
calcBtn.innerText="Calculate";
}

/* COPY (silent) */
function exportEntry(e){
let text=`Payout: $${e.payout.toFixed(2)}
Profit: $${e.profit.toFixed(2)}
ROI: ${e.roi.toFixed(1)}%`;

let input=document.createElement("input");
input.value=text;
document.body.appendChild(input);
input.select();
document.execCommand("copy");
document.body.removeChild(input);
}

/* UNDO */
function showUndo(label){
removeUndo();

let bar=document.createElement("div");
bar.className="undo-bar";
bar.innerHTML=`${label} <button onclick="undoAction()">UNDO</button>`;

document.body.appendChild(bar);
}

window.undoAction=function(){
if(!lastState) return;

totals = JSON.parse(JSON.stringify(lastState.totals));
history = JSON.parse(JSON.stringify(lastState.history));

potEl.value = lastState.inputs.pot;
feeEl.value = lastState.inputs.fee;
winEl.value = lastState.inputs.win;

save();
render();
removeUndo();
};

function removeUndo(){
let bar=document.querySelector(".undo-bar");
if(bar) bar.remove();
}

/* SNAPSHOT */
function snapshot(){
lastState = {
totals: JSON.parse(JSON.stringify(totals)),
history: JSON.parse(JSON.stringify(history)),
inputs:{
pot:potEl.value,
fee:feeEl.value,
win:winEl.value
}
};
}

/* SWIPE */
function addSwipe(el,index,type){

let startX=0;

el.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});

el.addEventListener("touchend",e=>{
let diff=e.changedTouches[0].clientX-startX;

/* COPY */
if(diff>80){
exportEntry(type==="totals"?totals[index]:history[index]);
return;
}

/* DELETE */
if(diff<-80){

snapshot();

if(type==="totals") totals.splice(index,1);
else history.splice(index,1);

save();
render();
showUndo("Deleted");
}
});
}

/* RENDER */
function render(){

totalsDiv.innerHTML=totals.length
?totals.map((e,i)=>card(e,"t",i)).join("")
:"<div class='empty'>Totals empty</div>";

historyDiv.innerHTML=history.length
?history.map((e,i)=>card(e,"h",i)).join("")
:"<div class='empty'>History empty</div>";

totals.forEach((_,i)=>addSwipe(document.getElementById("t"+i),i,"totals"));
history.forEach((_,i)=>addSwipe(document.getElementById("h"+i),i,"history"));
}

function card(e,prefix,i){
return `<div class="card" id="${prefix}${i}">
Payout: $${e.payout.toFixed(2)}<br>
<span class="${e.profit>=0?'profit':'loss'}">Profit: $${e.profit.toFixed(2)}</span><br>
<span class="roi">ROI: ${e.roi.toFixed(1)}%</span>
</div>`;
}

/* CLEAR */
document.getElementById("clearTotalsBtn").onclick=()=>{
if(!totals.length) return;
snapshot();
totals=[];
save();render();
showUndo("Totals Cleared");
};

document.getElementById("clearHistoryBtn").onclick=()=>{
if(!history.length) return;
snapshot();
history=[];
save();render();
showUndo("History Cleared");
};

document.getElementById("clearInputsBtn").onclick=()=>{
snapshot();
potEl.value="";feeEl.value="";winEl.value="";
showUndo("Entries Cleared");
};

render();

})();
</script>

</body>
</html>
