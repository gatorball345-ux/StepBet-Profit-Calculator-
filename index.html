<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
}

.container {
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
}

.title {
    text-align: center;
    font-size: 28px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
    margin-bottom: 20px;
}

.input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
}

.clear-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
}

.btn {
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: white;
    cursor: pointer;
}

.red { background: #a02222; }
.blue {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    background: #3c66c2;
}
.orange { background: #ff9d3c; }

.toggle {
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #0f1e33;
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #1db954 !important;
}

.notice {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: #aaa;
}

.section-title {
    font-size: 20px;
    margin: 20px 0 10px;
    display: flex;
    justify-content: space-between;
}

.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 14px;
}

.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.history {
    max-height: 300px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="container">

<div class="title">StepCat Calculator</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<div class="clear-row">
    <button class="btn red" onclick="clearInputs()">Clear Entries</button>
</div>

<div class="toggle">
    <button id="nonBtn" class="active">Non-Member</button>
    <button id="memBtn">Member</button>
</div>

<div id="notice" class="notice">Non-member: 15% taken.</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<div class="section-title">
    Totals
    <div>
        <button class="btn orange" onclick="loadLast()">Load</button>
        <button class="btn red" onclick="clearTotals()">Clear</button>
    </div>
</div>

<div id="totals"></div>

<div class="section-title">
    Recent History
    <div>
        <button class="btn orange" onclick="loadHistory()">Load</button>
        <button class="btn red" onclick="clearHistory()">Clear</button>
    </div>
</div>

<div id="history" class="history"></div>

</div>

<script>

let mode = "non";

const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");
const totals = document.getElementById("totals");
const historyDiv = document.getElementById("history");
const notice = document.getElementById("notice");

/* SAFE HISTORY ACCESS */
function getHistory(){
    try{
        let data = JSON.parse(localStorage.getItem("stepcat_history"));
        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

function setHistory(data){
    localStorage.setItem("stepcat_history", JSON.stringify(data));
}

/* TOGGLE */
nonBtn.onclick = () => {
    mode = "non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
    notice.innerText = "Non-member: 15% taken.";
};

memBtn.onclick = () => {
    mode = "mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
    notice.innerText = "Member: No fee taken.";
};

/* CALCULATE */
function calculate(){
    let potVal = parseFloat(pot.value);
    let feeVal = parseFloat(fee.value);
    let winVal = parseFloat(winners.value);

    if(isNaN(potVal) || isNaN(feeVal) || isNaN(winVal)) return;

    let member = potVal / winVal;
    let non = member * 0.85;
    let payout = mode === "mem" ? member : non;

    let profit = payout - feeVal;
    let roi = (profit / feeVal) * 100;

    let entry = {
        label: mode === "mem" ? "Member Game" : "Non-Member Game",
        payout, profit, roi
    };

    renderTotals(entry);

    let history = getHistory();
    history.unshift(entry);
    setHistory(history);

    renderHistory();
}

/* RENDER */
function renderTotals(d){
    totals.innerHTML = buildCard(d);
}

function renderHistory(){
    let history = getHistory();
    historyDiv.innerHTML = "";
    history.forEach(e => historyDiv.innerHTML += buildCard(e));
}

function buildCard(d){
return `
<div class="card">
<b>${d.label}</b><br><br>
Payout: $${d.payout.toFixed(2)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: $${d.profit.toFixed(2)}
</span><br>
<span class="roi">
ROI: ${d.roi.toFixed(1)}%
</span>
</div>`;
}

/* LOAD */
function loadLast(){
    let history = getHistory();
    if(history.length) renderTotals(history[0]);
}

function loadHistory(){
    renderHistory();
}

/* CLEAR */
function clearInputs(){
    pot.value = "";
    fee.value = "";
    winners.value = "";
}

function clearTotals(){
    totals.innerHTML = "";
}

function clearHistory(){
    setHistory([]); // 🔥 SAFE RESET FIX
    historyDiv.innerHTML = "";
}

/* INIT */
renderHistory();

</script>

</body>
</html>
