<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <meta name="theme-color" content="#111827">
</head>

<body>
  <div class="app">

    <h1>StepBet Profit</h1>

    <div class="field">
      <label>Entry Fee</label>
      <input id="entry" type="number" placeholder="40">
    </div>

    <div class="field">
      <label>Total Pot</label>
      <input id="pot" type="number" placeholder="10000">
    </div>

    <div class="field">
      <label>Eligible Winners</label>
      <input id="winners" type="number" placeholder="250">
    </div>

    <div class="toggle-field">
      <span>Non-member</span>
      <label class="switch">
        <input type="checkbox" id="memberToggle">
        <span class="slider"></span>
      </label>
      <span>Member</span>
    </div>

    <div id="modeLabel">Non-member (15% fee)</div>

    <div id="result"></div>

    <div id="avgROI"></div>

    <!-- CONTROLS -->
    <div id="historyControls">
      <button id="clearHistoryBtn">Clear</button>
      <button id="exportJSONBtn">Export JSON</button>
      <button id="exportCSVBtn">Export CSV</button>
      <button id="importBtn">Import</button>
      <input type="file" id="importFile" hidden>
    </div>

    <!-- HISTORY -->
    <div id="historyContainer">
      <h3>Recent</h3>
      <div id="history"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
