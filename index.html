<script>

/* ===== SAFE DOM BINDING ===== */
const potEl = document.getElementById("pot");
const feeEl = document.getElementById("fee");
const winEl = document.getElementById("win");

const nameEl = document.getElementById("name");
const startEl = document.getElementById("start");
const endEl = document.getElementById("end");

const totalsDiv = document.getElementById("totals");
const historyDiv = document.getElementById("history");

const nonBtn = document.getElementById("nonBtn");
const memBtn = document.getElementById("memBtn");
const modeNote = document.getElementById("modeNote");

/* ===== STATE ===== */
let mode = "non";

let totals = JSON.parse(localStorage.getItem("totals") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

/* ===== SAVE ===== */
function save(){
localStorage.setItem("totals", JSON.stringify(totals));
localStorage.setItem("history", JSON.stringify(history));
}

/* ===== TOGGLE ===== */
nonBtn.onclick = () => {
mode = "non";
nonBtn.classList.add("active");
memBtn.classList.remove("active");
modeNote.innerText = "Non-member: 15% platform fee applied";
};

memBtn.onclick = () => {
mode = "mem";
memBtn.classList.add("active");
nonBtn.classList.remove("active");
modeNote.innerText = "Member: full payout (no fee)";
};

/* ===== CALCULATE (FIXED) ===== */
function calculate(){

let p = parseFloat(potEl.value);
let f = parseFloat(feeEl.value);
let w = parseFloat(winEl.value);

if(!p || !f || !w){
alert("Enter valid numbers for Pot, Fee, and Winners");
return;
}

/* FORMULA */
let member = p / w;
let non = member * 0.85;

let payout = (mode === "mem") ? member : non;
let profit = payout - f;
let roi = (profit / f) * 100;

/* ENTRY */
let entry = {
name: nameEl.value || "Game",
start: startEl.value || "",
end: endEl.value || "",
mode,
payout,
profit,
roi,
created: Date.now()
};

/* STORE */
totals.unshift(entry);
history.unshift(entry);

if(totals.length > 5){
history.unshift(totals.pop());
}

save();
renderAll();
}

/* ===== STATUS ===== */
function getStatus(e){
if(e.profit > 0) return "Won";
if(e.profit === 0) return "Draw";
return "Loss";
}

/* ===== CARD ===== */
function createCard(e){
let label = e.mode === "mem" ? "Member Game" : "Non-Member Game";

return `
<div class="card">
<b>${e.name}</b><br>
${label}<br>
${e.start || ""} ${e.end ? "→ " + e.end : ""}<br><br>
Payout: $${e.payout.toFixed(2)}<br>
Profit: $${e.profit.toFixed(2)}<br>
ROI: ${e.roi.toFixed(1)}%
</div>`;
}

/* ===== RENDER ===== */
function renderTotals(){
if(!totals.length){
totalsDiv.innerHTML = "<div class='empty'>Totals empty</div>";
return;
}
totalsDiv.innerHTML = totals.map(createCard).join("");
}

function renderHistory(){
if(!history.length){
historyDiv.innerHTML = "<div class='empty'>History empty</div>";
return;
}
historyDiv.innerHTML = history.map(createCard).join("");
}

function renderAll(){
renderTotals();
renderHistory();
}

/* ===== CLEAR ===== */
function clearInputs(){
nameEl.value="";
startEl.value="";
endEl.value="";
potEl.value="";
feeEl.value="";
winEl.value="";
}

/* INIT */
renderAll();

</script>
