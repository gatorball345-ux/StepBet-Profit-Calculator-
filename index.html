<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin:0;
  padding:0;
  height:100%;
  overflow-y:auto;
  background:#020617;
  color:white;
  font-family:-apple-system, sans-serif;
}

.app {
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:420px;
  margin:auto;
  overflow:hidden;
}

/* TITLE */
.title {
  font-size:22px;
  font-weight:bold;
  color:#fb923c;
  text-shadow:
    0 0 6px rgba(251,146,60,0.6),
    0 0 14px rgba(251,146,60,0.4),
    0 0 24px rgba(251,146,60,0.25);
}

/* TOP */
.top {
  padding:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* BUTTONS */
button {
  border:none;
  color:white;
  cursor:pointer;
  transition:.2s;
}

.btn-small {
  padding:6px 12px;
  font-size:12px;
  border-radius:12px;
  background:#7f1d1d;

  box-shadow:
    0 6px 14px rgba(0,0,0,0.7),
    0 0 12px rgba(127,29,29,0.7);
}

/* CALCULATE */
.calc {
  margin-top:12px;
  width:100%;
  padding:14px;
  border-radius:16px;
  background:#2563eb;
  font-weight:bold;
  box-shadow:
    0 6px 16px rgba(0,0,0,0.7),
    0 0 20px rgba(37,99,235,0.8);
}

/* INPUTS */
input {
  width:100%;
  margin-top:8px;
  padding:14px;
  background:#0f172a;
  border:none;
  border-radius:14px;
  color:white;
  text-align:center;
}

/* HISTORY */
.history-container {
  flex:1;
  overflow-y:auto;
  padding-bottom:100px;
}

/* HEADER */
.history-header {
  position:sticky;
  top:0;
  z-index:10;
  background:#020617;
  padding:12px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #111827;
}

/* CARD WRAPPER (for swipe) */
.history-wrapper {
  position:relative;
  overflow:hidden;
  margin:12px;
}

/* DELETE BACKGROUND */
.delete-bg {
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:100%;
  background:#b91c1c;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding-right:20px;
  font-weight:bold;
}

/* CARD */
.history-item {
  position:relative;
  background:#0f172a;
  border-radius:18px;
  padding:16px;

  transform:translateX(0);
  transition:transform .2s ease;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.7);
}

/* ENTRY ANIMATION */
.history-item.new {
  animation:slideIn .3s ease;
}

@keyframes slideIn {
  from {
    transform:translateY(20px);
    opacity:0;
  }
  to {
    transform:translateY(0);
    opacity:1;
  }
}

/* METRICS */
.metrics {
  display:flex;
  justify-content:space-between;
}

.metric { text-align:center; flex:1; }

.green { color:#22c55e; }
.yellow { color:#facc15; }

</style>
</head>

<body>

<div class="app">

<div class="top">
<h2 class="title">StepCat Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Winners">

<button class="calc" onclick="calculate()">Calculate</button>
</div>

<div class="history-container">
<div class="history-header">
  <span>Recent History</span>
  <button class="btn-small" onclick="clearHistory()">Clear</button>
</div>

<div id="history"></div>
</div>

</div>

<script>

let historyData = JSON.parse(localStorage.getItem("stepbet_history") || "[]");

const historyEl = document.getElementById("history");

function calculate(){
  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  let payout = p / w;
  let profit = payout - f;
  let roi = (profit / f) * 100;

  historyData.unshift({payout, profit, roi});
  localStorage.setItem("stepbet_history", JSON.stringify(historyData));

  renderHistory(true);
}

function renderHistory(animate=false){
  historyEl.innerHTML = "";

  historyData.forEach((h, index)=>{

    let wrapper = document.createElement("div");
    wrapper.className = "history-wrapper";

    let bg = document.createElement("div");
    bg.className = "delete-bg";
    bg.innerText = "Delete";

    let card = document.createElement("div");
    card.className = "history-item";
    if(animate && index === 0) card.classList.add("new");

    card.innerHTML = `
      <div class="metrics">
        <div>Payout<br>$${h.payout.toFixed(2)}</div>
        <div class="green">Profit<br>$${h.profit.toFixed(2)}</div>
        <div class="yellow">ROI<br>${h.roi.toFixed(1)}%</div>
      </div>
    `;

    wrapper.appendChild(bg);
    wrapper.appendChild(card);
    historyEl.appendChild(wrapper);

    addSwipe(wrapper, card, index);
  });
}

function addSwipe(wrapper, card, index){
  let startX = 0;
  let currentX = 0;
  let dragging = false;

  card.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
    dragging = true;
  });

  card.addEventListener("touchmove", e=>{
    if(!dragging) return;
    currentX = e.touches[0].clientX - startX;

    if(currentX < 0){
      card.style.transform = `translateX(${currentX}px)`;
    }
  });

  card.addEventListener("touchend", ()=>{
    dragging = false;

    if(currentX < -80){
      // DELETE
      historyData.splice(index,1);
      localStorage.setItem("stepbet_history", JSON.stringify(historyData));
      renderHistory();
    } else {
      card.style.transform = "translateX(0)";
    }
  });
}

function clearHistory(){
  historyData = [];
  localStorage.removeItem("stepbet_history");
  renderHistory();
}

renderHistory();

</script>

</body>
</html>
