<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="app">

    <h1>StepBet Profit</h1>

    <input id="entry" placeholder="Entry Fee">
    <input id="pot" placeholder="Total Pot">
    <input id="winners" placeholder="Eligible Winners">
    <input id="bankroll" placeholder="Bankroll (optional)">

    <div class="toggle-field">
      <span>Non-member</span>
      <label class="switch">
        <input type="checkbox" id="memberToggle">
        <span class="slider"></span>
      </label>
      <span>Member</span>
    </div>

    <div id="result"></div>
    <div id="prediction"></div>
    <div id="gameTier"></div>

    <div id="history"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
