<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

/* App Container */
.app {
  width: 100%;
  max-width: 420px;
  padding: 20px 18px;
  margin: 40px auto 0 auto;
  box-sizing: border-box;
  transform: translateX(-2px);
}

h2 {
  text-align: center;
}

/* Toggle */
.toggle {
  display: grid;
  grid-template-columns: 1fr 60px 1fr;
  align-items: center;
  margin: 20px 0;
}

.mode-label,
.mode-right {
  font-size: 14px;
  opacity: 0.5;
}

.active {
  opacity: 1;
  font-weight: bold;
  color: #22c55e;
}

/* Switch */
.switch {
  position: relative;
  width: 52px;
  height: 28px;
  justify-self: center;
}

.switch input { opacity: 0; }

.slider {
  position: absolute;
  inset: 0;
  background: #374151;
  border-radius: 34px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider { background: #22c55e; }
input:checked + .slider:before { transform: translateX(24px); }

/* Inputs */
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  background: #111827;
  border: none;
  color: white;
  border-radius: 12px;
  text-align: center;
  box-sizing: border-box;
  transition: 0.2s;
}

input:focus {
  outline: none;
  box-shadow: 0 0 0 2px #22c55e55;
}

/* Buttons */
button {
  width: 100%;
  padding: 16px;
  background: #22c55e;
  border: none;
  border-radius: 14px;
  margin-top: 14px;
  color: white;
  font-weight: bold;
  transition: 0.15s;
}

button:active { transform: scale(0.97); }

.clear-btn { background: #ef4444; }

/* Result */
#result {
  margin-top: 20px;
  padding: 18px;
  background: #111827;
  border-radius: 14px;
  text-align: center;
}

#result strong {
  color: #22c55e;
}

/* History */
.history-item {
  background: #111827;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.history-mode {
  color: #22c55e;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<div class="toggle">
  <div id="nonMemberLabel" class="mode-label active">Non-Member (-15%)</div>

  <label class="switch">
    <input type="checkbox" id="modeToggle">
    <span class="slider"></span>
  </label>

  <div id="memberLabel" class="mode-right">Member</div>
</div>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button id="calcBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];

/* CALCULATE */
document.getElementById("calcBtn").addEventListener("click", function() {

  const pot = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);
  const isMember = document.getElementById("modeToggle").checked;

  if (!pot || !fee || !winners) return;

  const adjustedPot = isMember ? pot : pot * 0.85;
  const payout = adjustedPot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;
  const breakEvenPlayers = Math.round(adjustedPot / fee);

  document.getElementById("result").innerHTML = `
    <strong>Payout Per Player:</strong><br>
    $${payout.toFixed(2)}<br><br>

    <strong>Profit / Loss:</strong><br>
    ${profit >= 0 ? "+" : ""}$${profit.toFixed(2)}<br>

    <strong>ROI:</strong><br>
    ${roi.toFixed(1)}%<br><br>

    <strong>Break-Even Players:</strong><br>
    ${breakEvenPlayers}
  `;

  history.unshift({
    payout: payout,
    profit: profit,
    roi: roi,
    mode: isMember ? "Member" : "Non-Member"
  });

  localStorage.setItem("stepbetHistory", JSON.stringify(history));
  renderHistory();
});

/* HISTORY */
function renderHistory() {
  const container = document.getElementById("history");
  container.innerHTML = "";

  history.forEach(function(item) {
    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <div class="history-mode">${item.mode}</div>
      Payout: $${item.payout.toFixed(2)} |
      ${item.profit >= 0 ? "+" : ""}$${item.profit.toFixed(2)} |
      ${item.roi.toFixed(1)}%
    `;

    container.appendChild(div);
  });
}

/* CLEAR */
document.getElementById("clearBtn").addEventListener("click", function() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
});

/* TOGGLE */
document.getElementById("modeToggle").addEventListener("change", function() {
  document.getElementById("nonMemberLabel").classList.toggle("active", !this.checked);
  document.getElementById("memberLabel").classList.toggle("active", this.checked);
});

renderHistory();
</script>

</body>
</html>
