<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#020c1b;
    color:white;
}

.container {
    max-width:400px;
    margin:auto;
    padding:15px;
}

.input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    background:#0c1f3a;
    color:white;
    text-align:center;
}

.btn {
    padding:8px 10px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:12px;
}

.blue {background:#3c66c2;width:100%;padding:14px;}
.red {background:#a02222;}
.gray {background:#666;}

.toggle {
    display:flex;
    margin-top:8px;
}

.toggle button {
    flex:1;
    padding:10px;
    background:#0f1e33;
    border:none;
    color:white;
}

.toggle button.active {
    background:#1db954 !important;
}

.card {
    background:#0c1f3a;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    transition: transform 0.25s ease, opacity 0.25s ease;
}

.card.removing {
    transform: translateX(-120%);
    opacity: 0;
}

.empty {
    text-align:center;
    opacity:0.6;
}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}

.section {
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h3>StepCat Calculator</h3>

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Winners">

<div class="toggle">
<button id="nonBtn" class="active">Non-Member</button>
<button id="memBtn">Member</button>
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<!-- TOTALS -->
<div class="section">
<b>Totals</b>
<div>
<button class="btn gray" id="undoTotal">Undo</button>
<button class="btn red" id="clearTotal">Clear</button>
</div>
</div>

<div id="totals"></div>

<!-- HISTORY -->
<div class="section">
<b>History</b>
<div>
<button class="btn gray" id="undoHistory">Undo</button>
<button class="btn red" id="clearHistoryBtn">Clear</button>
</div>
</div>

<div id="history"></div>

</div>

<script>
window.onload = function(){

let mode="non";
let last=null;
let history=[];

let historyUndoStack=[];
let totalsUndoStack=[];

const pot=document.getElementById("pot");
const fee=document.getElementById("fee");
const win=document.getElementById("win");

const totals=document.getElementById("totals");
const historyDiv=document.getElementById("history");

const nonBtn=document.getElementById("nonBtn");
const memBtn=document.getElementById("memBtn");

/* TOGGLE */
nonBtn.onclick=()=>{
    mode="non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
};

memBtn.onclick=()=>{
    mode="mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
};

/* CALCULATE */
document.getElementById("calcBtn").onclick=function(){

    let p=parseFloat(pot.value);
    let f=parseFloat(fee.value);
    let w=parseFloat(win.value);

    if(isNaN(p)||isNaN(f)||isNaN(w)) return;

    let member=p/w;
    let non=member*0.85;

    let payout=(mode==="mem")?member:non;
    let profit=payout-f;
    let roi=(profit/f)*100;

    let entry={
        label:(mode==="mem")?"Member Game":"Non-Member Game",
        payout,profit,roi
    };

    last=entry;

    history.unshift(entry);

    renderTotals(entry);
    renderHistory();
};

/* TOTALS RENDER */
function renderTotals(d){
    totals.innerHTML="";

    if(!d){
        totals.innerHTML="<div class='card empty'>Totals empty</div>";
        return;
    }

    let div=document.createElement("div");
    div.innerHTML=card(d);
    let el=div.firstChild;

    addSwipeTotal(el,d);

    totals.appendChild(el);
}

/* SWIPE TOTAL */
function addSwipeTotal(el,data){
    let startX=0;

    el.addEventListener("touchstart",e=>{
        startX=e.touches[0].clientX;
    });

    el.addEventListener("touchend",e=>{
        let move=e.changedTouches[0].clientX-startX;

        if(move<-80){
            totalsUndoStack.push(data);
            el.classList.add("removing");

            setTimeout(()=>{
                renderTotals(null);
            },250);
        }
    });
}

/* HISTORY RENDER */
function renderHistory(){
    historyDiv.innerHTML="";

    if(history.length===0){
        historyDiv.innerHTML="<div class='card empty'>History empty</div>";
        return;
    }

    history.forEach((e,index)=>{
        let div=document.createElement("div");
        div.innerHTML=card(e);
        let el=div.firstChild;

        addSwipeHistory(el,index,e);

        historyDiv.appendChild(el);
    });
}

/* SWIPE HISTORY */
function addSwipeHistory(el,index,data){
    let startX=0;

    el.addEventListener("touchstart",e=>{
        startX=e.touches[0].clientX;
    });

    el.addEventListener("touchend",e=>{
        let move=e.changedTouches[0].clientX-startX;

        if(move<-80){
            historyUndoStack.push(data);
            history.splice(index,1);

            el.classList.add("removing");

            setTimeout(()=>{
                renderHistory();
            },250);
        }
    });
}

/* CARD TEMPLATE */
function card(d){
return `<div class="card">
<b>${d.label}</b><br>
Payout: $${d.payout.toFixed(2)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: $${d.profit.toFixed(2)}
</span><br>
<span class="roi">
ROI: ${d.roi.toFixed(1)}%
</span>
</div>`;
}

/* UNDO TOTAL */
document.getElementById("undoTotal").onclick=function(){
    if(totalsUndoStack.length>0){
        let item=totalsUndoStack.pop();
        renderTotals(item);
    } else {
        alert("No more totals to undo.");
    }
};

/* UNDO HISTORY */
document.getElementById("undoHistory").onclick=function(){
    if(historyUndoStack.length>0){
        let item=historyUndoStack.pop();
        history.unshift(item);
        renderHistory();
    } else {
        alert("No more history to undo.");
    }
};

/* CLEAR TOTALS */
document.getElementById("clearTotal").onclick=function(){
    if(confirm("This will permanently delete totals. Continue?")){
        totalsUndoStack=[];
        renderTotals(null);
    }
};

/* CLEAR HISTORY */
document.getElementById("clearHistoryBtn").onclick=function(){
    if(confirm("This will permanently delete all history. Continue?")){
        history=[];
        historyUndoStack=[];
        renderHistory();
    }
};

};
</script>

</body>
</html>
