<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>StepBet Profit Calculator</h1>

    <div class="field">
      <label>Total players</label>
      <input id="players" type="number" placeholder="e.g. 1000" />
    </div>

    <div class="field">
      <label>Total winners</label>
      <input id="winners" type="number" placeholder="e.g. 700" />
    </div>

    <div class="field">
      <label>Entry fee ($)</label>
      <input id="entry" type="number" placeholder="e.g. 40" />
    </div>

    <!-- TOGGLE -->
    <div class="toggle-field">
      <span class="toggle-label left">Non-member</span>

      <label class="switch">
        <input type="checkbox" id="memberToggle">
        <span class="slider"></span>
      </label>

      <span class="toggle-label right">Member</span>
    </div>

    <p id="modeLabel">Mode: Non-member (15% fee)</p>

    <button id="calcBtn">Calculate profit</button>

    <p id="result">Enter values and tap "Calculate".</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
