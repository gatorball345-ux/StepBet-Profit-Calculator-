<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
}

.clear-btn {
  background: #ef4444;
}

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

/* 🔥 CLEAN HISTORY UI */
.history-item {
  background: #111827;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
}

.history-mode {
  font-weight: bold;
  margin-bottom: 4px;
}

.history-profit.positive {
  color: #22c55e;
}

.history-profit.negative {
  color: #f97316;
}

/* Toggle layout */
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.toggle span {
  font-size: 14px;
}

/* Mode notice */
#modeNotice {
  text-align: center;
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 16px;
}

/* Toggle switch */
.switch {
  position: relative;
  width: 50px;
  height: 26px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  cursor: pointer;
  background: #374151;
  border-radius: 34px;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  transition: 0.3s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider:before {
  transform: translateX(24px);
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<!-- TOGGLE -->
<div class="toggle">
  <span>Non-Member</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle" onchange="updateMode()">
    <span class="slider"></span>
  </label>

  <span>Member</span>
</div>

<!-- ✅ MODE NOTICE -->
<div id="modeNotice"></div>

<label>Total Pot</label>
<input id="pot" type="number">

<label>Entry Fee</label>
<input id="entry" type="number">

<label>Eligible Winners</label>
<input id="players" type="number">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory") || "[]");

function getMode() {
  return document.getElementById("memberToggle").checked
    ? "Member"
    : "Non-Member";
}

function updateMode() {
  const notice = document.getElementById("modeNotice");

  if (getMode() === "Non-Member") {
    notice.innerHTML = "Non-Member game (15% fee applied)";
  } else {
    notice.innerHTML = "Member game";
  }

  renderHistory(getMode());
}

function calculate() {
  const entry = parseFloat(document.getElementById("entry").value);
  const pot = parseFloat(document.getElementById("pot").value);
  const players = parseFloat(document.getElementById("players").value);
  const result = document.getElementById("result");

  if (!entry || !pot || !players) {
    result.innerHTML = "Enter all fields";
    return;
  }

  const mode = getMode();

  let adjusted = mode === "Member" ? pot : pot * 0.85;

  const breakEven = Math.round(adjusted / entry);

  let payout = adjusted / players;
  if (players === breakEven) payout = entry;

  payout = Number(payout.toFixed(2));
  const profit = Number((payout - entry).toFixed(2));
  const roi = Number(((profit / entry) * 100).toFixed(1));

  result.innerHTML =
    "<div><strong>Payout:</strong> $" + payout + "</div>" +
    "<div>" +
    "Break-even: " + breakEven + "<br>" +
    players + " players: " +
    (profit >= 0 ? "+" : "") +
    "$" + profit + " (" + roi + "% ROI)" +
    "</div>";

  const data = { payout, profit, roi, mode };

  history.unshift(data);
  if (history.length > 10) history.pop();

  localStorage.setItem("stepbetHistory", JSON.stringify(history));

  renderHistory(mode);
}

function renderHistory(currentMode) {
  const historyDiv = document.getElementById("history");
  historyDiv.innerHTML = "";

  const filtered = history.filter(h => h.mode === currentMode);

  filtered.forEach(h => {
    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <div class="history-mode">${h.mode}</div>
      <div>Payout: $${h.payout}</div>
      <div class="history-profit ${h.profit >= 0 ? "positive" : "negative"}">
        Profit: ${h.profit >= 0 ? "+" : ""}$${h.profit}
      </div>
      <div>ROI: ${h.roi}%</div>
    `;

    historyDiv.appendChild(div);
  });
}

function clearHistory() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory(getMode());
}

// INIT
updateMode();
</script>

</body>
</html>
