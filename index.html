<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:-apple-system;
}

.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}

/* TITLE */
.title{
  text-align:center;
  color:#fb923c;
  font-size:24px;
  text-shadow:
    0 0 10px rgba(251,146,60,0.7),
    0 0 25px rgba(251,146,60,0.4);
}

/* INPUT */
input{
  width:100%;
  margin-top:12px;
  padding:16px;
  border-radius:16px;
  border:none;
  background:#0f172a;
  color:white;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}

/* BUTTONS */
button{
  width:100%;
  margin-top:12px;
  padding:16px;
  border:none;
  border-radius:18px;
  color:white;
  font-weight:bold;
  box-shadow:0 6px 20px rgba(0,0,0,0.7);
}

.calc{
  background:#2563eb;
  box-shadow:0 0 20px rgba(37,99,235,0.7);
}

.clear{
  background:#7f1d1d;
  box-shadow:0 0 15px rgba(127,29,29,0.8);
}

/* TOGGLE */
.toggle{
  display:flex;
  margin-top:12px;
  border-radius:18px;
  overflow:hidden;
  background:#111827;
}
.toggle div{
  flex:1;
  padding:12px;
  text-align:center;
}
.active{
  background:#16a34a;
  box-shadow:0 0 20px rgba(34,197,94,0.7);
}

/* CARD */
.card{
  margin-top:16px;
  padding:16px;
  background:#0f172a;
  border-radius:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
}

/* HISTORY */
.history-item{
  margin-top:14px;
  padding:16px;
  background:#0f172a;
  border-radius:18px;
  transform:translateX(0);
  transition:.2s;
}

/* SWIPE BG */
.wrapper{
  position:relative;
  overflow:hidden;
}
.delete-bg{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  background:#b91c1c;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding-right:20px;
}

/* COLORS */
.green{color:#22c55e;}
.yellow{color:#facc15;}
</style>
</head>

<body>

<div class="container">

<h2 class="title">StepCat Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Winners">

<button class="clear" onclick="clearEntries()">Clear Entries</button>

<div class="toggle">
  <div id="nonBtn" class="active">Non-Member</div>
  <div id="memBtn">Member</div>
</div>

<button class="calc" onclick="calculate()">Calculate</button>

<div class="card" id="result"></div>

<h3>Recent History</h3>
<button class="clear" onclick="clearHistory()">Clear History</button>

<div id="history"></div>

</div>

<script>
let isMember=false;
let historyData=JSON.parse(localStorage.getItem("hist")||"[]");

nonBtn.onclick=()=>setMode(false);
memBtn.onclick=()=>setMode(true);

function setMode(v){
  isMember=v;
  nonBtn.classList.toggle("active",!v);
  memBtn.classList.toggle("active",v);
}

function calculate(){
  let p=+pot.value,f=+fee.value,w=+winners.value;
  let payout=p/w;
  if(!isMember) payout*=0.85;
  let profit=payout-f;
  let roi=(profit/f)*100;

  result.innerHTML=`
  <div>Payout: $${payout.toFixed(2)}</div>
  <div class="green">Profit: $${profit.toFixed(2)}</div>
  <div class="yellow">ROI: ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({payout,profit,roi});
  localStorage.setItem("hist",JSON.stringify(historyData));

  render();
}

function render(){
  history.innerHTML="";
  historyData.forEach((h,i)=>{
    let w=document.createElement("div");
    w.className="wrapper";

    let bg=document.createElement("div");
    bg.className="delete-bg";
    bg.innerText="Delete";

    let d=document.createElement("div");
    d.className="history-item";
    d.innerHTML=`
      $${h.payout.toFixed(2)} |
      <span class="green">$${h.profit.toFixed(2)}</span> |
      <span class="yellow">${h.roi.toFixed(1)}%</span>
    `;

    addSwipe(d,i);

    w.appendChild(bg);
    w.appendChild(d);
    history.appendChild(w);
  });
}

function addSwipe(el,i){
  let start=0,cur=0;

  el.addEventListener("touchstart",e=>{
    start=e.touches[0].clientX;
  });

  el.addEventListener("touchmove",e=>{
    cur=e.touches[0].clientX-start;
    if(cur<0) el.style.transform=`translateX(${cur}px)`;
  });

  el.addEventListener("touchend",()=>{
    if(cur<-80){
      historyData.splice(i,1);
      localStorage.setItem("hist",JSON.stringify(historyData));
      render();
    }else{
      el.style.transform="translateX(0)";
    }
  });
}

function clearEntries(){pot.value=fee.value=winners.value="";}
function clearHistory(){historyData=[];localStorage.removeItem("hist");render();}

render();
</script>

</body>
</html>
