<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px;
}

/* INPUTS */
input {
  width:100%;
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:12px;
  color:white;
  text-align:center;
}

/* 🔥 STRONGER TOGGLE */
.toggle {
  margin-top:16px;
  background:#111827;
  border-radius:12px;
  position:relative;
  display:flex;
  height:44px;
  cursor:pointer;
  overflow:hidden;
}

.toggle-slider {
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:50%;
  background:#16a34a; /* darker green */
  transition:0.25s;
  z-index:1;
}

.toggle-label {
  flex:1;
  text-align:center;
  line-height:44px;
  z-index:2;
  font-weight:600;
  color:#6b7280;
  transition:0.2s;
}

.toggle-label.active {
  color:white;
}

/* BUTTONS */
.button-row {
  display:flex;
  gap:10px;
  margin-top:16px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.clear-btn { background:#374151; }
.history-btn { background:#7c2d12; }
.calc-btn { background:#2563eb; }

/* RESULT */
#result {
  margin-top:20px;
  padding:16px;
  background:#111827;
  border-radius:12px;
}

/* HISTORY */
.history-item {
  margin-top:10px;
  padding:12px;
  background:#111827;
  border-radius:10px;
}

/* TEXT */
.fee-note {
  margin-top:10px;
  font-size:13px;
  color:#9ca3af;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<h2 style="text-align:center;">StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<!-- TOGGLE -->
<div class="toggle" id="toggle">
  <div class="toggle-slider" id="slider"></div>
  <div id="nonLabel" class="toggle-label active">Non-Member</div>
  <div id="memLabel" class="toggle-label">Member</div>
</div>

<div class="fee-note" id="feeNote"></div>

<!-- BUTTONS -->
<div class="button-row">
  <button class="clear-btn" id="clearBtn">Clear Inputs</button>
  <button class="history-btn" id="clearHistoryBtn">Clear History</button>
  <button class="calc-btn" id="calcBtn">Calculate</button>
</div>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

</div>

<script>
window.onload = function() {

let isMember = false;
let historyData = [];

/* ELEMENTS */
const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");

const result = document.getElementById("result");
const history = document.getElementById("history");

const toggle = document.getElementById("toggle");
const slider = document.getElementById("slider");
const nonLabel = document.getElementById("nonLabel");
const memLabel = document.getElementById("memLabel");

const feeNote = document.getElementById("feeNote");

const clearBtn = document.getElementById("clearBtn");
const clearHistoryBtn = document.getElementById("clearHistoryBtn");
const calcBtn = document.getElementById("calcBtn");

/* TOGGLE */
toggle.onclick = () => {
  isMember = !isMember;

  slider.style.left = isMember ? "50%" : "0%";

  nonLabel.classList.toggle("active", !isMember);
  memLabel.classList.toggle("active", isMember);

  updateText();
};

/* TEXT */
function updateText() {
  feeNote.innerText = isMember
    ? "Member games: no platform fee is deducted before payout calculations"
    : "Non-member games: 15% is deducted from the total pot before payout calculations";
}

/* CALCULATE */
calcBtn.onclick = () => {

  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  if (!p || !f || !w) return alert("Enter valid numbers");

  let payout = p / w;
  if (!isMember) payout *= 0.85;

  let profit = payout - f;
  let roi = (profit / f) * 100;

  result.innerHTML = `
    <div><b>Payout:</b> $${payout.toFixed(2)}</div>
    <div><b>Profit:</b> $${profit.toFixed(2)}</div>
    <div><b>ROI:</b> ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({payout,profit,roi,isMember});
  renderHistory();
};

/* HISTORY */
function renderHistory() {
  history.innerHTML = "";

  historyData.forEach(item => {
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <b>${item.isMember ? "Member" : "Non-Member"}</b><br>
      Payout: $${item.payout.toFixed(2)} |
      Profit: $${item.profit.toFixed(2)} |
      ROI: ${item.roi.toFixed(1)}%
    `;

    history.appendChild(div);
  });
}

/* CLEAR INPUTS */
clearBtn.onclick = () => {
  pot.value = "";
  fee.value = "";
  winners.value = "";
};

/* 🔥 NEW: CLEAR HISTORY */
clearHistoryBtn.onclick = () => {
  historyData = [];
  renderHistory();
};

/* INIT */
updateText();

};
</script>

</body>
</html>
