<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
  color: white;
}

.clear-btn { background: #ef4444; }

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

/* ✅ PERFECT TOGGLE (NO SHIFT EVER) */
.toggle {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-bottom: 10px;
}

.mode-label,
.mode-right {
  min-width: 160px;
  font-size: 14px;
  opacity: 0.5;
  transition: 0.2s;
}

.mode-label { text-align: left; }
.mode-right { text-align: right; }

.active {
  opacity: 1;
  font-weight: bold;
}

/* Switch */
.switch {
  position: relative;
  width: 52px;
  height: 28px;
  justify-self: center;
}

.switch input { opacity: 0; }

.slider {
  position: absolute;
  inset: 0;
  background: #374151;
  border-radius: 34px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider:before {
  transform: translateX(24px);
}

/* History */
.history-wrapper {
  position: relative;
  overflow: hidden;
  margin-top: 10px;
}

.delete-bg {
  position: absolute;
  inset: 0;
  background: #ef4444;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 20px;
  font-weight: bold;
}

.history-item {
  background: #111827;
  padding: 12px;
  border-radius: 10px;
  transition: transform 0.2s ease;
}

.note {
  font-size: 12px;
  color: #94a3b8;
  margin: 4px 0 8px;
}

/* Undo */
#undoBar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  padding: 12px 20px;
  border-radius: 10px;
  display: none;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.show { display: flex; }

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  width: 85%;
  max-width: 300px;
  text-align: center;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<!-- ✅ FIXED TOGGLE -->
<div class="toggle">
  <span id="nonMemberLabel" class="mode-label active">Non-Member (-15%)</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle">
    <span class="slider"></span>
  </label>

  <span id="memberLabel" class="mode-right">Member</span>
</div>

<input id="pot" placeholder="Total Pot">
<input id="entry" placeholder="Entry Fee">
<input id="players" placeholder="Eligible Winners">

<button id="calculateBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div class="note">Swipe left on a result to delete</div>
<div id="history"></div>

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<div id="undoBar">
  Deleted <button id="undoBtn">Undo</button>
</div>

<div id="deleteModal" class="modal">
  <div class="modal-box">
    <h3>Delete Entry?</h3>
    <div class="modal-actions">
      <button id="cancelDelete">Cancel</button>
      <button id="confirmDelete" class="clear-btn">Delete</button>
    </div>
  </div>
</div>

<script>
const entryInput = document.getElementById("entry");
const potInput = document.getElementById("pot");
const playersInput = document.getElementById("players");
const historyDiv = document.getElementById("history");
const modal = document.getElementById("deleteModal");
const confirmDelete = document.getElementById("confirmDelete");
const cancelDelete = document.getElementById("cancelDelete");
const undoBar = document.getElementById("undoBar");
const undoBtn = document.getElementById("undoBtn");

const toggle = document.getElementById("memberToggle");
const nonMemberLabel = document.getElementById("nonMemberLabel");
const memberLabel = document.getElementById("memberLabel");

let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
let deleteIndex = null;
let lastDeleted = null;

function save() {
  localStorage.setItem("stepbetHistory", JSON.stringify(history));
}

function updateMode() {
  const isMember = toggle.checked;
  nonMemberLabel.classList.toggle("active", !isMember);
  memberLabel.classList.toggle("active", isMember);
}
toggle.onchange = updateMode;

function calculate() {
  const entry = +entryInput.value;
  const pot = +potInput.value;
  const players = +playersInput.value;

  if (!entry || !pot || !players) return;

  const adjusted = toggle.checked ? pot : pot * 0.85;

  const payout = +(adjusted / players).toFixed(2);
  const profit = +(payout - entry).toFixed(2);
  const roi = +((profit / entry) * 100).toFixed(1);

  const breakEvenPlayers = Math.round(adjusted / entry);
  const breakEvenPayout = +(adjusted / breakEvenPlayers).toFixed(2);
  const breakEvenProfit = +(breakEvenPayout - entry).toFixed(2);
  const breakEvenROI = +((breakEvenProfit / entry) * 100).toFixed(1);

  document.getElementById("result").innerHTML = `
    Payout: $${payout}<br>
    ${players} players: ${profit >= 0 ? "+" : ""}$${profit} (${roi}% ROI)
    <br><br>
    Break-even: ${breakEvenPlayers} players<br>
    ${breakEvenPlayers} players: ${breakEvenProfit >= 0 ? "+" : ""}$${breakEvenProfit} (${breakEvenROI}% ROI)
  `;

  history.unshift({ payout, profit, roi });
  save();
  render();
}

function render() {
  historyDiv.innerHTML = "";

  history.forEach((h, index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "history-wrapper";

    const bg = document.createElement("div");
    bg.className = "delete-bg";
    bg.textContent = "DELETE";

    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `$${h.payout} | ${h.profit >= 0 ? "+" : ""}$${h.profit} | ${h.roi}%`;

    let startX = 0;

    div.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    });

    div.addEventListener("touchmove", e => {
      const diff = e.touches[0].clientX - startX;
      if (diff < 0) div.style.transform = `translateX(${diff}px)`;
    });

    div.addEventListener("touchend", e => {
      const diff = e.changedTouches[0].clientX - startX;

      if (diff < -80) {
        deleteIndex = index;
        modal.classList.add("show");
      }

      div.style.transform = "";
    });

    wrapper.appendChild(bg);
    wrapper.appendChild(div);
    historyDiv.appendChild(wrapper);
  });
}

confirmDelete.onclick = () => {
  lastDeleted = history.splice(deleteIndex, 1)[0];
  save();
  modal.classList.remove("show");
  render();

  undoBar.style.display = "block";
  setTimeout(() => undoBar.style.display = "none", 4000);
};

undoBtn.onclick = () => {
  if (lastDeleted) {
    history.unshift(lastDeleted);
    save();
    render();
  }
  undoBar.style.display = "none";
};

cancelDelete.onclick = () => modal.classList.remove("show");

document.getElementById("calculateBtn").onclick = calculate;

document.getElementById("clearBtn").onclick = () => {
  history = [];
  save();
  render();
};

updateMode();
render();
</script>

</body>
</html>
