<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>StepBet Profit Calculator</h1>

    <p class="note">
      Use the final pot shown in StepBet after the game ends.
    </p>

    <div class="field">
      <label>Total pot ($)</label>
      <input id="pot" type="number" placeholder="e.g. 12250" />
    </div>

    <div class="field">
      <label>Total winners</label>
      <input id="winners" type="number" placeholder="e.g. 213" />
    </div>

    <div class="field">
      <label>Entry fee ($)</label>
      <input id="entry" type="number" placeholder="e.g. 50" />
    </div>

    <button id="calcBtn">Calculate</button>

    <p id="result">Enter values and tap "Calculate".</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
