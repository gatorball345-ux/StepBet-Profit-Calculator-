<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 10px;
  color: white;
}

.clear-btn { background: #ef4444; }
.secondary-btn { background: #334155; }

#result {
  margin-top: 15px;
  padding: 16px;
  background: #111827;
  border-radius: 12px;
  text-align: center;
}

.history-item {
  background: #111827;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  user-select: none;
}

.positive { color: #22c55e; }
.negative { color: #f97316; }

.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

/* Toggle */
.switch {
  position: relative;
  width: 52px;
  height: 28px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  background: #374151;
  border-radius: 34px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider:before {
  transform: translateX(24px);
}

#modeNotice {
  text-align: center;
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 16px;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  width: 85%;
  max-width: 300px;
  text-align: center;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.modal-actions button {
  flex: 1;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit</h2>

<div class="toggle">
  <span>Non-Member</span>

  <label class="switch">
    <input type="checkbox" id="memberToggle">
    <span class="slider"></span>
  </label>

  <span>Member</span>
</div>

<div id="modeNotice"></div>

<input id="pot" placeholder="Total Pot" type="number">
<input id="entry" placeholder="Entry Fee" type="number">
<input id="players" placeholder="Eligible Winners" type="number">

<button id="calculateBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<button class="secondary-btn" onclick="document.getElementById('fileInput').click()">Import CSV</button>
<button class="secondary-btn" onclick="exportCSV()">Export CSV</button>
<input type="file" id="fileInput" accept=".csv" style="display:none">

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<!-- MODAL -->
<div id="deleteModal" class="modal">
  <div class="modal-box">
    <h3>Delete Entry?</h3>
    <p>This will remove it permanently.</p>

    <div class="modal-actions">
      <button id="cancelDelete" class="secondary-btn">Cancel</button>
      <button id="confirmDelete" class="clear-btn">Delete</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const entryInput = document.getElementById("entry");
  const potInput = document.getElementById("pot");
  const playersInput = document.getElementById("players");
  const result = document.getElementById("result");
  const calculateBtn = document.getElementById("calculateBtn");
  const memberToggle = document.getElementById("memberToggle");
  const historyDiv = document.getElementById("history");
  const clearBtn = document.getElementById("clearBtn");
  const modeNotice = document.getElementById("modeNotice");

  const modal = document.getElementById("deleteModal");
  const confirmDelete = document.getElementById("confirmDelete");
  const cancelDelete = document.getElementById("cancelDelete");

  let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
  let deleteIndex = null;

  function saveHistory() {
    localStorage.setItem("stepbetHistory", JSON.stringify(history));
  }

  function getMode() {
    return memberToggle.checked ? "Member" : "Non-Member";
  }

  function updateMode() {
    modeNotice.textContent =
      getMode() === "Non-Member"
        ? "Non-Member game (15% fee applied)"
        : "Member game";

    renderHistory();
  }

  function calculate() {
    const entry = parseFloat(entryInput.value);
    const pot = parseFloat(potInput.value);
    const players = parseFloat(playersInput.value);

    if (!entry || !pot || !players) {
      result.innerHTML = "Enter all fields";
      return;
    }

    const adjusted = getMode() === "Member" ? pot : pot * 0.85;

    const payout = +(adjusted / players).toFixed(2);
    const profit = +(payout - entry).toFixed(2);
    const roi = +((profit / entry) * 100).toFixed(1);

    const breakEvenPlayers = Math.round(adjusted / entry);

    result.innerHTML = `
      Payout: $${payout}<br>
      ${players} players: ${profit >= 0 ? "+" : ""}$${profit} (${roi}% ROI)
      <br><br>
      Break-even: ${breakEvenPlayers} players
    `;

    history.unshift({ payout, profit, roi, mode: getMode() });
    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    historyDiv.innerHTML = "";

    const filtered = history.filter(h => h.mode === getMode());

    filtered.forEach((h, index) => {
      const div = document.createElement("div");
      div.className = "history-item";

      div.innerHTML = `
        <b>${h.mode}</b><br>
        $${h.payout} | ${h.profit >= 0 ? "+" : ""}$${h.profit} | ${h.roi}%
      `;

      let timer;

      div.addEventListener("touchstart", () => {
        if (navigator.vibrate) navigator.vibrate(30);

        timer = setTimeout(() => {
          deleteIndex = index;
          modal.classList.add("show");
        }, 600);
      });

      div.addEventListener("touchend", () => clearTimeout(timer));
      div.addEventListener("touchmove", () => clearTimeout(timer));

      historyDiv.appendChild(div);
    });
  }

  confirmDelete.onclick = () => {
    history.splice(deleteIndex, 1);
    saveHistory();
    modal.classList.remove("show");
    renderHistory();
  };

  cancelDelete.onclick = () => {
    modal.classList.remove("show");
  };

  clearBtn.onclick = () => {
    history = [];
    saveHistory();
    renderHistory();
  };

  calculateBtn.addEventListener("click", calculate);
  memberToggle.addEventListener("change", updateMode);

  updateMode();
  renderHistory();

});
</script>

</body>
</html>
