<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
}

.container {
    padding: 20px;
}

/* TITLE */
.title {
    text-align: center;
    font-size: 28px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
    margin-bottom: 20px;
}

/* INPUTS */
.input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    font-size: 16px;
    text-align: center;
}

/* BUTTONS */
.btn {
    border: none;
    cursor: pointer;
    border-radius: 20px;
    font-size: 14px;
    color: white;
}

.btn.small {
    padding: 10px 16px;
}

.btn.red {
    background: #a02222;
    box-shadow: 0 0 12px rgba(255,50,50,0.4);
}

.btn.blue {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    background: #3c66c2;
    box-shadow: 0 0 14px rgba(80,140,255,0.5);
}

.btn.orange {
    background: #ff9d3c;
}

/* ROW */
.top-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

/* TOGGLE */
.toggle {
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #0f1e33;
    margin-top: 10px;
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #1db954 !important;
    box-shadow: 0 0 18px rgba(29,185,84,0.7);
}

/* SECTION */
.section-title {
    font-size: 20px;
    margin: 20px 0 10px;
    display: flex;
    justify-content: space-between;
}

/* CARD */
.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 14px;
}

.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.history {
    max-height: 300px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="container">

<div class="title">StepCat Calculator</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<div class="top-row">
    <button class="btn red small" onclick="clearInputs()">Clear Entries</button>
</div>

<div class="toggle">
    <button id="nonBtn" class="active">Non-Member</button>
    <button id="memBtn">Member</button>
</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<div class="section-title">
    Totals
    <div>
        <button class="btn orange small" onclick="loadLast()">Load</button>
        <button class="btn red small" onclick="clearTotals()">Clear</button>
    </div>
</div>

<div id="totals"></div>

<div class="section-title">
    Recent History
    <div>
        <button class="btn orange small" onclick="loadHistory()">Load</button>
        <button class="btn red small" onclick="clearHistory()">Clear</button>
    </div>
</div>

<div id="history" class="history"></div>

</div>

<script>

/* STATE */
let mode = "non";

/* ELEMENTS */
const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");
const totals = document.getElementById("totals");
const historyDiv = document.getElementById("history");

/* TOGGLE */
nonBtn.onclick = () => {
    mode = "non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
};

memBtn.onclick = () => {
    mode = "mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
};

/* CALCULATE (from your WORKING version) */
function calculate(){

    let potVal = parseFloat(pot.value);
    let feeVal = parseFloat(fee.value);
    let winVal = parseFloat(winners.value);

    if(!potVal || !feeVal || !winVal) return;

    let memberPayout = potVal / winVal;
    let nonMemberPayout = memberPayout * 0.85;

    let payout = mode === "mem" ? memberPayout : nonMemberPayout;

    let profit = payout - feeVal;
    let roi = (profit / feeVal) * 100;

    let label = mode === "mem" ? "Member Game" : "Non-Member Game";

    let entry = { label, payout, profit, roi };

    renderTotals(entry);
    saveHistory(entry);
}

/* RENDER */
function renderTotals(d){
    totals.innerHTML = buildCard(d);
}

function buildCard(d){
return `
<div class="card">
<b>${d.label}</b><br><br>
Payout: $${d.payout.toFixed(2)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: $${d.profit.toFixed(2)}
</span><br>
<span class="roi">
ROI: ${d.roi.toFixed(1)}%
</span>
</div>`;
}

/* STORAGE */
function saveHistory(entry){
    let history = JSON.parse(localStorage.getItem("stepcat_history") || "[]");
    history.unshift(entry);
    localStorage.setItem("stepcat_history", JSON.stringify(history));
}

/* LOAD */
function loadLast(){
    let history = JSON.parse(localStorage.getItem("stepcat_history") || "[]");
    if(history.length){
        renderTotals(history[0]);
    }
}

function loadHistory(){
    let history = JSON.parse(localStorage.getItem("stepcat_history") || "[]");
    historyDiv.innerHTML = "";
    history.forEach(e => {
        historyDiv.innerHTML += buildCard(e);
    });
}

/* CLEAR */
function clearInputs(){
    pot.value = "";
    fee.value = "";
    winners.value = "";
}

function clearTotals(){
    totals.innerHTML = "";
}

function clearHistory(){
    localStorage.removeItem("stepcat_history");
    historyDiv.innerHTML = "";
}

</script>

</body>
</html>
