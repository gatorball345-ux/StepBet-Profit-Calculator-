<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

/* MAIN CONTAINER */
.app {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 20px 0;
}

h2 {
  text-align: center;
  margin-bottom: 10px;
}

/* TOGGLE */
.toggle-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin: 20px 0;
}

.toggle-label {
  font-size: 15px;
  color: #6b7280;
}

.toggle-label.active {
  color: #22c55e;
  font-weight: 600;
}

.switch {
  width: 52px;
  height: 28px;
  background: #374151;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
}

.knob {
  width: 24px;
  height: 24px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: 0.2s;
}

.switch.active {
  background: #22c55e;
}

.switch.active .knob {
  left: 26px;
}

/* INPUTS — 🔥 FIXED SPACING */
input {
  width: 92%;
  margin: 12px auto;
  display: block;

  padding: 16px;
  background: #111827;
  border: none;
  border-radius: 14px;
  color: white;
  text-align: center;

  font-size: 16px;
}

/* BUTTON */
button {
  width: 92%;
  margin: 16px auto;
  display: block;

  padding: 16px;
  background: #22c55e;
  border: none;
  border-radius: 14px;
  color: white;
  font-weight: bold;
  font-size: 16px;
}

/* RESULT */
#result {
  width: 92%;
  margin: 20px auto;

  padding: 18px;
  background: #111827;
  border-radius: 14px;
  line-height: 1.8;
}

.label {
  color: #22c55e;
  font-weight: 600;
}

/* HISTORY */
.history-item {
  width: 92%;
  margin: 10px auto;

  background: #111827;
  padding: 14px;
  border-radius: 12px;
}

/* CLEAR BUTTON */
.clear-btn {
  background: #ef4444;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<!-- TOGGLE -->
<div class="toggle-row">
  <div id="nonMemberLabel" class="toggle-label active">Non-Member (-15%)</div>

  <div id="toggle" class="switch" onclick="toggleMember()">
    <div class="knob"></div>
  </div>

  <div id="memberLabel" class="toggle-label">Member</div>
</div>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3 style="width:92%; margin:auto;">Recent</h3>
<div id="history"></div>

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
let isMember = false;

/* TOGGLE */
function toggleMember() {
  isMember = !isMember;

  document.getElementById("toggle").classList.toggle("active");
  document.getElementById("memberLabel").classList.toggle("active");
  document.getElementById("nonMemberLabel").classList.toggle("active");
}

/* CALCULATE */
function calculate() {

  const potInput = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!potInput || !fee || !winners) {
    alert("Enter valid numbers");
    return;
  }

  const pot = isMember ? potInput : potInput * 0.85;

  const payout = pot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;
  const breakEvenPlayers = Math.round(pot / fee);

  const resultDiv = document.getElementById("result");

  resultDiv.innerHTML = `
    <div><span class="label">Payout Per Player:</span> $${payout.toFixed(2)}</div>
    <div><span class="label">Profit / Loss:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
    <div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
    <br>
    <div><span class="label">Break-Even Players:</span> ${breakEvenPlayers}</div>
  `;

  history.unshift({ payout, profit, roi, member: isMember });

  localStorage.setItem("stepbetHistory", JSON.stringify(history));
  renderHistory();
}

/* HISTORY */
function renderHistory() {
  const container = document.getElementById("history");
  container.innerHTML = "";

  history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";

    const type = item.member ? "Member" : "Non-Member";

    div.innerHTML = `
      <span class="label">${type}</span> |
      <span class="label">Payout:</span> $${item.payout.toFixed(2)} |
      <span class="label">Profit:</span> ${(item.profit>=0?"+":"")}$${item.profit.toFixed(2)} |
      <span class="label">ROI:</span> ${item.roi.toFixed(1)}%
    `;

    container.appendChild(div);
  });
}

/* CLEAR */
function clearHistory() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
}

renderHistory();
</script>

</body>
</html>
