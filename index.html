<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

  <h1>StepBet Profit</h1>

  <!-- ✅ TOGGLE AT TOP -->
  <div class="toggle">
    <span>Non-member</span>
    <label class="switch">
      <input type="checkbox" id="memberToggle">
      <span class="slider"></span>
    </label>
    <span>Member</span>
  </div>

  <!-- ✅ INPUTS WITH LABELS -->
  <div class="input-group">
    <label>Total Pot ($)</label>
    <input id="pot">

    <label>Entry Fee ($)</label>
    <input id="entry">

    <label>Eligible Winners</label>
    <input id="players">
  </div>

  <!-- ✅ BUTTON -->
  <button id="calculateBtn">Calculate</button>

  <div id="result"></div>

  <div id="history"></div>

</div>

<script src="script.js"></script>
</body>
</html>
