<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#020c1b;
    color:white;
}

.container {
    max-width:400px;
    margin:auto;
    padding:15px;
}

.input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    background:#0c1f3a;
    color:white;
    text-align:center;
}

.btn {
    padding:10px;
    border:none;
    border-radius:10px;
    color:white;
}

.blue {background:#3c66c2;width:100%;padding:15px;}
.red {background:#a02222;}
.orange {background:#ff9d3c;}

.toggle {
    display:flex;
    margin-top:8px;
}

.toggle button {
    flex:1;
    padding:10px;
    background:#0f1e33;
    border:none;
    color:white;
}

.active {
    background:#1db954 !important;
}

.card {
    background:#0c1f3a;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}

.section {
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h3>StepCat</h3>

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Winners">

<div class="toggle">
<button id="nonBtn" class="active">Non-Member</button>
<button id="memBtn">Member</button>
</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<div class="section">
<b>Totals</b>
<div>
<button class="btn orange" onclick="loadLast()">Load</button>
<button class="btn red" onclick="clearTotals()">Clear</button>
</div>
</div>

<div id="totals"></div>

<div class="section">
<b>History</b>
<div>
<button class="btn orange" onclick="loadHistory()">Load</button>
<button class="btn red" onclick="clearHistory()">Clear</button>
</div>
</div>

<div id="history"></div>

</div>

<script>

/* SAFE STATE */
let mode="non";
let last=null;
let history=[];

/* TOGGLE */
nonBtn.onclick=()=>{
    mode="non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
};

memBtn.onclick=()=>{
    mode="mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
};

/* CORE CALC */
function calculate(){
try{

    let p=parseFloat(pot.value);
    let f=parseFloat(fee.value);
    let w=parseFloat(win.value);

    if(!p||!f||!w) return;

    let member=p/w;
    let non=member*0.85;

    let payout=(mode==="mem")?member:non;
    let profit=payout-f;
    let roi=(profit/f)*100;

    let entry={
        label:(mode==="mem")?"Member Game":"Non-Member Game",
        payout,profit,roi
    };

    last=entry;

    /* SAFE HISTORY */
    history=[entry,...history].slice(0,20);

    renderTotals(entry);
    renderHistory();

}catch(e){
    console.error("CALC ERROR",e);
}
}

/* RENDER */
function renderTotals(d){
try{
totals.innerHTML=card(d);
}catch(e){
console.error("TOTAL ERROR",e);
}
}

function renderHistory(){
try{
historyDiv.innerHTML="";
history.forEach(e=>historyDiv.innerHTML+=card(e));
}catch(e){
console.error("HISTORY ERROR",e);
}
}

function card(d){
return `<div class="card">
<b>${d.label}</b><br>
Payout: $${d.payout.toFixed(2)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: $${d.profit.toFixed(2)}
</span><br>
<span class="roi">
ROI: ${d.roi.toFixed(1)}%
</span>
</div>`;
}

/* LOAD */
function loadLast(){
try{
if(last) renderTotals(last);
}catch(e){
console.error("LOAD TOTAL ERROR",e);
}
}

function loadHistory(){
try{
renderHistory();
}catch(e){
console.error("LOAD HISTORY ERROR",e);
}
}

/* CLEAR */
function clearTotals(){
totals.innerHTML="";
}

function clearHistory(){
history=[];
historyDiv.innerHTML="";
}

</script>

</body>
</html>
