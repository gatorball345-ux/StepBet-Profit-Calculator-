<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
}

.container {
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

/* INPUTS */
.input {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
}

/* BUTTONS */
.btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: #3c66c2;
    color: white;
}

/* CALCULATE GLOW */
.btn:active {
    box-shadow: 0 0 20px rgba(60,102,194,0.8);
}

/* CARD */
.card {
    background: #0c1f3a;
    padding: 14px;
    border-radius: 14px;
    margin-top: 10px;
    position: relative;
    transition: transform 0.3s ease;
}

/* SWIPE GLOWS */
.card.swipe-left {
    box-shadow: inset -8px 0 20px rgba(255,0,0,0.6);
}

.card.swipe-right {
    box-shadow: inset 8px 0 20px rgba(0,255,120,0.6);
}

/* COLORS */
.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.section {
    margin-top: 20px;
}

/* UNDO BAR */
.undo-bar {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.undo-btn {
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #ffaa00;
    color: black;
}
</style>
</head>

<body>

<div class="container">

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="players" placeholder="Total Players">

<button class="btn" onclick="calculate()">Calculate</button>

<div class="section">
    <h3>Totals</h3>
    <div id="totals"></div>
</div>

<div class="section">
    <h3>History</h3>
    <div id="history"></div>
</div>

<div class="undo-bar">
    <button class="undo-btn" onclick="undoTotals()">Undo Totals</button>
    <button class="undo-btn" onclick="undoHistory()">Undo History</button>
</div>

</div>

<script>

let totalsStack = [];
let historyStack = [];

let deletedTotals = [];
let deletedHistory = [];

/* CALCULATE */
function calculate(){
    let pot = parseFloat(document.getElementById("pot").value);
    let fee = parseFloat(document.getElementById("fee").value);
    let players = parseFloat(document.getElementById("players").value);

    if(!pot || !fee || !players) return;

    let payout = pot / players;
    let profit = payout - fee;
    let roi = (profit / fee) * 100;

    let cardHTML = `
    <div class="card">
        <b>Prospects</b><br><br>
        Payout: $${payout.toFixed(2)}<br>
        <span class="${profit>=0?'profit':'loss'}">
        Profit: $${profit.toFixed(2)}
        </span><br>
        <span class="roi">
        ROI: ${roi.toFixed(1)}%
        </span>
    </div>`;

    addCard(cardHTML, "totals");
    addCard(cardHTML, "history");
}

/* ADD CARD */
function addCard(html, type){
    let container = document.getElementById(type);
    let wrapper = document.createElement("div");
    wrapper.innerHTML = html;

    let card = wrapper.firstElementChild;
    addSwipe(card, type);

    container.prepend(card);

    if(type === "totals") totalsStack.unshift(card.outerHTML);
    if(type === "history") historyStack.unshift(card.outerHTML);
}

/* SWIPE FUNCTION */
function addSwipe(card, type){
    let startX = 0;

    card.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
    });

    card.addEventListener("touchmove", e => {
        let diff = e.touches[0].clientX - startX;

        if(diff < -30){
            card.classList.add("swipe-left");
        } else if(diff > 30){
            card.classList.add("swipe-right");
        }
    });

    card.addEventListener("touchend", e => {
        let diff = e.changedTouches[0].clientX - startX;

        if(diff < -100){
            deleteCard(card, type);
        }
        else if(diff > 100){
            exportCard(card);
        }

        card.classList.remove("swipe-left","swipe-right");
    });
}

/* DELETE */
function deleteCard(card, type){
    if(type === "totals"){
        deletedTotals.unshift(card.outerHTML);
    } else {
        deletedHistory.unshift(card.outerHTML);
    }
    card.remove();
}

/* UNDO */
function undoTotals(){
    if(deletedTotals.length === 0){
        alert("No more totals to restore");
        return;
    }
    restoreCard(deletedTotals.shift(), "totals");
}

function undoHistory(){
    if(deletedHistory.length === 0){
        alert("No more history to restore");
        return;
    }
    restoreCard(deletedHistory.shift(), "history");
}

function restoreCard(html, type){
    let container = document.getElementById(type);
    let wrapper = document.createElement("div");
    wrapper.innerHTML = html;

    let card = wrapper.firstElementChild;
    addSwipe(card, type);

    container.prepend(card);
}

/* EXPORT */
function exportCard(card){
    if(confirm("Export this entry?")){
        let blob = new Blob([card.innerText], {type: "text/plain"});
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "entry.txt";
        link.click();
    }
}

</script>

</body>
</html>
