<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px;
}

input {
  width:100%;
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:12px;
  color:white;
  text-align:center;
}

/* TOGGLE */
.toggle {
  margin-top:16px;
  background:#111827;
  border-radius:12px;
  position:relative;
  height:44px;
  display:flex;
  cursor:pointer;
}

.toggle-slider {
  position:absolute;
  top:4px;
  left:4px;
  height:36px;
  width:48%;
  background:#22c55e;
  border-radius:10px;
  transition:0.2s;
}

.toggle-label {
  flex:1;
  text-align:center;
  line-height:44px;
  color:#9ca3af;
}

.toggle-label.active {
  color:white;
  font-weight:bold;
}

/* BUTTONS */
.button-row {
  display:flex;
  gap:10px;
  margin-top:16px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.clear-btn { background:#374151; }
.calc-btn { background:#2563eb; }

/* RESULT */
#result {
  margin-top:20px;
  padding:16px;
  background:#111827;
  border-radius:12px;
}

.history-item {
  margin-top:10px;
  padding:12px;
  background:#111827;
  border-radius:10px;
}

.fee-note {
  margin-top:8px;
  font-size:12px;
  color:#9ca3af;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<h2 style="text-align:center;">StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<div class="toggle" id="toggle">
  <div class="toggle-slider" id="slider"></div>
  <div id="nonLabel" class="toggle-label active">Non-Member</div>
  <div id="memLabel" class="toggle-label">Member</div>
</div>

<div class="fee-note" id="feeNote"></div>

<div class="button-row">
  <button class="clear-btn" id="clearBtn">Clear Inputs</button>
  <button class="calc-btn" id="calcBtn">Calculate</button>
</div>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

</div>

<script>
window.onload = function() {

/* ELEMENTS */
const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");
const result = document.getElementById("result");
const history = document.getElementById("history");

const toggle = document.getElementById("toggle");
const slider = document.getElementById("slider");
const nonLabel = document.getElementById("nonLabel");
const memLabel = document.getElementById("memLabel");
const feeNote = document.getElementById("feeNote");

const calcBtn = document.getElementById("calcBtn");
const clearBtn = document.getElementById("clearBtn");

/* STATE */
let isMember = false;
let historyData = [];

/* TOGGLE */
toggle.onclick = function() {
  isMember = !isMember;

  slider.style.left = isMember ? "50%" : "4px";

  nonLabel.classList.toggle("active", !isMember);
  memLabel.classList.toggle("active", isMember);

  feeNote.innerText = isMember
    ? "Member games: no platform fee is deducted before payout calculations"
    : "Non-member games: 15% is deducted from the total pot before payout calculations";
};

/* CALCULATE */
calcBtn.onclick = function() {
  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  if (!p || !f || !w) {
    alert("Enter valid numbers");
    return;
  }

  let payout = p / w;
  if (!isMember) payout *= 0.85;

  let profit = payout - f;
  let roi = (profit / f) * 100;

  result.innerHTML = `
    <div>Payout: $${payout.toFixed(2)}</div>
    <div>Profit: $${profit.toFixed(2)}</div>
    <div>ROI: ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({payout, profit, roi, isMember});
  renderHistory();
};

/* HISTORY */
function renderHistory() {
  history.innerHTML = "";

  historyData.forEach(item => {
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      ${item.isMember ? "Member" : "Non-Member"}<br>
      Payout: $${item.payout.toFixed(2)} |
      Profit: $${item.profit.toFixed(2)} |
      ROI: ${item.roi.toFixed(1)}%
    `;

    history.appendChild(div);
  });
}

/* CLEAR */
clearBtn.onclick = function() {
  pot.value = "";
  fee.value = "";
  winners.value = "";
};

/* INIT */
feeNote.innerText = "Non-member games: 15% is deducted from the total pot before payout calculations";

};
</script>

</body>
</html>
