<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px;
  box-sizing:border-box;
}

/* INPUTS */
input {
  width:100%;
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:12px;
  color:white;
  text-align:center;
  box-sizing:border-box;
}

/* TOGGLE */
.toggle {
  margin-top:16px;
  background:#111827;
  border-radius:12px;
  display:flex;
  position:relative;
  height:44px;
  overflow:hidden;
  cursor:pointer;
}

.toggle-slider {
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:50%;
  background:#16a34a;
  transition:0.25s;
}

.toggle-label {
  flex:1;
  text-align:center;
  line-height:44px;
  font-weight:600;
  color:#6b7280;
  z-index:2;
}

.toggle-label.active {
  color:white;
}

/* BUTTONS */
.calc-btn {
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.clear-btn {
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#374151;
  color:white;
  font-weight:bold;
}

/* RESULT */
#result {
  margin-top:20px;
  padding:16px;
  background:#111827;
  border-radius:12px;
}

/* HISTORY */
.history-item {
  margin-top:10px;
  padding:12px;
  background:#111827;
  border-radius:10px;
}

.fee-note {
  margin-top:10px;
  text-align:center;
  font-size:13px;
  color:#9ca3af;
}

/* MODAL */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box {
  background:#111827;
  padding:20px;
  border-radius:14px;
  width:80%;
  max-width:300px;
  text-align:center;
}

.modal-box button {
  width:100%;
  margin-top:10px;
  background:#374151;
  border:none;
  padding:10px;
  border-radius:8px;
  color:white;
}
</style>
</head>

<body>

<div class="app">

<h2 style="text-align:center;">StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<div class="toggle" id="toggle">
  <div class="toggle-slider" id="slider"></div>
  <div id="nonLabel" class="toggle-label active">Non-Member</div>
  <div id="memLabel" class="toggle-label">Member</div>
</div>

<div class="fee-note" id="feeNote"></div>

<button class="calc-btn" id="calcBtn">Calculate</button>
<button class="clear-btn" id="clearBtn">Clear</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box" id="modalBox">
    <div>What would you like to clear?</div>
    <button id="clearInputs">Clear Inputs</button>
    <button id="clearHistory">Clear History</button>
    <button id="clearAll">Clear All</button>
    <button id="cancelClear">Cancel</button>
  </div>
</div>

<script>
let isMember = false;
let historyData = [];

/* ELEMENTS */
const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");

const result = document.getElementById("result");
const history = document.getElementById("history");

const toggle = document.getElementById("toggle");
const slider = document.getElementById("slider");

const nonLabel = document.getElementById("nonLabel");
const memLabel = document.getElementById("memLabel");

const feeNote = document.getElementById("feeNote");

const modal = document.getElementById("modal");

/* TOGGLE */
toggle.addEventListener("click", () => {
  isMember = !isMember;

  slider.style.left = isMember ? "50%" : "0%";

  nonLabel.classList.toggle("active", !isMember);
  memLabel.classList.toggle("active", isMember);

  updateText();
});

/* TEXT */
function updateText() {
  feeNote.innerText = isMember
    ? "Member games: no platform fee is deducted before payout calculations"
    : "Non-member games: 15% is deducted from the total pot before payout calculations";
}

/* CALCULATE */
document.getElementById("calcBtn").addEventListener("click", () => {

  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  if (!p || !f || !w) {
    alert("Enter valid numbers");
    return;
  }

  let payout = p / w;
  if (!isMember) payout *= 0.85;

  let profit = payout - f;
  let roi = (profit / f) * 100;

  result.innerHTML = `
    <div><b>Payout:</b> $${payout.toFixed(2)}</div>
    <div><b>Profit:</b> $${profit.toFixed(2)}</div>
    <div><b>ROI:</b> ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({payout,profit,roi,isMember});
  renderHistory();
});

/* HISTORY */
function renderHistory() {
  history.innerHTML = "";

  historyData.forEach(item => {
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <b>${item.isMember ? "Member" : "Non-Member"}</b><br>
      Payout: $${item.payout.toFixed(2)} |
      Profit: $${item.profit.toFixed(2)} |
      ROI: ${item.roi.toFixed(1)}%
    `;

    history.appendChild(div);
  });
}

/* OPEN MODAL */
document.getElementById("clearBtn").addEventListener("click", () => {
  modal.style.display = "flex";
});

/* CLEAR ACTIONS */
document.getElementById("clearInputs").onclick = () => {
  pot.value = "";
  fee.value = "";
  winners.value = "";
  closeModal();
};

document.getElementById("clearHistory").onclick = () => {
  historyData = [];
  renderHistory();
  closeModal();
};

document.getElementById("clearAll").onclick = () => {
  pot.value = "";
  fee.value = "";
  winners.value = "";
  historyData = [];
  result.innerHTML = "";
  renderHistory();
  closeModal();
};

/* CLOSE MODAL */
document.getElementById("cancelClear").onclick = closeModal;

modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

function closeModal() {
  modal.style.display = "none";
}

/* INIT */
updateText();
</script>

</body>
</html>
