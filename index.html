<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

  <h1>StepBet Profit</h1>

  <div class="input-group">
    <input id="entry" placeholder="Entry Fee ($)">
    <input id="pot" placeholder="Total Pot ($)">
    <input id="players" placeholder="Eligible Winners">
  </div>

  <div class="toggle">
    <span>Non-member</span>
    <label class="switch">
      <input type="checkbox" id="memberToggle">
      <span class="slider"></span>
    </label>
    <span>Member</span>
  </div>

  <div id="result"></div>

  <!-- HISTORY -->
  <div id="historyContainer">
    <h3>Recent</h3>
    <div id="history"></div>
  </div>

  <!-- ACTIONS -->
  <div id="historyActions">
    <button onclick="clearHistory()">Clear</button>
    <button onclick="exportJSON()">Export JSON</button>
    <button onclick="exportCSV()">Export CSV</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
