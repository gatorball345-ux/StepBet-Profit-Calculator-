<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {margin:0;font-family:Arial;background:#020c1b;color:white;}
.container {max-width:420px;margin:auto;padding:15px;}

.header {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.title {font-size:22px;color:#ff9d3c;}

.input, .date-input {
width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;
background:#0c1f3a;color:white;text-align:center;font-size:16px;
}

/* SWIPE FIX */
.card {
background:#0c1f3a;
padding:12px;
border-radius:10px;
margin-top:8px;
transition:transform 0.2s ease, box-shadow 0.2s;
touch-action: pan-y; /* allow vertical scroll only */
}

/* Visual feedback */
.card.swiping-left {box-shadow:inset -20px 0 40px rgba(255,0,0,0.8);}
.card.swiping-right {box-shadow:inset 20px 0 40px rgba(255,170,0,0.8);}

.btn {padding:10px;border:none;border-radius:10px;color:white;margin-top:6px;}
.blue {background:#3c66c2;width:100%;}
.red {background:#a02222;}

.calc-active {
box-shadow:0 0 25px rgba(60,102,194,1);
transform:scale(0.96);
}

.section {display:flex;justify-content:space-between;margin-top:15px;}
.empty {opacity:0.6;text-align:center;margin-top:6px;}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">StepCat</div>
<button class="btn red" id="clearInputsBtn">Clear Entries</button>
</div>

<input id="name" class="input" placeholder="Game Name (optional)">
<input id="pot" class="input" placeholder="Total Pot (required)">
<input id="fee" class="input" placeholder="Entry Fee (required)">
<input id="win" class="input" placeholder="Prospects (required)">

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
<b>History</b>
<button class="btn red" id="clearHistoryBtn">Clear</button>
</div>
<div id="history"></div>

</div>

<script>
(function(){

const calcBtn=document.getElementById("calcBtn");
const historyDiv=document.getElementById("history");

let history=JSON.parse(localStorage.getItem("history")||"[]");

/* SAVE */
function save(){
localStorage.setItem("history",JSON.stringify(history));
}

/* CALCULATE */
calcBtn.onclick=function(){

calcBtn.classList.add("calc-active");
calcBtn.innerText="Calculating...";

setTimeout(function(){

let p=parseFloat(document.getElementById("pot").value);
let f=parseFloat(document.getElementById("fee").value);
let w=parseFloat(document.getElementById("win").value);

if(isNaN(p)||isNaN(f)||isNaN(w)){
alert("Enter required values");
resetBtn();
return;
}

let payout=p/w;
let profit=payout-f;
let roi=(profit/f)*100;

let entry={
payout,profit,roi
};

history.unshift(entry);
if(history.length>200) history.pop();

save();
render();
resetBtn();

},300);
};

/* RESET */
function resetBtn(){
calcBtn.classList.remove("calc-active");
calcBtn.innerText="Calculate";
}

/* SWIPE HANDLER */
function addSwipe(el,index){

let startX=0;
let currentX=0;
let isDragging=false;

el.addEventListener("touchstart",function(e){
startX=e.touches[0].clientX;
isDragging=true;
}, {passive:true});

el.addEventListener("touchmove",function(e){
if(!isDragging) return;

currentX=e.touches[0].clientX;
let diff=currentX-startX;

/* MOVE CARD */
el.style.transform=`translateX(${diff}px)`;

/* VISUAL */
if(diff<-30){
el.classList.add("swiping-left");
el.classList.remove("swiping-right");
}
else if(diff>30){
el.classList.add("swiping-right");
el.classList.remove("swiping-left");
}

}, {passive:false});

el.addEventListener("touchend",function(e){

isDragging=false;

let diff=currentX-startX;

/* DELETE THRESHOLD */
if(Math.abs(diff)>100){
history.splice(index,1);
save();
render();
return;
}

/* RESET POSITION */
el.style.transform="translateX(0)";
el.classList.remove("swiping-left","swiping-right");

});
}

/* RENDER */
function render(){

historyDiv.innerHTML=history.length
?history.map((e,i)=>`
<div class="card" id="h${i}">
Payout: $${e.payout.toFixed(2)}<br>
<span class="${e.profit>=0?'profit':'loss'}">
Profit: $${e.profit.toFixed(2)}
</span><br>
<span class="roi">ROI: ${e.roi.toFixed(1)}%</span>
</div>
`).join("")
:"<div class='empty'>History empty</div>";

/* APPLY SWIPE AFTER RENDER */
history.forEach((_,i)=>{
let el=document.getElementById("h"+i);
if(el) addSwipe(el,i);
});
}

/* CLEAR */
document.getElementById("clearHistoryBtn").onclick=function(){
history=[];
save();
render();
};

render();

})();
</script>

</body>
</html>
