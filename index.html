<script>
let isMember = false;

/* SAFE STORAGE */
function loadHistory(){
  try {
    return JSON.parse(localStorage.getItem("stepbet_history")) || [];
  } catch {
    return [];
  }
}

function saveHistory(data){
  localStorage.setItem("stepbet_history", JSON.stringify(data));
}

let historyData = loadHistory();

/* ELEMENTS */
const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");

const result = document.getElementById("result");
const history = document.getElementById("history");
const note = document.getElementById("note");

/* TOGGLE */
document.getElementById("non").onclick = () => setMode(false);
document.getElementById("mem").onclick = () => setMode(true);

function setMode(val){
  isMember = val;

  non.classList.toggle("active", !val);
  mem.classList.toggle("active", val);

  note.innerText = val
    ? "Member games: no platform fee applied"
    : "Non-member games: 15% deducted before payout calculations";
}

/* CALCULATE */
function calculate(){
  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  if(!p || !f || !w){
    alert("Enter valid values");
    return;
  }

  let payout = p / w;
  if(!isMember) payout *= 0.85;

  let profit = payout - f;
  let roi = (profit / f) * 100;

  result.innerHTML = `
    <div><b>Payout:</b> $${payout.toFixed(2)}</div>
    <div><b>Profit:</b> $${profit.toFixed(2)}</div>
    <div><b>ROI:</b> ${roi.toFixed(1)}%</div>
  `;

  /* ALWAYS CREATE NEW ARRAY (important fix) */
  historyData = [
    {payout,profit,roi,isMember, time: Date.now()},
    ...historyData
  ];

  saveHistory(historyData);
  renderHistory();
}

/* RENDER HISTORY */
function renderHistory(){
  history.innerHTML = "";

  historyData.forEach((h,index)=>{
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <div>
        <b>${h.isMember ? "Member" : "Non-Member"}</b><br>
        Payout: $${h.payout.toFixed(2)} |
        Profit: $${h.profit.toFixed(2)} |
        ROI: ${h.roi.toFixed(1)}%
      </div>
    `;

    /* SWIPE DELETE */
    let startX = 0;

    div.addEventListener("touchstart", e=>{
      startX = e.touches[0].clientX;
    });

    div.addEventListener("touchend", e=>{
      let diff = startX - e.changedTouches[0].clientX;

      if(diff > 80){
        historyData = historyData.filter((_,i)=>i !== index);
        saveHistory(historyData);
        renderHistory();
      }
    });

    history.appendChild(div);
  });
}

/* CLEAR MENU */
function openClear(){
  modal.style.display="block";
}

function closeModal(){
  modal.style.display="none";
}

function clearEntries(){
  pot.value = "";
  fee.value = "";
  winners.value = "";
  closeModal();
}

function clearHistory(){
  historyData = [];
  localStorage.removeItem("stepbet_history");
  renderHistory();
  closeModal();
}

function clearTotals(){
  result.innerHTML = "";
  closeModal();
}

function clearAll(){
  historyData = [];
  localStorage.removeItem("stepbet_history");

  pot.value = "";
  fee.value = "";
  winners.value = "";
  result.innerHTML = "";

  renderHistory();
  closeModal();
}

/* INIT */
setMode(false);
renderHistory();
</script>
