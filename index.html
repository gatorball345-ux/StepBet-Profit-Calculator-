<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>StepBet Profit</h1>

    <div class="field">
      <label>Entry fee ($)</label>
      <input id="entry" type="number" inputmode="decimal" placeholder="e.g. 40" />
    </div>

    <div class="field">
      <label>Total pot ($)</label>
      <input id="pot" type="number" placeholder="e.g. 23800" />
    </div>

    <div class="field">
      <label>Players still in game</label>
      <input id="winners" type="number" placeholder="e.g. 207" />
    </div>

    <div class="toggle-field">
      <span>Non-member</span>
      <label class="switch">
        <input type="checkbox" id="memberToggle">
        <span class="slider"></span>
      </label>
      <span>Member</span>
    </div>

    <p id="modeLabel">Non-member (15% fee)</p>

    <div id="result"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
