<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>StepBet Profit Calculator</h1>

    <p class="note">
      Use current pot and players still in the game for live estimates.
    </p>

    <!-- ENTRY -->
    <div class="field">
      <label>Entry fee ($)</label>
      <input id="entry" type="number" placeholder="e.g. 50" />
    </div>

    <!-- POT -->
    <div class="field">
      <label>Total pot ($)</label>
      <input id="pot" type="number" placeholder="e.g. 12250" />
    </div>

    <!-- ELIGIBLE PLAYERS -->
    <div class="field">
      <label>Players still in game</label>
      <input id="winners" type="number" placeholder="e.g. 213" />
    </div>

    <!-- TOGGLE -->
    <div class="toggle-field">
      <span>Non-member</span>

      <label class="switch">
        <input type="checkbox" id="memberToggle">
        <span class="slider"></span>
      </label>

      <span>Member</span>
    </div>

    <p id="modeLabel">Mode: Non-member (15% fee applied)</p>

    <button id="calcBtn">Calculate</button>

    <p id="result">Enter values and calculate.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
