<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StepBet Profit Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="app">

    <h1>StepBet Profit</h1>

    <input id="entry" placeholder="Entry Fee">
    <input id="pot" placeholder="Total Pot">
    <input id="winners" placeholder="Eligible Winners">

    <div class="toggle-field">
      <span>Non-member</span>
      <label class="switch">
        <input type="checkbox" id="memberToggle">
        <span class="slider"></span>
      </label>
      <span>Member</span>
    </div>

    <div id="modeLabel">Non-member (15% fee)</div>

    <div id="result"></div>
    <div id="avgROI"></div>

    <div id="historyControls">
      <button id="importBtn">Import</button>
      <button id="exportBtn">Export</button>
      <button id="clearBtn">Clear</button>
      <input type="file" id="importFile" hidden>
    </div>

    <div id="history"></div>

    <div id="charts">
      <canvas id="roiChart"></canvas>
      <div id="stats"></div>
      <div id="projections"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
