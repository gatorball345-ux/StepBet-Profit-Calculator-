<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

/* INPUT FIELDS */
.input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 20px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
    font-size: 16px;
    box-shadow: 0 0 10px rgba(0,150,255,0.3);
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 16px;
    border-radius: 20px;
    border: none;
    background: #3c66c2;
    color: white;
    font-size: 16px;
    box-shadow: 0 0 14px rgba(80,140,255,0.5);
    transition: 0.2s;
}

.btn:active {
    box-shadow: 0 0 25px rgba(80,140,255,0.9);
}

/* SECTION HEADERS */
.section {
    margin-top: 25px;
}

.section h2 {
    margin-bottom: 10px;
}

/* RESULT CARDS */
.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 12px;
    box-shadow: 0 0 16px rgba(0,150,255,0.4);
}

/* COLORS */
.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }
</style>
</head>

<body>

<div class="container">

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="players" placeholder="Total Players">

<button class="btn" onclick="calculate()">Calculate</button>

<div class="section">
    <h2>Totals</h2>
    <div id="totals"></div>
</div>

<div class="section">
    <h2>History</h2>
    <div id="history"></div>
</div>

</div>

<script>

function calculate(){

    let pot = parseFloat(document.getElementById("pot").value);
    let fee = parseFloat(document.getElementById("fee").value);
    let players = parseFloat(document.getElementById("players").value);

    if(isNaN(pot) || isNaN(fee) || isNaN(players)){
        alert("Please enter valid numbers");
        return;
    }

    let payout = pot / players;
    let profit = payout - fee;
    let roi = (profit / fee) * 100;

    let html = `
    <div class="card">
        <b>Prospects</b><br><br>
        Payout: $${payout.toFixed(2)}<br>
        <span class="${profit >= 0 ? 'profit' : 'loss'}">
            Profit: $${profit.toFixed(2)}
        </span><br>
        <span class="roi">
            ROI: ${roi.toFixed(1)}%
        </span>
    </div>`;

    document.getElementById("totals").innerHTML =
        html + document.getElementById("totals").innerHTML;

    document.getElementById("history").innerHTML =
        html + document.getElementById("history").innerHTML;
}

</script>

</body>
</html>
