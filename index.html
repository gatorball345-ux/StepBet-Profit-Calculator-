<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
    overflow-x: hidden;
}

.container {
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 26px;
    color: #ff9d3c;
    text-shadow: 0 0 10px rgba(255,150,50,0.5);
}

/* BUTTONS */
.clear-btn {
    background: #a02222;
    border: none;
    padding: 10px 14px;
    border-radius: 12px;
    color: white;
}

.load-btn {
    background: #ff9d3c;
    border: none;
    padding: 10px 14px;
    border-radius: 12px;
    color: white;
}

/* INPUT */
.input {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border-radius: 12px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
}

/* TOGGLE */
.toggle {
    display: flex;
    background: #0f1e33;
    border-radius: 20px;
    overflow: hidden;
}

.toggle button {
    flex: 1;
    padding: 12px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #1db954;
}

/* CALCULATE */
.calculate {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border-radius: 16px;
    border: none;
    background: #3c66c2;
    color: white;
}

/* SECTIONS */
.section-title {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

/* CARD */
.card {
    background: #0c1f3a;
    padding: 14px;
    border-radius: 14px;
    margin-top: 10px;
}

.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.history {
    max-height: 300px;
    overflow-y: auto;
}

.notice {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="title">StepCat Calculator</div>
    <button class="clear-btn" onclick="clearInputs()">Clear</button>
</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<div class="toggle">
    <button id="nonBtn" class="active">Non-Member</button>
    <button id="memBtn">Member</button>
</div>

<button class="calculate" onclick="calculate()">Calculate</button>

<div id="notice" class="notice"></div>

<div class="section-title">
    <div>Totals</div>
    <div>
        <button class="load-btn" onclick="loadLast()">Load</button>
        <button class="clear-btn" onclick="clearTotals()">Clear</button>
    </div>
</div>

<div id="totals"></div>

<div class="section-title">
    <div>Recent History</div>
    <div>
        <button class="load-btn" onclick="loadHistory()">Load</button>
        <button class="clear-btn" onclick="clearHistory()">Clear</button>
    </div>
</div>

<div id="history" class="history"></div>

</div>

<script>

/* ===== STATE ===== */
let mode = "non";

/* ===== ELEMENTS ===== */
const potEl = document.getElementById("pot");
const feeEl = document.getElementById("fee");
const winEl = document.getElementById("winners");
const totalsEl = document.getElementById("totals");
const historyEl = document.getElementById("history");
const noticeEl = document.getElementById("notice");
const nonBtn = document.getElementById("nonBtn");
const memBtn = document.getElementById("memBtn");

/* ===== TOGGLE ===== */
nonBtn.onclick = () => {
    mode = "non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
    noticeEl.innerText = "Non-member: 15% taken.";
};

memBtn.onclick = () => {
    mode = "mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
    noticeEl.innerText = "Member: No fee taken.";
};

noticeEl.innerText = "Non-member: 15% taken.";

/* ===== FORMAT ===== */
function money(n){ return "$" + n.toFixed(2); }
function roi(n){ return n.toFixed(1) + "%"; }

/* ===== CALCULATE (THIS IS NOW GUARANTEED TO RUN) ===== */
function calculate(){

    const pot = parseFloat(potEl.value);
    const fee = parseFloat(feeEl.value);
    const winners = parseFloat(winEl.value);

    if(isNaN(pot) || isNaN(fee) || isNaN(winners)) return;

    const member = pot / winners;
    const non = member * 0.85;

    const payout = (mode === "mem") ? member : non;
    const profit = payout - fee;
    const r = (profit / fee) * 100;

    const entry = {
        label: mode === "mem" ? "Member Game" : "Non-Member Game",
        payout, profit, r
    };

    renderTotals(entry);
    saveHistory(entry);
}

/* ===== RENDER ===== */
function renderTotals(d){
    totalsEl.innerHTML = `
    <div class="card">
        <b>${d.label}</b><br><br>
        Payout: ${money(d.payout)}<br>
        <span class="${d.profit>=0?'profit':'loss'}">
        Profit: ${money(d.profit)}
        </span><br>
        <span class="roi">
        ROI: ${roi(d.r)}
        </span>
    </div>`;
}

/* ===== STORAGE ===== */
function saveHistory(entry){
    let history = JSON.parse(localStorage.getItem("stepcat_history") || "[]");
    history.unshift(entry);
    localStorage.setItem("stepcat_history", JSON.stringify(history));
}

/* ===== LOAD ===== */
function loadLast(){
    let history = JSON.parse(localStorage.getItem("stepcat_history") || "[]");
    if(history.length > 0){
        renderTotals(history[0]);
    }
}

function loadHistory(){
    let history = JSON.parse(localStorage.getItem("stepcat_history") || "[]");

    historyEl.innerHTML = "";

    history.forEach(e => {
        historyEl.innerHTML += `
        <div class="card">
            <b>${e.label}</b><br><br>
            Payout: ${money(e.payout)}<br>
            <span class="${e.profit>=0?'profit':'loss'}">
            Profit: ${money(e.profit)}
            </span><br>
            <span class="roi">
            ROI: ${roi(e.r)}
            </span>
        </div>`;
    });
}

/* ===== CLEAR ===== */
function clearInputs(){
    potEl.value = "";
    feeEl.value = "";
    winEl.value = "";
}

function clearTotals(){
    totalsEl.innerHTML = "";
}

function clearHistory(){
    localStorage.removeItem("stepcat_history");
    historyEl.innerHTML = "";
}

</script>

</body>
</html>
