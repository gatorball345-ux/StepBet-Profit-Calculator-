<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepBet Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<h1>StepBet Profit</h1>

<input id="entry" placeholder="Entry Fee ($)">
<input id="pot" placeholder="Total Pot ($)">
<input id="players" placeholder="Eligible Winners">

<!-- MEMBER TOGGLE -->
<div class="toggle">
  <span>Non-member</span>
  <label class="switch">
    <input type="checkbox" id="memberToggle">
    <span class="slider"></span>
  </label>
  <span>Member</span>
</div>

<!-- MODE TOGGLE -->
<div class="mode-toggle">
  <span>Simple</span>
  <label class="switch">
    <input type="checkbox" id="modeToggle">
    <span class="slider"></span>
  </label>
  <span>Advanced</span>
</div>

<!-- RESULT -->
<div id="result"></div>

<!-- ADVANCED -->
<div id="advancedSection">
  <div id="prediction"></div>
  <div id="gameTier"></div>
  <div id="confidence"></div>
  <div id="edge"></div>
  <div id="ranking"></div>
  <div id="alerts"></div>
  <div id="aiInsights"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
