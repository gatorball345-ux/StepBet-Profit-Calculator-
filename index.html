<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Calculator</title>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  background:#020617;
  color:white;
  font-family:-apple-system, sans-serif;
}

/* APP */
.app {
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:420px;
  margin:auto;
}

/* TOP PANEL (CARD STYLE) */
.top {
  padding:20px;
  background:#020617;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  z-index:2;
}

/* INPUTS */
input {
  width:100%;
  padding:16px;
  margin-top:12px;
  background:#0f172a;
  border:none;
  border-radius:14px;
  color:white;
  text-align:center;
}

/* TOGGLE */
.toggle {
  display:flex;
  margin-top:16px;
  border-radius:14px;
  overflow:hidden;
  background:#111827;
}

.toggle div {
  flex:1;
  padding:12px;
  text-align:center;
  color:#6b7280;
  font-weight:600;
}

.toggle .active {
  background:#16a34a;
  color:white;
}

/* RESULT */
.result {
  margin-top:16px;
  padding:16px;
  border-radius:14px;
  background:#0f172a;
}

/* NOTE */
.note {
  text-align:center;
  font-size:12px;
  color:#9ca3af;
  margin-top:8px;
}

/* SCROLL ZONE */
.history-container {
  flex:1;
  overflow-y:auto;
  background:#020617;

  /* 🔥 VISUAL SEPARATION */
  border-top:1px solid #111827;
  box-shadow:inset 0 10px 20px rgba(0,0,0,0.6);
}

/* STICKY HEADER */
.history-header {
  position:sticky;
  top:0;
  background:#020617;
  padding:12px 20px;
  font-weight:bold;
  border-bottom:1px solid #111827;
  z-index:1;
}

/* HISTORY ITEMS */
.history {
  padding:10px 20px 30px;
}

.history-item {
  margin-top:10px;
  padding:14px;
  background:#0f172a;
  border-radius:14px;

  /* subtle card effect */
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
}

/* BOTTOM BAR */
.bottom-bar {
  padding:16px;
  background:#020617;
  border-top:1px solid #111827;
  box-shadow:0 -4px 20px rgba(0,0,0,0.5);
}

/* BUTTONS */
.calc {
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.clear {
  margin-top:10px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#374151;
  color:white;
}

/* MODAL */
.modal {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0f172a;
  border-radius:20px 20px 0 0;
  padding:20px;
  display:none;
}

.modal button {
  width:100%;
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#1f2937;
  color:white;
}

.modal .danger {
  background:#7f1d1d;
}
</style>
</head>

<body>

<div class="app">

<!-- TOP PANEL -->
<div class="top">

<h2 style="text-align:center;">StepBet Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<div class="toggle">
  <div id="nonBtn" class="active">Non-Member</div>
  <div id="memBtn">Member</div>
</div>

<div id="note" class="note"></div>

<div id="result" class="result"></div>

</div>

<!-- SCROLL AREA -->
<div class="history-container">

<div class="history-header">Recent</div>

<div id="history" class="history"></div>

</div>

<!-- STICKY BUTTONS -->
<div class="bottom-bar">
  <button class="calc" onclick="calculate()">Calculate</button>
  <button class="clear" onclick="openClear()">Clear</button>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div>What would you like to clear?</div>
  <button onclick="clearEntries()">Clear Entries</button>
  <button onclick="clearHistory()">Clear History</button>
  <button onclick="clearTotals()">Clear Totals</button>
  <button class="danger" onclick="clearAll()">Clear Everything</button>
  <button onclick="closeModal()">Cancel</button>
</div>

<script>
let isMember = false;

function getHistory(){
  return JSON.parse(localStorage.getItem("stepbet_history") || "[]");
}

function setHistory(data){
  localStorage.setItem("stepbet_history", JSON.stringify(data));
}

let historyData = getHistory();

const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");
const result = document.getElementById("result");
const history = document.getElementById("history");
const note = document.getElementById("note");

const nonBtn = document.getElementById("nonBtn");
const memBtn = document.getElementById("memBtn");

nonBtn.onclick = () => setMode(false);
memBtn.onclick = () => setMode(true);

function setMode(val){
  isMember = val;

  nonBtn.classList.toggle("active", !val);
  memBtn.classList.toggle("active", val);

  note.innerText = val
    ? "Member games: no platform fee applied"
    : "Non-member games: 15% deducted before payout calculations";
}

function calculate(){
  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  if(!p || !f || !w) return alert("Enter valid values");

  let payout = p / w;
  if(!isMember) payout *= 0.85;

  let profit = payout - f;
  let roi = (profit / f) * 100;

  result.innerHTML = `
    <div><b>Payout:</b> $${payout.toFixed(2)}</div>
    <div><b>Profit:</b> $${profit.toFixed(2)}</div>
    <div><b>ROI:</b> ${roi.toFixed(1)}%</div>
  `;

  let currentHistory = getHistory();

  currentHistory.unshift({payout, profit, roi, isMember});

  setHistory(currentHistory);
  historyData = currentHistory;

  renderHistory();
}

function renderHistory(){
  history.innerHTML = "";

  historyData.forEach((h)=>{
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <b>${h.isMember ? "Member" : "Non-Member"}</b><br>
      Payout: $${h.payout.toFixed(2)} |
      Profit: $${h.profit.toFixed(2)} |
      ROI: ${h.roi.toFixed(1)}%
    `;

    history.appendChild(div);
  });
}

function openClear(){ modal.style.display="block"; }
function closeModal(){ modal.style.display="none"; }

function clearEntries(){
  pot.value = fee.value = winners.value = "";
  closeModal();
}

function clearHistory(){
  historyData = [];
  localStorage.removeItem("stepbet_history");
  renderHistory();
  closeModal();
}

function clearTotals(){
  result.innerHTML = "";
  closeModal();
}

function clearAll(){
  clearEntries();
  clearHistory();
  clearTotals();
  closeModal();
}

setMode(false);
renderHistory();
</script>

</body>
</html>
