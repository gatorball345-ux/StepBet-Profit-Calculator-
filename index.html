<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#020c1b;
    color:white;
}

.container {
    max-width:400px;
    margin:auto;
    padding:15px;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.help-btn {
    background:#ff9d3c;
    border:none;
    border-radius:50%;
    width:30px;
    height:30px;
    color:white;
    font-weight:bold;
}

/* INPUT */
.input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    background:#0c1f3a;
    color:white;
    text-align:center;
}

/* BUTTONS */
.btn {
    padding:8px 10px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:12px;
}

.blue {
    background:#3c66c2;
    width:100%;
    padding:14px;
    box-shadow:0 0 12px rgba(80,140,255,0.5);
}

.red {
    background:#a02222;
    box-shadow:0 0 10px rgba(255,0,0,0.5);
}

.gray {
    background:#666;
}

.toggle {
    display:flex;
    margin-top:8px;
}

.toggle button {
    flex:1;
    padding:10px;
    background:#0f1e33;
    border:none;
    color:white;
}

.toggle button.active {
    background:#1db954 !important;
    box-shadow:0 0 10px rgba(29,185,84,0.6);
}

/* CARD */
.card {
    background:#0c1f3a;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    transition: transform 0.25s ease, opacity 0.25s ease;
}

.card.removing {
    transform: translateX(-120%);
    opacity: 0;
}

.empty {
    text-align:center;
    opacity:0.6;
}

.profit {color:#3cff7c;}
.loss {color:#ff4c4c;}
.roi {color:#ffd24c;}

.section {
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

/* TOAST */
.toast {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    padding:12px 20px;
    border-radius:10px;
    opacity:0;
    transition:opacity 0.3s;
}

.toast.show {
    opacity:1;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h3>StepCat Calculator</h3>
<button class="help-btn" id="helpBtn">?</button>
</div>

<input id="pot" class="input" placeholder="Total Pot">
<input id="fee" class="input" placeholder="Entry Fee">
<input id="win" class="input" placeholder="Winners">

<div class="toggle">
<button id="nonBtn" class="active">Non-Member</button>
<button id="memBtn">Member</button>
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<div class="section">
<b>Totals</b>
<div>
<button class="btn gray" id="undoTotal">Undo</button>
<button class="btn red" id="clearTotal">Clear All</button>
</div>
</div>

<div id="totals"></div>

<div class="section">
<b>History</b>
<div>
<button class="btn gray" id="undoHistory">Undo</button>
<button class="btn red" id="clearHistoryBtn">Clear All</button>
</div>
</div>

<div id="history"></div>

</div>

<div id="toast" class="toast"></div>

<script>
window.onload = function(){

let mode="non";
let history=[];
let historyUndoStack=[];
let totalsUndoStack=[];
let last=null;

/* TOAST */
function showToast(msg){
    const t=document.getElementById("toast");
    t.innerText=msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2000);
}

/* HELP SYSTEM */
function showHelp(){
    showToast("Swipe left to delete • Undo restores • Clear All is permanent");
}

if(!localStorage.getItem("stepcat_help_seen")){
    showHelp();
    localStorage.setItem("stepcat_help_seen","true");
}

document.getElementById("helpBtn").onclick=showHelp;

/* TOGGLE */
nonBtn.onclick=()=>{
    mode="non";
    nonBtn.classList.add("active");
    memBtn.classList.remove("active");
};

memBtn.onclick=()=>{
    mode="mem";
    memBtn.classList.add("active");
    nonBtn.classList.remove("active");
};

/* CALCULATE */
calcBtn.onclick=function(){

    let p=parseFloat(pot.value);
    let f=parseFloat(fee.value);
    let w=parseFloat(win.value);

    if(isNaN(p)||isNaN(f)||isNaN(w)) return;

    let member=p/w;
    let non=member*0.85;

    let payout=(mode==="mem")?member:non;
    let profit=payout-f;
    let roi=(profit/f)*100;

    let entry={label:mode==="mem"?"Member Game":"Non-Member Game",payout,profit,roi};

    last=entry;
    history.unshift(entry);

    renderTotals(entry);
    renderHistory();
};

/* TOTALS */
function renderTotals(d){
    totals.innerHTML="";
    if(!d){
        totals.innerHTML="<div class='card empty'>Totals empty</div>";
        return;
    }
    let el=createCard(d);
    addSwipe(el,d,"total");
    totals.appendChild(el);
}

/* HISTORY */
function renderHistory(){
    historyDiv.innerHTML="";
    if(history.length===0){
        historyDiv.innerHTML="<div class='card empty'>History empty</div>";
        return;
    }
    history.forEach((e,i)=>{
        let el=createCard(e);
        addSwipe(el,e,"history",i);
        historyDiv.appendChild(el);
    });
}

/* CARD */
function createCard(d){
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
    <b>${d.label}</b><br>
    Payout: $${d.payout.toFixed(2)}<br>
    <span class="${d.profit>=0?'profit':'loss'}">Profit: $${d.profit.toFixed(2)}</span><br>
    <span class="roi">ROI: ${d.roi.toFixed(1)}%</span>`;
    return div;
}

/* SWIPE */
function addSwipe(el,data,type,index){
    let startX=0;

    el.addEventListener("touchstart",e=>startX=e.touches[0].clientX);

    el.addEventListener("touchend",e=>{
        let move=e.changedTouches[0].clientX-startX;

        if(move<-80){
            el.classList.add("removing");

            if(type==="total"){
                totalsUndoStack.push(data);
                setTimeout(()=>renderTotals(null),250);
            }

            if(type==="history"){
                historyUndoStack.push(data);
                history.splice(index,1);
                setTimeout(()=>renderHistory(),250);
            }
        }
    });
}

/* UNDO */
undoTotal.onclick=function(){
    if(totalsUndoStack.length){
        renderTotals(totalsUndoStack.pop());
    } else {
        showToast("No more totals to undo");
    }
};

undoHistory.onclick=function(){
    if(historyUndoStack.length){
        history.unshift(historyUndoStack.pop());
        renderHistory();
    } else {
        showToast("No more history to undo");
    }
};

/* CLEAR */
clearTotal.onclick=function(){
    if(confirm("Clear totals permanently?")){
        totalsUndoStack=[];
        renderTotals(null);
    }
};

clearHistoryBtn.onclick=function(){
    if(confirm("Clear history permanently?")){
        history=[];
        historyUndoStack=[];
        renderHistory();
    }
};

};
</script>

</body>
</html>
