<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body { background:#020617; color:white; font-family:system-ui; margin:0; }
.app { max-width:420px; margin:auto; padding:20px 0; }

h2 { text-align:center; }

input, button, #result, .history-wrapper {
  width:92%;
  margin:auto;
  display:block;
}

input {
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:14px;
  color:white;
  text-align:center;
}

button {
  padding:16px;
  margin-top:16px;
  background:#22c55e;
  border:none;
  border-radius:14px;
  color:white;
  font-weight:bold;
}

.clear-btn { background:#ef4444; }

#result {
  margin-top:20px;
  padding:18px;
  background:#111827;
  border-radius:14px;
}

.label { color:#22c55e; }

/* HISTORY */
.history-wrapper {
  position:relative;
  overflow:hidden;
  margin-top:10px;
}

.delete-bg {
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:100%;
  background:#ef4444;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding-right:20px;
}

.history-item {
  background:#111827;
  padding:14px;
  border-radius:12px;
}

/* MODAL */
.modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box {
  background:#111827;
  padding:20px;
  border-radius:14px;
  width:80%;
  max-width:300px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3 style="width:92%; margin:auto;">Recent</h3>
<div id="historyContainer"></div>

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<!-- DELETE MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div>Delete entry?</div>
    <button onclick="confirmDelete()">Delete</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let historyData = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
let deleteIndex = null;

/* CALCULATE — FIXED */
function calculate() {

  const pot = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!pot || !fee || !winners) {
    alert("Enter valid numbers");
    return;
  }

  const payout = pot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;

  document.getElementById("result").innerHTML = `
    <div><span class="label">Payout:</span> $${payout.toFixed(2)}</div>
    <div><span class="label">Profit:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
    <div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({ payout, profit, roi });
  localStorage.setItem("stepbetHistory", JSON.stringify(historyData));

  renderHistory();
}

/* SWIPE */
function addSwipe(el, index) {
  let startX = 0;

  el.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
  });

  el.addEventListener("touchend", e=>{
    let diff = e.changedTouches[0].clientX - startX;

    if (diff < -80) {
      openModal(index);
    }
  });
}

/* DELETE */
function openModal(index) {
  deleteIndex = index;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function confirmDelete() {
  historyData.splice(deleteIndex, 1);
  localStorage.setItem("stepbetHistory", JSON.stringify(historyData));
  renderHistory();
  closeModal();
}

/* HISTORY — FIXED */
function renderHistory() {
  const container = document.getElementById("historyContainer");
  container.innerHTML = "";

  historyData.forEach((item, index)=>{

    const wrap = document.createElement("div");
    wrap.className = "history-wrapper";

    const bg = document.createElement("div");
    bg.className = "delete-bg";
    bg.textContent = "DELETE";

    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <span class="label">Payout:</span> $${item.payout.toFixed(2)} |
      <span class="label">Profit:</span> ${(item.profit>=0?"+":"")}$${item.profit.toFixed(2)} |
      <span class="label">ROI:</span> ${item.roi.toFixed(1)}%
    `;

    addSwipe(div, index);

    wrap.appendChild(bg);
    wrap.appendChild(div);
    container.appendChild(wrap);
  });
}

/* CLEAR */
function clearHistory() {
  historyData = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
}

renderHistory();
</script>

</body>
</html>
