<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #020c1b;
    color: white;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 20px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
    font-size: 16px;
    box-shadow: 0 0 10px rgba(0,150,255,0.3);
}

.btn {
    width: 100%;
    padding: 16px;
    border-radius: 20px;
    border: none;
    background: #3c66c2;
    color: white;
    font-size: 16px;
    box-shadow: 0 0 14px rgba(80,140,255,0.5);
}

.btn:active {
    box-shadow: 0 0 28px rgba(80,140,255,1);
}

.section {
    margin-top: 25px;
}

.section h2 {
    margin-bottom: 10px;
}

.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 12px;
    box-shadow: 0 0 16px rgba(0,150,255,0.4);
}

.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.undo-bar {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}

.undo-btn {
    padding: 12px 18px;
    border-radius: 14px;
    border: none;
    background: #ffaa00;
    color: black;
    font-weight: bold;
    box-shadow: 0 0 12px rgba(255,170,0,0.7);
}
</style>

</head>

<body>

<div class="container">

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="players" placeholder="Total Players">

<button class="btn" onclick="calculate()">Calculate</button>

<div class="section">
    <h2>Totals</h2>
    <div id="totals"></div>
</div>

<div class="section">
    <h2>History</h2>
    <div id="history"></div>
</div>

<div class="undo-bar">
    <button class="undo-btn" onclick="undoTotals()">Undo Totals</button>
    <button class="undo-btn" onclick="undoHistory()">Undo History</button>
</div>

</div>

<script>
function calculate(){
    let pot = Number(document.getElementById("pot").value);
    let fee = Number(document.getElementById("fee").value);
    let players = Number(document.getElementById("players").value);

    if(!pot || !fee || !players){
        alert("Enter valid numbers");
        return;
    }

    let payout = pot / players;
    let profit = payout - fee;
    let roi = (profit / fee) * 100;

    let html =
    '<div class="card">' +
    '<b>Prospects</b><br><br>' +
    'Payout: $' + payout.toFixed(2) + '<br>' +
    '<span class="' + (profit >= 0 ? 'profit' : 'loss') + '">' +
    'Profit: $' + profit.toFixed(2) + '</span><br>' +
    '<span class="roi">ROI: ' + roi.toFixed(1) + '%</span>' +
    '</div>';

    document.getElementById("totals").innerHTML =
        html + document.getElementById("totals").innerHTML;

    document.getElementById("history").innerHTML =
        html + document.getElementById("history").innerHTML;
}

function undoTotals(){
    let container = document.getElementById("totals");
    if(container.firstChild){
        container.removeChild(container.firstChild);
    }
}

function undoHistory(){
    let container = document.getElementById("history");
    if(container.firstChild){
        container.removeChild(container.firstChild);
    }
}
</script>

</body>
</html>
