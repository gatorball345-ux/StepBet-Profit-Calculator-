<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:-apple-system;
}

.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}

/* TITLE */
.title{
  text-align:center;
  color:#fb923c;
  font-size:24px;
  text-shadow:
    0 0 10px rgba(251,146,60,0.7),
    0 0 25px rgba(251,146,60,0.4);
}

/* INPUT */
input{
  width:100%;
  margin-top:12px;
  padding:16px;
  border-radius:18px;
  border:none;
  background:#0f172a;
  color:white;
  text-align:center;
}

/* BUTTONS */
button{
  width:100%;
  margin-top:12px;
  padding:16px;
  border:none;
  border-radius:18px;
  color:white;
  font-weight:bold;
}

.calc{
  background:#2563eb;
  box-shadow:0 0 20px rgba(37,99,235,0.7);
}

.clear{
  background:#7f1d1d;
  box-shadow:0 0 15px rgba(127,29,29,0.7);
}

/* TOGGLE */
.toggle{
  display:flex;
  margin-top:12px;
  border-radius:18px;
  overflow:hidden;
  background:#111827;
}
.toggle div{
  flex:1;
  padding:12px;
  text-align:center;
  color:#6b7280;
}
.active{
  background:#16a34a;
  color:white;
}

/* SECTIONS */
.section{
  margin-top:18px;
}

/* CARD */
.card{
  margin-top:10px;
  padding:16px;
  background:#0f172a;
  border-radius:18px;
}

/* HISTORY */
.history-container{
  max-height:300px;
  overflow-y:auto;
}

.wrapper{
  position:relative;
  overflow:hidden;
  margin-top:12px;
}

.delete-bg{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:100%;
  background:#b91c1c;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding-right:20px;
  font-weight:bold;
  opacity:0; /* FIX: hide by default */
}

.history-item{
  position:relative;
  padding:16px;
  background:#0f172a;
  border-radius:18px;
  transition:transform .2s;
}

/* COLORS */
.green{color:#22c55e;}
.yellow{color:#facc15;}

</style>
</head>

<body>

<div class="container">

<h2 class="title">StepCat Calculator</h2>

<!-- ENTRIES -->
<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Winners">

<button class="clear" onclick="clearEntries()">Clear Entries</button>

<!-- TOGGLE -->
<div class="toggle">
  <div id="nonBtn" class="active">Non-Member</div>
  <div id="memBtn">Member</div>
</div>

<button class="calc" onclick="calculate()">Calculate</button>

<!-- TOTALS -->
<div class="section">
  <div style="display:flex;justify-content:space-between;">
    <span>Totals</span>
    <button class="clear" style="width:auto;padding:6px 12px;" onclick="clearTotals()">Clear</button>
  </div>
  <div id="result" class="card"></div>
</div>

<!-- HISTORY -->
<div class="section">
  <div style="display:flex;justify-content:space-between;">
    <span>Recent History</span>
    <button class="clear" style="width:auto;padding:6px 12px;" onclick="clearHistory()">Clear</button>
  </div>

  <div id="history" class="history-container"></div>
</div>

</div>

<script>
let isMember=false;
let historyData=JSON.parse(localStorage.getItem("hist")||"[]");

/* TOGGLE */
nonBtn.onclick=()=>setMode(false);
memBtn.onclick=()=>setMode(true);

function setMode(v){
  isMember=v;
  nonBtn.classList.toggle("active",!v);
  memBtn.classList.toggle("active",v);
}

/* CALCULATE */
function calculate(){
  let p=+pot.value,f=+fee.value,w=+winners.value;
  if(!p||!f||!w) return;

  let payout=p/w;
  if(!isMember) payout*=0.85;

  let profit=payout-f;
  let roi=(profit/f)*100;

  result.innerHTML=`
    <div>Payout: $${payout.toFixed(2)}</div>
    <div class="green">Profit: $${profit.toFixed(2)}</div>
    <div class="yellow">ROI: ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({payout,profit,roi,isMember});
  localStorage.setItem("hist",JSON.stringify(historyData));

  render();
}

/* RENDER HISTORY */
function render(){
  history.innerHTML="";

  historyData.forEach((h,i)=>{
    let wrap=document.createElement("div");
    wrap.className="wrapper";

    let bg=document.createElement("div");
    bg.className="delete-bg";
    bg.innerText="Delete";

    let card=document.createElement("div");
    card.className="history-item";

    card.innerHTML=`
      <div><b>${h.isMember?"Member":"Non-Member"}</b></div>
      <div>Payout: $${h.payout.toFixed(2)}</div>
      <div class="green">Profit: $${h.profit.toFixed(2)}</div>
      <div class="yellow">ROI: ${h.roi.toFixed(1)}%</div>
    `;

    addSwipe(card,bg,i);

    wrap.appendChild(bg);
    wrap.appendChild(card);
    history.appendChild(wrap);
  });
}

/* SWIPE */
function addSwipe(card,bg,index){
  let start=0,move=0;

  card.addEventListener("touchstart",e=>{
    start=e.touches[0].clientX;
  });

  card.addEventListener("touchmove",e=>{
    move=e.touches[0].clientX-start;

    if(move<0){
      card.style.transform=`translateX(${move}px)`;
      bg.style.opacity=1; /* show only when swiping */
    }
  });

  card.addEventListener("touchend",()=>{
    if(move<-80){
      historyData.splice(index,1);
      localStorage.setItem("hist",JSON.stringify(historyData));
      render();
    } else {
      card.style.transform="translateX(0)";
      bg.style.opacity=0;
    }
  });
}

/* CLEAR FUNCTIONS */
function clearEntries(){
  pot.value=fee.value=winners.value="";
}
function clearTotals(){
  result.innerHTML="";
}
function clearHistory(){
  historyData=[];
  localStorage.removeItem("hist");
  render();
}

render();
</script>

</body>
</html>
