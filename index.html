<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>

/* ===== BASE ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
}

.container {
    padding: 20px;
}

/* ===== TITLE ===== */
.title {
    text-align: center;
    font-size: 28px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
    margin-bottom: 20px;
}

/* ===== INPUTS ===== */
.input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    font-size: 16px;
    text-align: center;
}

/* ===== TOP ROW (CLEAR ENTRIES POSITION) ===== */
.top-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
}

/* ===== BUTTONS ===== */
.btn {
    border: none;
    cursor: pointer;
    border-radius: 20px;
    font-size: 16px;
    color: white;
}

/* CLEAR ENTRIES BUTTON */
.btn.red {
    background: #a02222;
    padding: 10px 16px;
    box-shadow: 0 0 12px rgba(255,50,50,0.4);
}

.btn.red:hover {
    box-shadow: 0 0 20px rgba(255,50,50,0.7);
}

/* CALCULATE BUTTON */
.btn.blue {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    background: #3c66c2;
    box-shadow: 0 0 14px rgba(80,140,255,0.5);
}

.btn.blue:hover {
    box-shadow: 0 0 22px rgba(80,140,255,0.8);
}

/* ===== TOGGLE ===== */
.toggle {
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #0f1e33;
    margin-top: 10px;
    box-shadow: 0 0 10px rgba(0,150,255,0.15); /* ambient glow */
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white; /* ALWAYS WHITE */
    font-size: 15px;
    transition: all 0.25s ease;
}

/* ACTIVE STATES */
.active {
    background: #1db954 !important;
    box-shadow: 0 0 18px rgba(29,185,84,0.7);
}

/* ===== SECTIONS ===== */
.section-title {
    font-size: 20px;
    margin: 20px 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ===== CLEAR BUTTON (SMALL) ===== */
.small-btn {
    padding: 10px 16px;
    border-radius: 14px;
    border: none;
    background: #a02222;
    color: white;
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
    margin-right: 8px;
    margin-top: -4px; /* slight raise */
}

/* ===== CARD ===== */
.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 14px;
}

/* ===== COLORS ===== */
.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

/* ===== HISTORY SCROLL ===== */
.history {
    max-height: 300px;
    overflow-y: auto;
}

</style>
</head>

<body>

<div class="container">

<div class="title">StepCat Calculator</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<!-- CLEAR ENTRIES (TOP RIGHT) -->
<div class="top-row">
    <button class="btn red" onclick="clearInputs()">Clear Entries</button>
</div>

<!-- TOGGLE -->
<div class="toggle">
    <button id="nonBtn" class="active" onclick="setMode('non')">Non-Member</button>
    <button id="memBtn" onclick="setMode('mem')">Member</button>
</div>

<button class="btn blue" onclick="calculate()">Calculate</button>

<!-- TOTALS -->
<div class="section-title">
    Totals
    <button class="small-btn" onclick="clearTotals()">Clear</button>
</div>

<div id="totals"></div>

<!-- HISTORY -->
<div class="section-title">
    Recent History
    <button class="small-btn" onclick="clearHistory()">Clear</button>
</div>

<div id="history" class="history"></div>

</div>

<script>

/* ===== STATE ===== */
let mode = "non";

/* ===== MODE SWITCH ===== */
function setMode(type){
    mode = type;

    document.getElementById("nonBtn").classList.remove("active");
    document.getElementById("memBtn").classList.remove("active");

    if(type === "non"){
        document.getElementById("nonBtn").classList.add("active");
    } else {
        document.getElementById("memBtn").classList.add("active");
    }
}

/* ===== CALCULATE ===== */
function calculate(){
    let pot = parseFloat(document.getElementById("pot").value);
    let fee = parseFloat(document.getElementById("fee").value);
    let winners = parseFloat(document.getElementById("winners").value);

    if(!pot || !fee || !winners) return;

    let payout = pot / winners;

    // Member boost
    if(mode === "mem"){
        payout *= 1.1368;
    }

    let profit = payout - fee;
    let roi = (profit / fee) * 100;

    let label = mode === "mem" ? "Member Game" : "Non-Member Game";

    let card = `
    <div class="card">
        <b>${label}</b><br><br>
        Payout: $${payout.toFixed(2)}<br>
        <span class="${profit >= 0 ? 'profit' : 'loss'}">
        Profit: $${profit.toFixed(2)}
        </span><br>
        <span class="roi">
        ROI: ${roi.toFixed(1)}%
        </span>
    </div>
    `;

    document.getElementById("totals").innerHTML = card;

    let history = document.getElementById("history");
    history.innerHTML = card + history.innerHTML;
}

/* ===== CLEAR FUNCTIONS ===== */
function clearInputs(){
    document.getElementById("pot").value = "";
    document.getElementById("fee").value = "";
    document.getElementById("winners").value = "";
}

function clearTotals(){
    document.getElementById("totals").innerHTML = "";
}

function clearHistory(){
    document.getElementById("history").innerHTML = "";
}

</script>

</body>
</html>
