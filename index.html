<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:-apple-system;
}

.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}

.title{
  text-align:center;
  color:#fb923c;
  font-size:22px;
  text-shadow:0 0 12px rgba(251,146,60,0.5);
}

/* Inputs */
input{
  width:100%;
  margin-top:10px;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#0f172a;
  color:white;
  text-align:center;
}

/* Toggle */
.toggle{
  display:flex;
  margin-top:12px;
  border-radius:14px;
  overflow:hidden;
  background:#111827;
}
.toggle div{
  flex:1;
  padding:10px;
  text-align:center;
  color:#6b7280;
}
.active{
  background:#16a34a;
  color:white;
}

/* Buttons */
button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:16px;
  color:white;
  font-weight:bold;
}

.calc{ background:#2563eb; }
.clear{ background:#7f1d1d; }

.section{
  margin-top:16px;
}

/* Totals */
.card{
  background:#0f172a;
  padding:14px;
  border-radius:14px;
  margin-top:10px;
}

/* History */
.history-item{
  background:#0f172a;
  padding:14px;
  border-radius:14px;
  margin-top:12px;
}

.green{color:#22c55e;}
.yellow{color:#facc15;}
</style>
</head>

<body>

<div class="container">

<h2 class="title">StepCat Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Winners">

<button class="clear" onclick="clearEntries()">Clear Entries</button>

<div class="toggle">
  <div id="nonBtn" class="active">Non-Member</div>
  <div id="memBtn">Member</div>
</div>

<button class="calc" onclick="calculate()">Calculate</button>

<div class="section">
  <div style="display:flex;justify-content:space-between;">
    <span>Totals</span>
    <button class="clear" style="width:auto;padding:6px 10px;" onclick="clearTotals()">Clear</button>
  </div>
  <div id="result" class="card"></div>
</div>

<div class="section">
  <div style="display:flex;justify-content:space-between;">
    <span>Recent History</span>
    <button class="clear" style="width:auto;padding:6px 10px;" onclick="clearHistory()">Clear</button>
  </div>
  <div id="history"></div>
</div>

</div>

<script>
let isMember=false;
let historyData=JSON.parse(localStorage.getItem("hist")||"[]");

nonBtn.onclick=()=>setMode(false);
memBtn.onclick=()=>setMode(true);

function setMode(v){
  isMember=v;
  nonBtn.classList.toggle("active",!v);
  memBtn.classList.toggle("active",v);
}

function calculate(){
  let p=+pot.value,f=+fee.value,w=+winners.value;
  if(!p||!f||!w) return;

  let payout=p/w;
  if(!isMember) payout*=0.85;

  let profit=payout-f;
  let roi=(profit/f)*100;

  result.innerHTML=`
  <div>Payout: $${payout.toFixed(2)}</div>
  <div class="green">Profit: $${profit.toFixed(2)}</div>
  <div class="yellow">ROI: ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({payout,profit,roi,isMember});
  localStorage.setItem("hist",JSON.stringify(historyData));

  render();
}

function render(){
  history.innerHTML="";
  historyData.forEach(h=>{
    let d=document.createElement("div");
    d.className="history-item";
    d.innerHTML=`
    ${h.isMember?"Member":"Non-Member"}<br>
    $${h.payout.toFixed(2)} | $${h.profit.toFixed(2)} | ${h.roi.toFixed(1)}%
    `;
    history.appendChild(d);
  });
}

function clearEntries(){pot.value=fee.value=winners.value="";}
function clearTotals(){result.innerHTML="";}
function clearHistory(){historyData=[];localStorage.removeItem("hist");render();}

render();
</script>

</body>
</html>
