<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
margin:0;
font-family:Arial;
background:#020c1b;
color:white;
}

.container {
max-width:420px;
margin:auto;
padding:15px;
}

.header {
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.title {
font-size:22px;
color:#ff9d3c;
}

.input {
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:none;
background:#0c1f3a;
color:white;
text-align:center;
}

.btn {
padding:10px;
border:none;
border-radius:10px;
color:white;
margin-top:6px;
}

.blue {background:#3c66c2;width:100%;}
.red {background:#a02222;}

.toggle {
display:flex;
margin-top:6px;
}

.toggle button {
flex:1;
padding:10px;
border:none;
background:#0f1e33;
color:white;
}

.toggle .active {
background:#1db954;
}

.note {
text-align:center;
font-size:13px;
margin-top:6px;
opacity:0.8;
}

.card {
background:#0c1f3a;
padding:12px;
border-radius:10px;
margin-top:8px;
}

.empty {
opacity:0.6;
text-align:center;
margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">StepCat</div>
<button class="btn red" id="clearBtn">Clear Entries</button>
</div>

<input id="name" class="input" placeholder="Game Name (optional)">

<input id="start" type="date" class="input">
<div class="note">Game Start Date (optional)</div>

<input id="end" type="date" class="input">
<div class="note">Game End Date (optional)</div>

<input id="pot" class="input" placeholder="Total Pot (required)">
<input id="fee" class="input" placeholder="Entry Fee (required)">
<input id="win" class="input" placeholder="Winners (required)">

<div class="toggle">
<button id="nonBtn" class="active">Non-Member</button>
<button id="memBtn">Member</button>
</div>

<div id="modeNote" class="note">
Non-member: 15% platform fee applied
</div>

<button class="btn blue" id="calcBtn">Calculate</button>

<h4>Totals</h4>
<div id="totals"></div>

<h4>History</h4>
<div id="history"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let mode = "non";

const potEl = document.getElementById("pot");
const feeEl = document.getElementById("fee");
const winEl = document.getElementById("win");
const nameEl = document.getElementById("name");
const startEl = document.getElementById("start");
const endEl = document.getElementById("end");

const totalsDiv = document.getElementById("totals");
const historyDiv = document.getElementById("history");

const nonBtn = document.getElementById("nonBtn");
const memBtn = document.getElementById("memBtn");
const modeNote = document.getElementById("modeNote");

const calcBtn = document.getElementById("calcBtn");
const clearBtn = document.getElementById("clearBtn");

let totals = JSON.parse(localStorage.getItem("totals") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

function save(){
localStorage.setItem("totals", JSON.stringify(totals));
localStorage.setItem("history", JSON.stringify(history));
}

/* TOGGLE */
nonBtn.onclick = ()=>{
mode="non";
nonBtn.classList.add("active");
memBtn.classList.remove("active");
modeNote.innerText="Non-member: 15% platform fee applied";
};

memBtn.onclick = ()=>{
mode="mem";
memBtn.classList.add("active");
nonBtn.classList.remove("active");
modeNote.innerText="Member: full payout (no fee)";
};

/* CALCULATE */
calcBtn.onclick = function(){

let p = parseFloat(potEl.value);
let f = parseFloat(feeEl.value);
let w = parseFloat(winEl.value);

if(isNaN(p) || isNaN(f) || isNaN(w)){
alert("Enter valid numbers");
return;
}

let member = p / w;
let non = member * 0.85;

let payout = (mode==="mem") ? member : non;
let profit = payout - f;
let roi = (profit / f) * 100;

let entry = {
name: nameEl.value || "Game",
start: startEl.value || "",
end: endEl.value || "",
mode,
payout,
profit,
roi
};

totals.unshift(entry);
history.unshift(entry);

if(totals.length > 5){
history.unshift(totals.pop());
}

save();
render();
};

/* CLEAR INPUTS */
clearBtn.onclick = ()=>{
nameEl.value="";
startEl.value="";
endEl.value="";
potEl.value="";
feeEl.value="";
winEl.value="";
};

/* RENDER */
function createCard(e){
let label = e.mode==="mem" ? "Member Game" : "Non-Member Game";

return `
<div class="card">
<b>${e.name}</b><br>
${label}<br>
${e.start} ${e.end ? "→ "+e.end : ""}<br><br>
Payout: $${e.payout.toFixed(2)}<br>
Profit: $${e.profit.toFixed(2)}<br>
ROI: ${e.roi.toFixed(1)}%
</div>`;
}

function render(){
totalsDiv.innerHTML = totals.length
? totals.map(createCard).join("")
: "<div class='empty'>Totals empty</div>";

historyDiv.innerHTML = history.length
? history.map(createCard).join("")
: "<div class='empty'>History empty</div>";
}

render();

});
</script>

</body>
</html>
