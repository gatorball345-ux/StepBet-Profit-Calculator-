<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 20px 0;
}

h2 { text-align: center; }

input, button, #result, .history-wrapper {
  width: 92%;
  margin: auto;
  display: block;
}

input {
  padding: 16px;
  margin-top: 12px;
  background: #111827;
  border: none;
  border-radius: 14px;
  color: white;
  text-align: center;
}

button {
  padding: 16px;
  margin-top: 16px;
  background: #22c55e;
  border: none;
  border-radius: 14px;
  color: white;
  font-weight: bold;
}

#result {
  margin-top: 20px;
  padding: 18px;
  background: #111827;
  border-radius: 14px;
}

.label { color: #22c55e; }

/* SWIPE */
.history-wrapper {
  position: relative;
  overflow: hidden;
  margin-top: 10px;
}

.delete-bg {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 100%;
  background: #ef4444;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 20px;
  font-weight: bold;
}

.history-item {
  background: #111827;
  padding: 14px;
  border-radius: 12px;
  position: relative;
  z-index: 2;
  transition: transform 0.2s ease;
}

.clear-btn { background: #ef4444; }

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  width: 80%;
  max-width: 300px;
  text-align: center;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.modal-buttons button {
  flex: 1;
}

.cancel-btn {
  background: #374151;
}

.confirm-btn {
  background: #ef4444;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<h3 style="width:92%; margin:auto;">Recent</h3>
<div id="history"></div>

<button class="clear-btn" onclick="clearHistory()">Clear History</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div>Delete this entry?</div>
    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="confirm-btn" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];
let deleteIndex = null;
let activeElement = null;

/* CALCULATE */
function calculate() {
  const pot = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!pot || !fee || !winners) return alert("Enter valid numbers");

  const payout = pot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;

  document.getElementById("result").innerHTML = `
    <div><span class="label">Payout:</span> $${payout.toFixed(2)}</div>
    <div><span class="label">Profit:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
    <div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
  `;

  history.unshift({ payout, profit, roi });
  localStorage.setItem("stepbetHistory", JSON.stringify(history));
  renderHistory();
}

/* SWIPE */
function addSwipe(element, index) {
  let startX = 0;
  let currentX = 0;

  element.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

  element.addEventListener("touchmove", e => {
    currentX = e.touches[0].clientX;
    let diff = currentX - startX;

    if (diff < 0) {
      element.style.transform = `translateX(${diff}px)`;
    }
  });

  element.addEventListener("touchend", () => {
    let diff = currentX - startX;

    if (diff < -100) {
      openModal(index, element);
    } else {
      element.style.transform = "translateX(0)";
    }
  });
}

/* MODAL CONTROL */
function openModal(index, element) {
  deleteIndex = index;
  activeElement = element;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  if (activeElement) {
    activeElement.style.transform = "translateX(0)";
  }
}

function confirmDelete() {
  if (deleteIndex !== null) {
    history.splice(deleteIndex, 1);
    localStorage.setItem("stepbetHistory", JSON.stringify(history));
    renderHistory();
  }
  closeModal();
}

/* HISTORY */
function renderHistory() {
  const container = document.getElementById("history");
  container.innerHTML = "";

  history.forEach((item, index) => {

    const wrapper = document.createElement("div");
    wrapper.className = "history-wrapper";

    const bg = document.createElement("div");
    bg.className = "delete-bg";
    bg.textContent = "DELETE";

    const itemDiv = document.createElement("div");
    itemDiv.className = "history-item";

    itemDiv.innerHTML = `
      <span class="label">Payout:</span> $${item.payout.toFixed(2)} |
      <span class="label">Profit:</span> ${(item.profit>=0?"+":"")}$${item.profit.toFixed(2)} |
      <span class="label">ROI:</span> ${item.roi.toFixed(1)}%
    `;

    addSwipe(itemDiv, index);

    wrapper.appendChild(bg);
    wrapper.appendChild(itemDiv);
    container.appendChild(wrapper);
  });
}

/* CLEAR */
function clearHistory() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
}

renderHistory();
</script>

</body>
</html>
