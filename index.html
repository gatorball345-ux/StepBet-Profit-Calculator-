<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px;
}

/* INPUTS */
input {
  width:100%;
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:12px;
  color:white;
  text-align:center;
}

/* 🔥 FIXED TOGGLE */
.toggle {
  margin-top:16px;
  background:#111827;
  border-radius:12px;
  position:relative;
  display:flex;
  height:44px;
  cursor:pointer;
}

.toggle-slider {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:48%;
  background:#22c55e;
  border-radius:10px;
  transition:0.25s;
  z-index:1;
}

.toggle-label {
  flex:1;
  text-align:center;
  line-height:44px;
  z-index:2;
  color:#6b7280;
}

.toggle-label.active {
  color:white;
  font-weight:bold;
}

/* BUTTONS */
.button-row {
  display:flex;
  gap:10px;
  margin-top:16px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.clear-btn { background:#374151; }
.calc-btn { background:#2563eb; }

/* RESULT */
#result {
  margin-top:20px;
  padding:16px;
  background:#111827;
  border-radius:12px;
}

/* HISTORY */
.history-item {
  margin-top:10px;
  padding:12px;
  background:#111827;
  border-radius:10px;
}

/* TEXT */
.fee-note {
  margin-top:8px;
  font-size:12px;
  color:#9ca3af;
  text-align:center;
}

/* 🔥 CLEAR MODAL */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box {
  background:#111827;
  padding:20px;
  border-radius:14px;
  width:85%;
  max-width:300px;
  text-align:center;
}

.modal-box button {
  margin-top:10px;
  width:100%;
  background:#374151;
}

.checkbox {
  margin-top:10px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="app">

<h2 style="text-align:center;">StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<div class="toggle" id="toggle">
  <div class="toggle-slider" id="slider"></div>
  <div id="nonLabel" class="toggle-label active">Non-Member</div>
  <div id="memLabel" class="toggle-label">Member</div>
</div>

<div class="fee-note" id="feeNote"></div>

<div class="button-row">
  <button class="clear-btn" id="clearBtn">Clear Inputs</button>
  <button class="calc-btn" id="calcBtn">Calculate</button>
</div>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

</div>

<!-- CLEAR MODAL -->
<div id="clearModal" class="modal">
  <div class="modal-box">
    <div>What would you like to clear?</div>

    <button onclick="handleClear('inputs')">Clear Inputs</button>
    <button onclick="handleClear('history')">Clear History</button>
    <button onclick="handleClear('all')">Clear All</button>

    <div class="checkbox">
      <input type="checkbox" id="rememberChoice">
      Remember my choice
    </div>

    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
window.onload = function() {

let isMember = false;
let historyData = [];

/* ELEMENTS */
const pot = document.getElementById("pot");
const fee = document.getElementById("fee");
const winners = document.getElementById("winners");

const result = document.getElementById("result");
const history = document.getElementById("history");

const toggle = document.getElementById("toggle");
const slider = document.getElementById("slider");
const nonLabel = document.getElementById("nonLabel");
const memLabel = document.getElementById("memLabel");

const feeNote = document.getElementById("feeNote");

const clearBtn = document.getElementById("clearBtn");
const calcBtn = document.getElementById("calcBtn");

const modal = document.getElementById("clearModal");
const rememberBox = document.getElementById("rememberChoice");

/* TOGGLE */
toggle.onclick = () => {
  isMember = !isMember;

  slider.style.left = isMember ? "50%" : "4px";

  nonLabel.classList.toggle("active", !isMember);
  memLabel.classList.toggle("active", isMember);

  updateText();
};

function updateText() {
  feeNote.innerText = isMember
    ? "Member games: no platform fee is deducted before payout calculations"
    : "Non-member games: 15% is deducted from the total pot before payout calculations";
}

/* CALCULATE */
calcBtn.onclick = () => {

  let p = parseFloat(pot.value);
  let f = parseFloat(fee.value);
  let w = parseFloat(winners.value);

  if (!p || !f || !w) return alert("Enter valid numbers");

  let payout = p / w;
  if (!isMember) payout *= 0.85;

  let profit = payout - f;
  let roi = (profit / f) * 100;

  result.innerHTML = `
    <div>Payout: $${payout.toFixed(2)}</div>
    <div>Profit: $${profit.toFixed(2)}</div>
    <div>ROI: ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({payout,profit,roi,isMember});
  renderHistory();
};

/* HISTORY */
function renderHistory() {
  history.innerHTML = "";

  historyData.forEach(item => {
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      ${item.isMember ? "Member" : "Non-Member"}<br>
      Payout: $${item.payout.toFixed(2)} |
      Profit: $${item.profit.toFixed(2)} |
      ROI: ${item.roi.toFixed(1)}%
    `;

    history.appendChild(div);
  });
}

/* CLEAR SYSTEM */
clearBtn.onclick = () => {
  let saved = localStorage.getItem("clearPref");

  if (saved) {
    handleClear(saved);
  } else {
    modal.style.display = "flex";
  }
};

function handleClear(type) {

  if (rememberBox.checked) {
    localStorage.setItem("clearPref", type);
  }

  if (type === "inputs") {
    pot.value = "";
    fee.value = "";
    winners.value = "";
  }

  if (type === "history") {
    historyData = [];
    renderHistory();
  }

  if (type === "all") {
    pot.value = "";
    fee.value = "";
    winners.value = "";
    historyData = [];
    renderHistory();
  }

  closeModal();
}

function closeModal() {
  modal.style.display = "none";
}

/* INIT */
updateText();

};
</script>

</body>
</html>
