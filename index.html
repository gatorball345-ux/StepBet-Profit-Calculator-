<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  width: 100%;
  max-width: 420px;
  padding: 20px 18px;
  margin: 40px auto;
  box-sizing: border-box;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  background: #111827;
  border: none;
  color: white;
  border-radius: 12px;
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  background: #22c55e;
  border: none;
  border-radius: 14px;
  margin-top: 14px;
  color: white;
  font-weight: bold;
}

#result {
  margin-top: 20px;
  padding: 18px;
  background: #111827;
  border-radius: 14px;
  line-height: 1.8;
}

.label {
  color: #22c55e;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

</div>

<script>
function calculate() {

  const pot = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!pot || !fee || !winners) {
    alert("Enter valid numbers");
    return;
  }

  const payout = pot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;
  const breakEvenPlayers = Math.round(pot / fee);

  const resultDiv = document.getElementById("result");

  // 🔥 Build everything FIRST (not line-by-line)
  const container = document.createElement("div");

  function makeRow(label, value) {
    const row = document.createElement("div");

    const labelSpan = document.createElement("span");
    labelSpan.className = "label";
    labelSpan.textContent = label + ": ";

    const valueSpan = document.createElement("span");
    valueSpan.textContent = value;

    row.appendChild(labelSpan);
    row.appendChild(valueSpan);

    return row;
  }

  container.appendChild(makeRow("Payout Per Player", "$" + payout.toFixed(2)));
  container.appendChild(makeRow("Profit / Loss", (profit >= 0 ? "+" : "") + "$" + profit.toFixed(2)));
  container.appendChild(makeRow("ROI", roi.toFixed(1) + "%"));

  const spacer = document.createElement("div");
  spacer.style.marginTop = "10px";
  container.appendChild(spacer);

  container.appendChild(makeRow("Break-Even Players", breakEvenPlayers));

  // 🔥 Replace everything ONCE
  resultDiv.innerHTML = "";
  resultDiv.appendChild(container);
}
</script>

</body>
</html>
