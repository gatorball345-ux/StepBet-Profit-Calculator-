<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  background: #020617;
  color: white;
  font-family: system-ui;
  margin: 0;
}

.app {
  width: 100%;
  max-width: 420px;
  padding: 20px 18px;
  margin: 40px auto 0 auto;
  box-sizing: border-box;
}

h2 { text-align: center; }

/* Inputs */
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  background: #111827;
  border: none;
  color: white;
  border-radius: 12px;
  text-align: center;
  box-sizing: border-box;
}

/* Buttons */
button {
  width: 100%;
  padding: 16px;
  background: #22c55e;
  border: none;
  border-radius: 14px;
  margin-top: 14px;
  color: white;
  font-weight: bold;
}

.clear-btn { background: #ef4444; }

/* Result */
#result {
  margin-top: 20px;
  padding: 18px;
  background: #111827;
  border-radius: 14px;
  text-align: left;
  line-height: 1.6;
  font-size: 15px;
}

/* History */
.history-item {
  background: #111827;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="app">

<h2>StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<button id="calcBtn">Calculate</button>

<div id="result"></div>

<h3>Recent</h3>
<div id="history"></div>

<button class="clear-btn" id="clearBtn">Clear History</button>

</div>

<script>
let history = JSON.parse(localStorage.getItem("stepbetHistory")) || [];

document.getElementById("calcBtn").addEventListener("click", function() {

  const pot = parseFloat(document.getElementById("pot").value);
  const fee = parseFloat(document.getElementById("fee").value);
  const winners = parseFloat(document.getElementById("winners").value);

  if (!pot || !fee || !winners) return;

  const payout = pot / winners;
  const profit = payout - fee;
  const roi = (profit / fee) * 100;
  const breakEvenPlayers = Math.round(pot / fee);

  document.getElementById("result").innerHTML =
    "Payout Per Player: $" + payout.toFixed(2) + "<br><br>" +
    "Profit / Loss: " + (profit >= 0 ? "+" : "") + "$" + profit.toFixed(2) + "<br>" +
    "ROI: " + roi.toFixed(1) + "%<br><br>" +
    "Break-Even Players: " + breakEvenPlayers;

  history.unshift({
    payout: payout,
    profit: profit,
    roi: roi
  });

  localStorage.setItem("stepbetHistory", JSON.stringify(history));
  renderHistory();
});

function renderHistory() {
  const container = document.getElementById("history");
  container.innerHTML = "";

  history.forEach(function(item) {
    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML =
      "Payout: $" + item.payout.toFixed(2) + " | " +
      (item.profit >= 0 ? "+" : "") + "$" + item.profit.toFixed(2) + " | " +
      item.roi.toFixed(1) + "%";

    container.appendChild(div);
  });
}

document.getElementById("clearBtn").addEventListener("click", function() {
  history = [];
  localStorage.removeItem("stepbetHistory");
  renderHistory();
});

renderHistory();
</script>

</body>
</html>
