<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepCat Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020c1b;
    color: white;
    overflow-x: hidden;
    touch-action: manipulation;
}

.container { padding: 20px; }

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 26px;
    color: #ff9d3c;
    text-shadow: 0 0 15px rgba(255,150,50,0.6);
}

/* SMALLER CLEAR BUTTON */
.header-clear {
    background: #a02222;
    border: none;
    padding: 8px 12px;
    font-size: 12px;
    border-radius: 12px;
    color: white;
    box-shadow: 0 0 8px rgba(255,0,0,0.4);
}

/* INPUTS */
.input {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border-radius: 16px;
    border: none;
    background: #0c1f3a;
    color: white;
    text-align: center;
}

/* TOGGLE */
.toggle {
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #0f1e33;
    margin-top: 10px;
    box-shadow: 0 0 10px rgba(0,150,255,0.15);
}

.toggle button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
}

.active {
    background: #1db954 !important;
    box-shadow: 0 0 18px rgba(29,185,84,0.7);
}

/* CALCULATE */
.calculate {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border-radius: 20px;
    border: none;
    background: #3c66c2;
    color: white;
    box-shadow: 0 0 14px rgba(80,140,255,0.5);
}

/* SECTION */
.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
}

/* BUTTONS */
.btn {
    padding: 10px 14px;
    border-radius: 14px;
    border: none;
    color: white;
}

.clear-btn {
    background: #a02222;
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
}

.load-btn {
    background: #ff9d3c;
    box-shadow: 0 0 12px rgba(255,150,50,0.6);
}

/* CARD */
.card {
    background: #0c1f3a;
    padding: 16px;
    border-radius: 20px;
    margin-top: 10px;
}

.profit { color: #3cff7c; }
.loss { color: #ff4c4c; }
.roi { color: #ffd24c; }

.history {
    max-height: 300px;
    overflow-y: auto;
}

/* NOTICE TEXT */
.notice {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
    <div class="title">StepCat Calculator</div>
    <button class="header-clear" onclick="clearInputs()">Clear</button>
</div>

<input class="input" id="pot" placeholder="Total Pot">
<input class="input" id="fee" placeholder="Entry Fee">
<input class="input" id="winners" placeholder="Winners">

<div class="toggle">
    <button id="nonBtn" class="active" onclick="setMode('non')">Non-Member</button>
    <button id="memBtn" onclick="setMode('mem')">Member</button>
</div>

<button class="calculate" onclick="calculate()">Calculate</button>

<div id="notice" class="notice"></div>

<!-- TOTALS -->
<div class="section-title">
    <div>Totals</div>
    <div>
        <button class="btn load-btn" onclick="loadLast()">Load</button>
        <button class="btn clear-btn" onclick="clearTotals()">Clear</button>
    </div>
</div>

<div id="totals"></div>

<!-- HISTORY -->
<div class="section-title">
    <div>Recent History</div>
    <div>
        <button class="btn load-btn" onclick="loadHistory()">Load</button>
        <button class="btn clear-btn" onclick="clearHistory()">Clear</button>
    </div>
</div>

<div id="history" class="history"></div>

</div>

<script>

let mode = "non";

/* MODE */
function setMode(type){
    mode = type;

    nonBtn.classList.remove("active");
    memBtn.classList.remove("active");

    if(type==="non") {
        nonBtn.classList.add("active");
        notice.innerText = "Non-member: 15% is taken from the pot before payout is calculated.";
    } else {
        memBtn.classList.add("active");
        notice.innerText = "Member: No fee is taken; full pot is distributed.";
    }
}

/* FORMAT */
function money(n){
    return "$" + n.toLocaleString(undefined,{minimumFractionDigits:2});
}
function roi(n){
    return n.toFixed(1)+"%";
}

/* CALCULATE */
function calculate(){
    let pot=parseFloat(potEl.value);
    let fee=parseFloat(feeEl.value);
    let w=parseFloat(winEl.value);
    if(!pot||!fee||!w)return;

    let member=pot/w;
    let non=member*0.85;
    let payout=mode==="mem"?member:non;

    let profit=payout-fee;
    let r=(profit/fee)*100;

    let data={label:mode==="mem"?"Member Game":"Non-Member Game",payout,profit,r};

    renderTotals(data);
    saveHistory(data);
}

/* CARD */
function cardHTML(d){
return `
<div class="card">
<b>${d.label}</b><br><br>
Payout: ${money(d.payout)}<br>
<span class="${d.profit>=0?'profit':'loss'}">
Profit: ${money(d.profit)}
</span><br>
<span class="roi">
ROI: ${roi(d.r)}
</span>
</div>`;
}

/* TOTALS */
function renderTotals(d){
    totals.innerHTML=cardHTML(d);
}

/* STORAGE */
function saveHistory(d){
    let h=JSON.parse(localStorage.getItem("history"))||[];
    h.unshift(d);
    localStorage.setItem("history",JSON.stringify(h));
}

/* LOAD LAST */
function loadLast(){
    let h=JSON.parse(localStorage.getItem("history"));
    if(!h||h.length===0)return;
    renderTotals(h[0]);
}

/* LOAD HISTORY */
function loadHistory(){
    let h=JSON.parse(localStorage.getItem("history"))||[];
    history.innerHTML="";
    h.forEach(d=>{
        history.innerHTML+=cardHTML(d);
    });
}

/* CLEAR */
function clearInputs(){
    potEl.value="";
    feeEl.value="";
    winEl.value="";
}

function clearTotals(){
    totals.innerHTML="";
}

function clearHistory(){
    localStorage.removeItem("history");
    history.innerHTML="";
}

const potEl=pot,feeEl=fee,winEl=winners;

/* INIT NOTICE */
setMode("non");

</script>

</body>
</html>
