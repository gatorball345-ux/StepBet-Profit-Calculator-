<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBet Profit Calculator</title>

<style>
body {
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

.app {
  max-width:420px;
  margin:auto;
  padding:20px 0;
}

input, #result, #historyContainer {
  width:92%;
  margin:auto;
  display:block;
}

input {
  padding:16px;
  margin-top:12px;
  background:#111827;
  border:none;
  border-radius:14px;
  color:white;
  text-align:center;
}

/* TOGGLE */
.toggle {
  width:92%;
  margin:14px auto;
  position:relative;
  background:#111827;
  border-radius:14px;
  padding:4px;
  height:44px;
  cursor:pointer;
}

.toggle-slider {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc(50% - 4px);
  background:#22c55e;
  border-radius:10px;
  transition:left 0.2s;
}

.toggle-track {
  position:absolute;
  inset:4px;
  display:flex;
}

.toggle-label {
  width:50%;
  text-align:center;
  line-height:36px;
  color:#9ca3af;
}

.toggle-label.active {
  color:white;
  font-weight:bold;
}

/* BUTTONS */
.button-row {
  width:92%;
  margin:16px auto;
  display:flex;
  gap:10px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  color:white;
}

.clear-input-btn { background:#374151; }
.calc-btn { background:#2563eb; }

/* RESULT */
#result {
  margin-top:20px;
  padding:18px;
  background:#111827;
  border-radius:14px;
}

.label { color:#22c55e; }

/* TEXT */
.fee-note {
  width:92%;
  margin:6px auto;
  font-size:12px;
  color:#9ca3af;
  text-align:center;
}

/* HISTORY */
.history-item {
  background:#111827;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<h2 style="text-align:center;">StepBet Profit Calculator</h2>

<input id="pot" placeholder="Total Pot">
<input id="fee" placeholder="Entry Fee">
<input id="winners" placeholder="Eligible Winners">

<div class="toggle" id="toggle">
  <div class="toggle-slider" id="slider"></div>
  <div class="toggle-track">
    <div id="nonMemberLabel" class="toggle-label active">Non-Member</div>
    <div id="memberLabel" class="toggle-label">Member</div>
  </div>
</div>

<div class="fee-note" id="feeNote"></div>

<div class="button-row">
  <button class="clear-input-btn" id="clearBtn">Clear Inputs</button>
  <button class="calc-btn" id="calcBtn">Calculate</button>
</div>

<div id="result"></div>

<h3 style="width:92%;margin:auto;">Recent</h3>
<div id="historyContainer"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

/* ELEMENTS */
const potInput = document.getElementById("pot");
const feeInput = document.getElementById("fee");
const winnersInput = document.getElementById("winners");
const result = document.getElementById("result");
const historyContainer = document.getElementById("historyContainer");

const toggle = document.getElementById("toggle");
const slider = document.getElementById("slider");
const memberLabel = document.getElementById("memberLabel");
const nonMemberLabel = document.getElementById("nonMemberLabel");
const feeNote = document.getElementById("feeNote");

const calcBtn = document.getElementById("calcBtn");
const clearBtn = document.getElementById("clearBtn");

/* STATE */
let isMember = false;
let historyData = [];

/* TOGGLE */
toggle.addEventListener("click", () => {
  isMember = !isMember;
  updateToggle();
});

function updateToggle() {
  const width = toggle.offsetWidth / 2;
  slider.style.left = isMember ? width + "px" : "4px";

  memberLabel.classList.toggle("active", isMember);
  nonMemberLabel.classList.toggle("active", !isMember);

  feeNote.textContent = isMember
    ? "Member games: no platform fee is deducted before payout calculations"
    : "Non-member games: 15% is deducted from the total pot before payout calculations";
}

/* CALCULATE */
calcBtn.addEventListener("click", () => {
  const pot = parseFloat(potInput.value);
  const fee = parseFloat(feeInput.value);
  const winners = parseFloat(winnersInput.value);

  if (!pot || !fee || !winners) {
    alert("Enter valid numbers");
    return;
  }

  let payout = pot / winners;
  if (!isMember) payout *= 0.85;

  const profit = payout - fee;
  const roi = (profit / fee) * 100;

  result.innerHTML = `
    <div><span class="label">Payout:</span> $${payout.toFixed(2)}</div>
    <div><span class="label">Profit:</span> ${(profit>=0?"+":"")}$${profit.toFixed(2)}</div>
    <div><span class="label">ROI:</span> ${roi.toFixed(1)}%</div>
  `;

  historyData.unshift({ payout, profit, roi, isMember });
  renderHistory();
});

/* HISTORY */
function renderHistory() {
  historyContainer.innerHTML = "";

  historyData.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <b>${item.isMember ? "Member" : "Non-Member"}</b><br>
      Payout: $${item.payout.toFixed(2)} |
      Profit: ${(item.profit>=0?"+":"")}$${item.profit.toFixed(2)} |
      ROI: ${item.roi.toFixed(1)}%
    `;

    historyContainer.appendChild(div);
  });
}

/* CLEAR */
clearBtn.addEventListener("click", () => {
  potInput.value = "";
  feeInput.value = "";
  winnersInput.value = "";
});

/* INIT */
updateToggle();

});
</script>

</body>
</html>
